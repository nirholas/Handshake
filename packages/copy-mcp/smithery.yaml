# Smithery deployment config for @three-ws/copy-mcp
# https://smithery.ai/docs/config#smitheryyaml
startCommand:
  type: stdio
  configSchema:
    type: object
    properties:
      threeWsApiKey:
        type: string
        description: >-
          three.ws bearer credential (API key sk_live_/sk_test_ or OAuth token).
          Required for every tool except a leader's public aggregate earnings.
      threeWsBase:
        type: string
        description: three.ws API deployment to talk to.
        default: https://three.ws
    required:
      - threeWsApiKey
  commandFunction: |
    (config) => ({
      command: "npx",
      args: ["-y", "@three-ws/copy-mcp"],
      env: {
        THREE_WS_API_KEY: config.threeWsApiKey,
        ...(config.threeWsBase ? { THREE_WS_BASE: config.threeWsBase } : {}),
      },
    })
