<!doctype html>
<html>
	<head>
		<meta charset="utf-8" />
		<title>sign preview</title>
		<style>
			html, body { margin: 0; background: #2f5bb7; }
			canvas { display: block; }
			#labels { position: fixed; inset: 0; pointer-events: none; font: 700 22px system-ui; color: #ffe600; }
			#labels div { position: absolute; }
		</style>
	</head>
	<body>
		<div id="labels"></div>
		<script type="module">
			import * as THREE from 'three';
			import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
			import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
			import { AnimationManager } from '/src/animation-manager.js';

			const params = new URLSearchParams(location.search);
			const which = params.get('mod') || 'new';
			const word = params.get('word') || 'ABCDEFGHIJKL';
			const cols = +(params.get('cols') || 4);
			const cellW = +(params.get('w') || 300);
			const cellH = +(params.get('h') || 340);
			const mode = params.get('mode') || 'letters'; // letters | frames | sign
			const camY = +(params.get('camy') || 0.62);

			const mod = which === 'old'
				? await import('/scripts/.scratch/fingerspelling-old.js')
				: await import('/src/fingerspelling.js');
			const dictUrl = '/src/sign-' + 'dictionary.js';
			const dict = (mode === 'sign' || mode === 'vocab') ? await import(/* @vite-ignore */ dictUrl) : null;

			// Build the clip + the times to sample.
			let clip, samples;
			if (mode === 'vocab') {
				// One cell per sign, at the moment its last phase lands.
				const words = (params.get('words') || Object.keys(dict.SIGNS).join(',')).split(',');
				window.__vocab = words.map((w) => ({ word: w, clip: dict.buildSignClip(w) }));
				clip = window.__vocab[0].clip;
				samples = window.__vocab.map((v) => ({ t: v.clip.duration - 0.42, label: v.word, word: v.word }));
			} else if (mode === 'sign' && dict) {
				clip = dict.buildSignClip(word);
				const n = +(params.get('n') || 8);
				samples = Array.from({ length: n }, (_, i) => ({
					t: (clip.duration * (i + 0.5)) / n,
					label: `${(clip.duration * (i + 0.5) / n).toFixed(2)}s`,
				}));
			} else if (mode === 'frames') {
				clip = mod.buildFingerspellingClip(word);
				const n = +(params.get('n') || 12);
				samples = Array.from({ length: n }, (_, i) => ({ t: (clip.duration * i) / (n - 1), label: `${((clip.duration * i) / (n - 1)).toFixed(2)}s` }));
			} else {
				// One cell per letter, sampled in the middle of that letter's hold.
				const letters = [...word.toUpperCase().replace(/[^A-Z0-9]/g, '')];
				clip = mod.buildFingerspellingClip(letters.join(''));
				const T = mod.DEFAULT_TIMING;
				let t = T.leadSeconds;
				samples = letters.map((ch) => {
					if (ch === 'J' || ch === 'Z') {
						const mid = t + T.transitionSeconds + T.motionSeconds * 0.85;
						t = t + T.transitionSeconds + T.motionSeconds;
						return { t: mid, label: ch };
					}
					const mid = t + T.transitionSeconds + T.holdSeconds * 0.6;
					t = t + T.transitionSeconds + T.holdSeconds;
					return { t: mid, label: ch };
				});
			}

			const rows = Math.ceil(samples.length / cols);
			const W = cols * cellW;
			const H = rows * cellH;

			const renderer = new THREE.WebGLRenderer({ antialias: true });
			renderer.setPixelRatio(1);
			renderer.setSize(W, H);
			renderer.outputColorSpace = THREE.SRGBColorSpace;
			renderer.toneMapping = THREE.ACESFilmicToneMapping;
			renderer.autoClear = false;
			renderer.setScissorTest(true);
			document.body.appendChild(renderer.domElement);

			const scene = new THREE.Scene();
			scene.background = new THREE.Color(0x2f5bb7);
			const pmrem = new THREE.PMREMGenerator(renderer);
			scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
			scene.add(new THREE.HemisphereLight(0xffffff, 0x39404d, 1.0));
			const key = new THREE.DirectionalLight(0xffffff, 1.6);
			key.position.set(1.5, 2.5, 3);
			scene.add(key, new THREE.AmbientLight(0xffffff, 0.4));

			const { getMeshoptDecoder } = await import('/src/viewer/internal.js');
			const loader = new GLTFLoader();
			loader.setMeshoptDecoder(await getMeshoptDecoder());
			const gltf = await loader.loadAsync('/avatars/cz.glb');
			const model = gltf.scene;
			model.traverse((n) => { if (n.isMesh) n.frustumCulled = false; });
			scene.add(model);

			const anim = new AnimationManager();
			anim.attach(model);
			const actions = new Map();
			if (mode === 'vocab') {
				for (const v of window.__vocab) {
					anim.injectClip(v.word, v.clip, { loop: false });
					const a = anim.actions.get(v.word);
					if (!a) throw new Error('clip did not bind: ' + v.word);
					actions.set(v.word, a);
				}
			} else {
				anim.injectClip('sign', clip, { loop: false });
				const a = anim.actions.get('sign');
				if (!a) throw new Error('clip did not bind');
				actions.set('sign', a);
			}
			const action = actions.values().next().value;
			action.play();
			action.paused = true;

			const camera = new THREE.PerspectiveCamera(30, cellW / cellH, 0.05, 50);

			const labels = document.getElementById('labels');
			samples.forEach((s, i) => {
				const col = i % cols;
				const row = (i / cols) | 0;
				const el = document.createElement('div');
				el.textContent = s.label;
				el.style.left = `${col * cellW + 12}px`;
				el.style.top = `${row * cellH + 10}px`;
				labels.appendChild(el);
			});

			renderer.clear();
			samples.forEach((s, i) => {
				// A fresh mixer per cell: swapping actions on one mixer leaves stale
				// accumulator state that silently blends toward the bind pose.
				const src = s.word ? actions.get(s.word) : action;
				const m = new THREE.AnimationMixer(model);
				const act = m.clipAction(src.getClip());
				act.play();
				act.paused = true;
				act.time = Math.max(0, s.t);
				m.update(0);
				model.updateWorldMatrix(true, true);

				const col = i % cols;
				const row = (i / cols) | 0;
				const x = col * cellW;
				const y = H - (row + 1) * cellH;
				renderer.setViewport(x, y, cellW, cellH);
				renderer.setScissor(x, y, cellW, cellH);
				// Track the head so a clip that moves the root still frames the signing.
				let head = null;
				model.traverse((n) => { if (!head && /head$/i.test(n.name)) head = n; });
				const hp = new THREE.Vector3();
				head.getWorldPosition(hp);
				const focus = new THREE.Vector3(0, hp.y - 0.36, 0);
				camera.position.set(0, focus.y + 0.18, 2.0);
				camera.lookAt(focus);
				camera.updateProjectionMatrix();
				renderer.render(scene, camera);
			});
			document.title = 'ready';
		</script>
	</body>
</html>
