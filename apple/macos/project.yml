# XcodeGen spec for the three.ws Glance Mac app and its widget extension.
#
#   brew install xcodegen        # once
#   cd apple/macos && xcodegen generate && open ThreeWSGlance.xcodeproj
#
# The project is generated rather than committed on purpose: a hand-maintained
# .xcodeproj is a merge conflict waiting to happen, and this file says what the
# two targets actually are in thirty readable lines. The iOS widget is the same
# extension sources laid into the Capacitor project instead, because that one is
# generated by Capacitor and already committed.
#
# Signing: set DEVELOPMENT_TEAM (Xcode's Signing and Capabilities tab, or
# `xcodebuild ... DEVELOPMENT_TEAM=XXXXXXXXXX`). It is not committed because it
# is per-account, and both the App Group and the keychain group are derived from
# it: on a Mac distributed with a Developer ID the App Group identifier must
# carry the team prefix, which is exactly the rule iOS does not have.
name: ThreeWSGlance
options:
  bundleIdPrefix: ws.three
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "14.0"
  groupSortPosition: top

settings:
  base:
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "1.0.0"
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: true
    SWIFT_STRICT_CONCURRENCY: minimal
    GLANCE_ORIGIN: https://three.ws
    # Both identifiers are team-prefixed here. On a Mac that is required
    # outside the Mac App Store; on iPhone it is forbidden, which is why
    # GlanceKit reads them from the Info.plist instead of hard coding either.
    GLANCE_APP_GROUP: $(DEVELOPMENT_TEAM).group.ws.three.glance
    GLANCE_KEYCHAIN_GROUP: $(DEVELOPMENT_TEAM).ws.three.shared

targets:
  ThreeWSGlance:
    type: application
    platform: macOS
    sources:
      - path: ThreeWSGlance
      - path: ../GlanceKit
        name: GlanceKit
    settings:
      base:
        PRODUCT_NAME: ThreeWSGlance
        PRODUCT_BUNDLE_IDENTIFIER: ws.three.glance
        INFOPLIST_FILE: ThreeWSGlance/Info.plist
        CODE_SIGN_ENTITLEMENTS: ThreeWSGlance/ThreeWSGlance.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        COMBINE_HIDPI_IMAGES: true
    dependencies:
      - target: GlanceWidget
        embed: true
        codeSign: true

  GlanceWidget:
    type: app-extension
    platform: macOS
    sources:
      - path: ../GlanceWidget
        name: GlanceWidget
      - path: ../GlanceKit
        name: GlanceKit
    settings:
      base:
        PRODUCT_NAME: GlanceWidget
        PRODUCT_BUNDLE_IDENTIFIER: ws.three.glance.widget
        INFOPLIST_FILE: ../GlanceWidget/Info.plist
        CODE_SIGN_ENTITLEMENTS: ../GlanceWidget/GlanceWidget.entitlements
        SKIP_INSTALL: true
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework

schemes:
  ThreeWSGlance:
    build:
      targets:
        ThreeWSGlance: all
        GlanceWidget: all
    run:
      config: Debug
    archive:
      config: Release
