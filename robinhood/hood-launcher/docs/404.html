<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>hood-launcher: scrubbed (404)</title>
<meta name="robots" content="noindex" />
<link rel="canonical" href="https://nirholas.github.io/hood-launcher/" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%230b0b0c'/><path d='M16 4 C20 9 20 17 16 26 C12 17 12 9 16 4 Z M11 20 L8 27 M21 20 L24 27' fill='none' stroke='%23e7e5df' stroke-width='1.5'/></svg>" />
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{--ink:#0b0b0c;--paper:#e7e5df;--graphite:#807c74;--mono:ui-monospace,"SFMono-Regular","Menlo","Consolas",monospace;--grot:"Helvetica Neue","Inter","Arial",system-ui,sans-serif}
  body{background:var(--ink);color:var(--paper);font-family:var(--grot);min-height:100svh;display:flex;align-items:center;padding:clamp(24px,6vw,88px);-webkit-font-smoothing:antialiased}
  body::before{content:"";position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(231,229,223,.028) 0 1px,transparent 1px 3px);opacity:.5}
  .eyebrow{font:600 11px/1 var(--mono);letter-spacing:.34em;text-transform:uppercase;color:var(--graphite);margin-bottom:22px}
  h1{font-weight:700;letter-spacing:-.03em;line-height:.95;font-size:clamp(44px,10vw,120px)}
  p{margin-top:20px;max-width:46ch;font-size:clamp(15px,1.6vw,20px);color:#b7b4ad;line-height:1.44}
  a.btn{display:inline-block;margin-top:30px;border:1px solid var(--paper);color:var(--paper);text-decoration:none;font:600 12px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;padding:15px 24px;transition:background .25s,color .25s}
  a.btn:hover{background:var(--paper);color:var(--ink)}
</style>
</head>
<body>
<div>
  <div class="eyebrow">404 · launch scrubbed</div>
  <h1>Hold. Hold.<br>Scrub.</h1>
  <p>No vehicle on this pad. The countdown is back at the gantry: configure a token, throw the lever, run the sequence.</p>
  <a class="btn" href="/hood-launcher/">back to the pad</a>
</div>
</body>
</html>
