<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>404 · hood-traders</title>
<meta name="robots" content="noindex" />

<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{--bg:#0a0b0b;--ph:#e2e6e2;--mid:#6a706b;--line:rgba(226,230,226,.30);
    --mono:ui-monospace,"SFMono-Regular","Menlo","Consolas",monospace;
    --sans:"Helvetica Neue","Inter","Arial",system-ui,sans-serif}
  body{background:var(--bg);color:var(--ph);font-family:var(--sans);min-height:100svh;
    display:flex;align-items:center;justify-content:center;padding:32px}
  body::before{content:"";position:fixed;inset:0;pointer-events:none;
    background:repeating-linear-gradient(0deg,rgba(226,230,226,.02) 0 1px,transparent 1px 3px);opacity:.7}
  body::after{content:"";position:fixed;inset:0;pointer-events:none;
    background:radial-gradient(120% 90% at 50% 40%,transparent 55%,rgba(0,0,0,.55) 100%)}
  .w{max-width:520px;position:relative;z-index:2}
  .n{font:600 11px/1 var(--mono);letter-spacing:.3em;text-transform:uppercase;color:var(--mid);
    display:flex;align-items:center;gap:12px;margin-bottom:24px}
  .n::after{content:"";flex:1;height:1px;background:var(--line)}
  h1{font:700 clamp(56px,16vw,130px)/.85 var(--sans);letter-spacing:-.04em}
  p{margin-top:18px;color:#b7bcb7;font-size:18px;line-height:1.5;max-width:44ch}
  a{display:inline-block;margin-top:28px;border:1px solid var(--ph);color:var(--ph);text-decoration:none;
    font:600 12px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;padding:15px 22px;transition:background .25s,color .25s}
  a:hover{background:var(--ph);color:var(--bg)}
</style>
</head>
<body>
  <div class="w">
    <div class="n">404 · off the scope</div>
    <h1>404</h1>
    <p>No return on this bearing. The page you swept for isn't in the fleet, nothing painted a blip here.</p>
    <a href="/hood-traders/">← back to the radar</a>
  </div>
</body>
</html>
