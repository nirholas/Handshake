<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>hood-js: off the scale (404)</title>
<meta name="robots" content="noindex" />
<link rel="canonical" href="https://nirholas.github.io/hood-js/" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%23131313'/><path d='M16 6 V24 M8 24 H24 M6 12 H26' fill='none' stroke='%23f3f2ee' stroke-width='1.6'/><path d='M6 12 L3 18 H9 Z M26 12 L23 18 H29 Z' fill='none' stroke='%23f3f2ee' stroke-width='1.4'/></svg>" />
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{--ink:#131313;--paper:#f3f2ee;--graphite:#736f68;--mono:ui-monospace,"SFMono-Regular","Menlo","Consolas",monospace;--grot:"Helvetica Neue","Inter","Arial",system-ui,sans-serif}
  body{background:var(--paper);color:var(--ink);font-family:var(--grot);min-height:100svh;display:flex;align-items:center;padding:clamp(24px,6vw,88px);-webkit-font-smoothing:antialiased}
  body::before{content:"";position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(19,19,19,.022) 0 1px,transparent 1px 4px);mix-blend-mode:multiply;opacity:.6}
  .eyebrow{font:600 11px/1 var(--mono);letter-spacing:.34em;text-transform:uppercase;color:var(--graphite);margin-bottom:22px}
  h1{font-weight:700;letter-spacing:-.03em;line-height:.95;font-size:clamp(44px,10vw,120px)}
  p{margin-top:20px;max-width:46ch;font-size:clamp(15px,1.6vw,20px);color:#2a2925;line-height:1.44}
  a.btn{display:inline-block;margin-top:30px;border:1px solid var(--ink);color:var(--ink);text-decoration:none;font:600 12px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;padding:15px 24px;transition:background .25s,color .25s}
  a.btn:hover{background:var(--ink);color:var(--paper)}
</style>
</head>
<body>
<div>
  <div class="eyebrow">404 · unweighable</div>
  <h1>Nothing on<br>this pan.</h1>
  <p>That route has no weight. The scale is back at the top: 4.55 kB gzipped, sideEffects:false, five lines to your first trade.</p>
  <a class="btn" href="/hood-js/">back to the balance</a>
</div>
</body>
</html>
