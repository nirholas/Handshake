<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>hood-tokenlist — card not on file</title>
<meta name="robots" content="noindex" />
<link rel="canonical" href="https://nirholas.github.io/hood-tokenlist/" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%231a1712'/><rect x='5' y='7' width='22' height='8' fill='none' stroke='%23efeadd' stroke-width='1.6'/><rect x='5' y='17' width='22' height='8' fill='none' stroke='%23efeadd' stroke-width='1.6'/><circle cx='16' cy='11' r='1.4' fill='%23efeadd'/><circle cx='16' cy='21' r='1.4' fill='%23efeadd'/></svg>" />
<style>
  :root{--ink:#1a1712;--card:#efeadd;--cabinet:#c8c2b3;--mid:#6d6858;--hair2:rgba(26,23,18,.34);
    --serif:"Iowan Old Style",Palatino,Georgia,"Times New Roman",serif;
    --mono:ui-monospace,"SFMono-Regular","Menlo","Consolas",monospace;}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--cabinet);color:var(--ink);font-family:var(--serif);min-height:100vh;
    display:flex;align-items:center;justify-content:center;padding:24px;
    background-image:repeating-linear-gradient(0deg,rgba(26,23,18,.02) 0 1px,transparent 1px 4px)}
  ::selection{background:var(--ink);color:var(--card)}
  .card{width:min(440px,92vw);background:var(--card);padding:34px 32px 30px;position:relative;
    box-shadow:0 26px 50px -34px rgba(26,23,18,.9),inset 0 0 0 1px var(--hair2);
    background-image:linear-gradient(var(--card) 0 0),repeating-linear-gradient(0deg,transparent 0 30px,rgba(26,23,18,.12) 30px 31px);
    background-position:0 0,0 90px;background-repeat:no-repeat,repeat}
  .card::before{content:"";position:absolute;left:52px;top:0;bottom:0;width:1.5px;background:var(--hair2)}
  .tab{font:700 9px/1 var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--card);background:var(--ink);padding:6px 9px;display:inline-block;margin-left:42px}
  .glyph{font:700 clamp(52px,15vw,84px)/.85 var(--serif);margin:20px 0 4px 42px;letter-spacing:-.02em}
  .name{font-style:italic;font-size:20px;margin:0 0 0 42px;color:#2b2820}
  p{font:500 12.5px/1.6 var(--mono);color:var(--mid);margin:18px 0 0 42px;max-width:34ch}
  a.btn{display:inline-block;margin:24px 0 0 42px;text-decoration:none;border:1.5px solid var(--ink);background:var(--ink);color:var(--card);
    font:700 11px/1 var(--mono);letter-spacing:.13em;text-transform:uppercase;padding:14px 20px;
    transition:background .25s,color .25s,transform .25s cubic-bezier(.16,1,.3,1)}
  a.btn:hover{background:transparent;color:var(--ink);transform:translateY(-2px)}
</style>
</head>
<body>
  <div class="card">
    <span class="tab">not on file</span>
    <div class="glyph">404</div>
    <div class="name">This card is not in the drawer.</div>
    <p>The catalog has no entry at this call number. Head back and pull a drawer that exists.</p>
    <a class="btn" href="/hood-tokenlist/">Back to the catalog</a>
  </div>
</body>
</html>
