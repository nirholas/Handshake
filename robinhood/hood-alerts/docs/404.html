<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>hood-alerts: signal lost (404)</title>
<meta name="robots" content="noindex" />
<link rel="canonical" href="https://nirholas.github.io/hood-alerts/" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%230b0b0c'/><g fill='none' stroke='%23e9e6df' stroke-width='2' stroke-linecap='round'><path d='M3 16 L12 16 L15 8 L18 24 L21 16 L29 16'/></g><circle cx='24' cy='16' r='2.4' fill='%23e9e6df'/></svg>" />
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{--ink:#0b0b0c;--paper:#e9e6df;--graphite:#8b877f;
    --mono:ui-monospace,"SFMono-Regular","Menlo","Consolas",monospace;
    --grot:"Helvetica Neue","Inter","Arial",system-ui,sans-serif}
  body{background:var(--ink);color:var(--paper);font-family:var(--grot);min-height:100vh;
    display:flex;flex-direction:column;justify-content:center;padding:clamp(24px,6vw,88px);gap:22px}
  .eyebrow{font:600 11px/1 var(--mono);letter-spacing:.34em;text-transform:uppercase;color:var(--graphite)}
  h1{font-size:clamp(48px,11vw,140px);font-weight:700;letter-spacing:-.03em;line-height:.9}
  p{max-width:52ch;font-size:clamp(16px,1.7vw,21px);color:#b3afa6;line-height:1.5}
  svg{width:clamp(180px,42vw,340px);height:auto}
  .lane{stroke:rgba(233,230,223,.2);stroke-width:1}
  .sig{fill:none;stroke:var(--paper);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;
    stroke-dasharray:220;stroke-dashoffset:0;animation:flat 3s var(--ease,cubic-bezier(.16,1,.3,1)) infinite}
  @keyframes flat{0%{stroke-dashoffset:220}45%,55%{stroke-dashoffset:0}100%{stroke-dashoffset:-220}}
  @media(prefers-reduced-motion:reduce){.sig{animation:none;stroke-dashoffset:0}}
  a{display:inline-flex;align-self:flex-start;text-decoration:none;border:1px solid rgba(233,230,223,.3);color:var(--paper);
    font:600 12px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;padding:15px 22px;
    transition:background .25s,color .25s}
  a:hover{background:var(--paper);color:var(--ink)}
</style>
</head>
<body>
  <div class="eyebrow">404 / signal lost</div>
  <svg viewBox="0 0 240 60" aria-hidden="true">
    <line class="lane" x1="0" y1="30" x2="240" y2="30"/>
    <path class="sig" d="M0 30 L70 30 L82 10 L96 50 L108 30 L240 30"/>
  </svg>
  <h1>Off the wire.</h1>
  <p>No detector fired for that path, because it doesn't exist. Head back to the wire, flip a switch, and watch the ticker fill.</p>
  <a href="https://nirholas.github.io/hood-alerts/">back to the wire</a>
</body>
</html>
