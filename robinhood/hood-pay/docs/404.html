<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>hood-pay — receipt not found</title>
<meta name="robots" content="noindex" />
<link rel="canonical" href="https://nirholas.github.io/hood-pay/" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%23141310'/><rect x='9' y='5' width='14' height='22' fill='none' stroke='%23eceae3' stroke-width='2'/><path d='M9 27 l2-2 2 2 2-2 2 2 2-2 2 2 2-2' fill='none' stroke='%23eceae3' stroke-width='1.4'/><path d='M12 11h8M12 15h8M12 19h5' stroke='%23eceae3' stroke-width='1.4'/></svg>" />
<style>
  :root{--ink:#141310;--paper:#eceae3;--bed:#d6d3c9;--mid:#6f6b61;--hair2:rgba(20,19,16,.34);
    --mono:ui-monospace,"SFMono-Regular","JetBrains Mono","Menlo","Consolas",monospace;
    --grot:"Helvetica Neue","Inter","Arial",system-ui,sans-serif;}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bed);color:var(--ink);font-family:var(--mono);min-height:100vh;
    display:flex;align-items:center;justify-content:center;padding:24px;
    background-image:repeating-linear-gradient(0deg,rgba(20,19,16,.03) 0 1px,transparent 1px 3px)}
  ::selection{background:var(--ink);color:var(--paper)}
  .tape{width:min(400px,92vw);background:var(--paper);padding:34px 30px 30px;text-align:center;
    box-shadow:0 30px 60px -40px rgba(20,19,16,.7),-12px 0 20px -18px rgba(20,19,16,.5),12px 0 20px -18px rgba(20,19,16,.5)}
  .lead{font:600 10px/1 var(--mono);letter-spacing:.34em;text-transform:uppercase;color:var(--mid);margin-bottom:20px}
  h1{font:700 clamp(48px,16vw,90px)/.9 var(--grot);letter-spacing:-.04em}
  p{font:500 13px/1.6 var(--mono);color:#2b2822;margin:16px auto 0;max-width:32ch}
  .rule{border:0;border-top:1px dashed var(--hair2);margin:22px 0}
  .barcode{height:34px;margin:20px 0 22px;
    background:repeating-linear-gradient(90deg,var(--ink) 0 2px,transparent 2px 3px,var(--ink) 3px 4px,transparent 4px 7px,var(--ink) 7px 10px,transparent 10px 12px);opacity:.86}
  a.btn{display:inline-block;text-decoration:none;border:1.5px solid var(--ink);background:var(--ink);color:var(--paper);
    font:700 11px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;padding:14px 22px;
    transition:background .25s,color .25s,transform .25s cubic-bezier(.16,1,.3,1)}
  a.btn:hover{background:transparent;color:var(--ink);transform:translateY(-2px)}
</style>
</head>
<body>
  <div class="tape">
    <div class="lead">// void transaction</div>
    <h1>404</h1>
    <p>No receipt printed at this path. The payment you are looking for was never rung up here.</p>
    <div class="barcode" aria-hidden="true"></div>
    <hr class="rule" />
    <a class="btn" href="/hood-pay/">Back to the terminal</a>
  </div>
</body>
</html>
