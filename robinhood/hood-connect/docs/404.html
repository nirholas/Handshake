<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>hood-connect: off the track (404)</title>
<meta name="robots" content="noindex" />
<link rel="canonical" href="https://nirholas.github.io/hood-connect/" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%23111013'/><circle cx='16' cy='9' r='3.4' fill='%23eceae3'/><path d='M6 15 L26 20 M26 20 L6 25' fill='none' stroke='%23eceae3' stroke-width='1.6'/><circle cx='16' cy='28' r='2' fill='%23eceae3'/></svg>" />
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{--ink:#111013;--paper:#eceae3;--graphite:#77746d;--mono:ui-monospace,"SFMono-Regular","Menlo","Consolas",monospace;--grot:"Helvetica Neue","Inter","Arial",system-ui,sans-serif}
  body{background:var(--paper);color:var(--ink);font-family:var(--grot);min-height:100svh;display:flex;align-items:center;padding:clamp(24px,6vw,88px);-webkit-font-smoothing:antialiased}
  body::before{content:"";position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(17,16,19,.03) 0 1px,transparent 1px 3px);mix-blend-mode:multiply;opacity:.5}
  .eyebrow{font:600 11px/1 var(--mono);letter-spacing:.34em;text-transform:uppercase;color:var(--graphite);margin-bottom:22px}
  h1{font-weight:700;letter-spacing:-.03em;line-height:.95;font-size:clamp(44px,10vw,120px)}
  p{margin-top:20px;max-width:46ch;font-size:clamp(15px,1.6vw,20px);color:#2b2823;line-height:1.44}
  a.btn{display:inline-block;margin-top:30px;border:1px solid var(--ink);color:var(--ink);text-decoration:none;font:600 12px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;padding:15px 24px;transition:background .25s,color .25s}
  a.btn:hover{background:var(--ink);color:var(--paper)}
  .marble{width:14px;height:14px;border-radius:50%;background:var(--ink);display:inline-block;vertical-align:baseline;margin-left:2px}
</style>
</head>
<body>
<div>
  <div class="eyebrow">404 · chain 4663</div>
  <h1>The marble<br>rolled off.<span class="marble"></span></h1>
  <p>That path never landed in the basin. The on-ramp is back at the top: add the network, fund the wallet, connect.</p>
  <a class="btn" href="/hood-connect/">back to the on-ramp</a>
</div>
</body>
</html>
