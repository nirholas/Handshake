[profile.default]
src = "src"
out = "out"
test = "test"
libs = ["lib", "dependencies"]
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 200

# Fork tests read live Stock Tokens on Robinhood Chain mainnet (read-only):
#   forge test --fork-url https://rpc.mainnet.chain.robinhood.com
[rpc_endpoints]
robinhood = "https://rpc.mainnet.chain.robinhood.com"

[dependencies]
forge-std = "1.9.7"
