<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>404 · hood402</title>
<meta name="robots" content="noindex" />

<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{--bg:#0c0d0e;--fg:#e8e6e1;--mid:#75726b;--line:rgba(232,230,225,.30);
    --mono:ui-monospace,"SFMono-Regular","Menlo","Consolas",monospace;
    --sans:"Helvetica Neue","Inter","Arial",system-ui,sans-serif}
  body{background:var(--bg);color:var(--fg);font-family:var(--sans);min-height:100svh;
    display:flex;align-items:center;justify-content:center;padding:32px;overflow:hidden}
  body::before{content:"";position:fixed;inset:0;pointer-events:none;
    background:repeating-linear-gradient(0deg,rgba(255,255,255,.018) 0 1px,transparent 1px 3px);opacity:.6}
  .w{max-width:520px;position:relative;z-index:2}
  .n{font:600 11px/1 var(--mono);letter-spacing:.32em;text-transform:uppercase;color:var(--mid);
    display:flex;align-items:center;gap:12px;margin-bottom:26px}
  .n::after{content:"";flex:1;height:1px;background:var(--line)}
  h1{font:700 clamp(64px,18vw,150px)/.85 var(--sans);letter-spacing:-.04em}
  p{margin-top:20px;color:#c9c6bf;font-size:18px;line-height:1.5;max-width:44ch}
  p b{color:var(--fg)}
  a{display:inline-block;margin-top:30px;border:1px solid var(--fg);color:var(--fg);text-decoration:none;
    font:600 12px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;padding:15px 22px;
    transition:background .25s,color .25s}
  a:hover{background:var(--fg);color:var(--bg)}
</style>
</head>
<body>
  <div class="w">
    <div class="n">404 · not found</div>
    <h1>404</h1>
    <p>This route has no <b>402</b> to pay. There's nothing to unlock here — the resource you asked for isn't on the rail.</p>
    <a href="/hood402/">← back to the gate</a>
  </div>
</body>
</html>
