<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>robinhood-chain-examples, no frame on this exposure</title>
<meta name="description" content="That frame isn't on the roll. Return to the contact sheet and develop the fourteen runnable Robinhood Chain examples." />
<meta name="robots" content="noindex" />
<link rel="canonical" href="https://nirholas.github.io/robinhood-chain-examples/" />
<meta name="theme-color" content="#0a0a0b" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%230a0a0b'/><rect x='6' y='9' width='20' height='14' fill='none' stroke='%23e6e4de' stroke-width='1.6'/><rect x='4' y='6' width='3' height='2.4' fill='%23e6e4de'/><rect x='11' y='6' width='3' height='2.4' fill='%23e6e4de'/><rect x='18' y='6' width='3' height='2.4' fill='%23e6e4de'/><rect x='25' y='6' width='3' height='2.4' fill='%23e6e4de'/><rect x='4' y='23.6' width='3' height='2.4' fill='%23e6e4de'/><rect x='11' y='23.6' width='3' height='2.4' fill='%23e6e4de'/><rect x='18' y='23.6' width='3' height='2.4' fill='%23e6e4de'/><rect x='25' y='23.6' width='3' height='2.4' fill='%23e6e4de'/></svg>" />
<style>
  :root{--ink:#0a0a0b;--film:#17171a;--paper:#e6e4de;--graphite:#79776f;--hair2:rgba(230,228,222,.26);
    --mono:ui-monospace,"SFMono-Regular","JetBrains Mono","Menlo","Consolas",monospace;
    --grot:"Helvetica Neue","Inter","Arial",system-ui,sans-serif;--ease:cubic-bezier(.16,1,.3,1)}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--ink);color:var(--paper);font-family:var(--grot);min-height:100svh;
    display:flex;align-items:center;justify-content:center;padding:32px;-webkit-font-smoothing:antialiased}
  .wrap{max-width:56ch}
  .eyebrow{font:600 11px/1 var(--mono);letter-spacing:.3em;text-transform:uppercase;color:var(--graphite);margin-bottom:24px;display:flex;gap:12px;align-items:center}
  .eyebrow::after{content:"";flex:1;height:1px;background:rgba(230,228,222,.13)}
  .blank{border:1px solid var(--hair2);background:repeating-linear-gradient(135deg,var(--film) 0 9px,#131315 9px 18px);
    aspect-ratio:4/1;display:flex;align-items:center;justify-content:center;margin-bottom:28px}
  .blank span{font:600 10px/1 var(--mono);letter-spacing:.24em;text-transform:uppercase;color:var(--graphite);border:1px solid var(--hair2);padding:8px 12px}
  h1{font-weight:700;letter-spacing:-.03em;line-height:.98;font-size:clamp(38px,8vw,84px)}
  h1 .lo{color:var(--graphite)}
  p{margin-top:22px;font-size:clamp(16px,1.6vw,20px);color:#c5c2bb;line-height:1.5;max-width:48ch}
  a.btn{display:inline-block;margin-top:28px;text-decoration:none;border:1px solid var(--paper);color:var(--paper);
    font:600 12px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;padding:15px 22px;transition:background .25s,color .25s,transform .25s var(--ease)}
  a.btn:hover{background:var(--paper);color:var(--ink);transform:translateY(-2px)}
</style>
</head>
<body>
  <div class="wrap">
    <div class="eyebrow">404 / no exposure</div>
    <div class="blank"><span>&#215; blank</span></div>
    <h1>This frame<br>never exposed. <span class="lo">404.</span></h1>
    <p>There's nothing on this part of the roll. The fourteen real frames are back on the contact sheet, waiting to be developed.</p>
    <a class="btn" href="/robinhood-chain-examples/">&#8592; back to the contact sheet</a>
  </div>
</body>
</html>
