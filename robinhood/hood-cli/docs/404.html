<style>
  :root{
    --ink:#0b0b0c; --paper:#e9e6df; --graphite:#78746c; --white:#f7f5f0;
    --hair:rgba(11,11,12,.15); --hair2:rgba(11,11,12,.30); --hair3:rgba(11,11,12,.45);
    --mono:ui-monospace,"SFMono-Regular","JetBrains Mono","Menlo","Consolas",monospace;
    --grot:"Helvetica Neue","Inter","Arial",system-ui,sans-serif;
    --ease:cubic-bezier(.16,1,.3,1);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  html{-webkit-text-size-adjust:100%}
  body{background:var(--ink); color:var(--paper); font-family:var(--mono); font-size:clamp(13px,1.05vw,15.5px);
    line-height:1.6; overflow:hidden; -webkit-font-smoothing:antialiased}
  ::selection{background:var(--paper); color:var(--ink)}
  a{color:inherit; text-decoration:none}
  .b{font-weight:700}
  .dim{color:var(--graphite)}
  .ac{color:var(--white); font-weight:700}

  /* film grain + scanline, on the dark terminal */
  body::before{content:""; position:fixed; inset:0; z-index:60; pointer-events:none;
    background:repeating-linear-gradient(0deg,rgba(233,230,223,.028) 0 1px,transparent 1px 3px); opacity:.6}
  .scan{position:fixed; left:0; right:0; height:2px; z-index:59; pointer-events:none;
    background:linear-gradient(90deg,transparent,rgba(233,230,223,.16),transparent);
    animation:scan 8s linear infinite; will-change:transform}
  @keyframes scan{0%{transform:translateY(-4vh)}100%{transform:translateY(104vh)}}
  @media(prefers-reduced-motion:reduce){.scan{display:none} *{animation-duration:.001s!important}}

  /* the terminal fills the viewport */
  .term{position:fixed; inset:0; display:flex; flex-direction:column;
    padding:clamp(12px,2.4vw,30px); gap:clamp(10px,1.4vw,16px)}
  .frame{flex:1; min-height:0; display:flex; flex-direction:column; border:1px solid var(--hair2);
    background:linear-gradient(180deg,rgba(233,230,223,.02),transparent)}

  .bar{display:flex; align-items:center; gap:14px; padding:12px 16px; border-bottom:1px solid var(--hair2)}
  .lights{display:flex; gap:7px}
  .lights i{width:10px; height:10px; border-radius:50%; border:1px solid var(--hair3); display:block}
  .bar .ttl{font:600 11px/1 var(--mono); letter-spacing:.18em; text-transform:uppercase; color:var(--paper)}
  .bar .meta{margin-left:auto; font:500 10px/1 var(--mono); letter-spacing:.14em; text-transform:uppercase; color:var(--graphite)}
  @media(max-width:560px){.bar .meta{display:none}}

  .screen{flex:1; min-height:0; overflow-y:auto; padding:clamp(14px,2vw,26px) clamp(14px,2.2vw,28px) 6px;
    scrollbar-width:thin; scrollbar-color:var(--hair3) transparent}
  .screen::-webkit-scrollbar{width:8px}
  .screen::-webkit-scrollbar-thumb{background:var(--hair3)}
  .out{margin-bottom:16px}
  .out .cmdline{color:var(--graphite); margin-bottom:6px; white-space:pre-wrap; word-break:break-word}
  .out .cmdline .pr{color:var(--paper)}
  .out .cmdline .arrow{color:var(--white)}
  .out .cmdline .txt{color:var(--paper)}
  .body{white-space:pre-wrap; word-break:break-word}
  .body .glyph{color:var(--white)}
  .body .rowk{color:var(--graphite)}
  .body a{border-bottom:1px solid var(--hair3)}
  .body a:hover{border-color:var(--paper)}
  .enter{opacity:0; transform:translateY(4px); animation:enter .34s var(--ease) forwards}
  @keyframes enter{to{opacity:1; transform:none}}

  /* boot banner ascii */
  .banner{color:var(--paper); line-height:1.15; font-size:clamp(9px,1.5vw,13px); white-space:pre; overflow-x:auto; margin-bottom:6px}
  .banner .sub{display:block; font-size:clamp(10px,1.1vw,12px); color:var(--graphite); line-height:1.6; margin-top:10px; white-space:pre-wrap}

  /* stocks table */
  .tbl{display:block; overflow-x:auto; margin-top:2px}
  .tbl table{border-collapse:collapse; min-width:520px; width:100%}
  .tbl th,.tbl td{text-align:left; padding:3px 16px 3px 0; white-space:nowrap; font-weight:400}
  .tbl th{color:var(--graphite); font-weight:400; border-bottom:1px solid var(--hair2); padding-bottom:7px; letter-spacing:.04em}
  .tbl td.sym{color:var(--paper); font-weight:700}
  .tbl td.nm,.tbl td.age,.tbl td.addr{color:var(--graphite)}
  .tbl tr td{border-bottom:1px solid rgba(233,230,223,.06)}
  .tbl tr:last-child td{border-bottom:0}

  .kv{display:grid; grid-template-columns:max-content 1fr; gap:2px 22px; margin-top:2px}
  .kv .k{color:var(--graphite)}
  .kv .v{color:var(--paper)}
  .kv .v.b{font-weight:700}

  .cmdgrid{display:grid; grid-template-columns:max-content 1fr; gap:3px 20px; margin-top:4px}
  .cmdgrid .c{color:var(--white); font-weight:700}
  .cmdgrid .d{color:var(--graphite)}

  /* the prompt / input line — the ONLY interface */
  .prompt{display:flex; align-items:flex-start; gap:10px; padding:14px clamp(14px,2.2vw,28px) 16px;
    border-top:1px solid var(--hair2); background:rgba(233,230,223,.015); cursor:text}
  .pfx{color:var(--paper); white-space:nowrap; flex-shrink:0}
  .pfx .arrow{color:var(--white); font-weight:700}
  .iw{position:relative; flex:1; min-width:0}
  .line{white-space:pre-wrap; word-break:break-word; min-height:1.6em}
  .line .typed{color:var(--paper)}
  .caret{display:inline-block; width:.62ch; height:1.05em; background:var(--paper); vertical-align:text-bottom;
    transform:translateY(2px); animation:blink 1.05s steps(1) infinite}
  .line.focus .caret{animation:blink 1.05s steps(1) infinite}
  .line.blur .caret{background:transparent; box-shadow:inset 0 0 0 1px var(--graphite); animation:none}
  @keyframes blink{50%{opacity:0}}
  .ghost{color:var(--graphite); opacity:.7}
  #cmd{position:absolute; inset:0; width:100%; height:100%; background:transparent; border:0; outline:0;
    color:transparent; caret-color:transparent; font:inherit; letter-spacing:inherit; padding:0; resize:none; overflow:hidden}

  .hintbar{display:flex; align-items:center; gap:10px 18px; flex-wrap:wrap; padding:11px clamp(14px,2.2vw,28px);
    border-top:1px solid var(--hair2); color:var(--graphite); font-size:clamp(10.5px,1vw,12.5px)}
  .hintbar .lab{color:var(--graphite); letter-spacing:.14em; text-transform:uppercase; font-size:10px}
  .hintbar .cmd{color:var(--paper)}
  .hintbar .sep{color:var(--hair3)}

  .statusbar{display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap;
    font:500 10px/1.5 var(--mono); letter-spacing:.1em; text-transform:uppercase; color:var(--graphite)}
  .statusbar a{border-bottom:1px solid var(--hair3)} .statusbar a:hover{color:var(--paper); border-color:var(--paper)}
  .statusbar .r{display:flex; gap:14px; flex-wrap:wrap}

  .note{color:var(--graphite)} .note .cmd{color:var(--paper)}
  .err{color:var(--paper)} .err .x{color:var(--white); font-weight:700}
</style>
</head>
<body>
<div class="scan" aria-hidden="true"></div>

<div class="term">
  <div class="frame">
    <div class="bar">
      <span class="lights" aria-hidden="true"><i></i><i></i><i></i></span>
      <span class="ttl">hood · robinhood chain cli</span>
      <span class="meta">mainnet · 4663 · type a command</span>
    </div>

    <div class="screen" id="screen" aria-live="polite" aria-label="terminal output"></div>

    <div class="prompt" id="promptrow">
      <span class="pfx">hood&nbsp;<span class="arrow">▸</span></span>
      <span class="iw">
        <span class="line focus" id="line"><span class="typed" id="typed"></span><span class="caret" id="caret"></span><span class="ghost" id="ghost"></span></span>
        <input id="cmd" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="command input" />
      </span>
    </div>

    <div class="hintbar">
      <span class="lab">try</span>
      <span class="cmd">help</span><span class="sep">·</span>
      <span class="cmd">price AAPL</span><span class="sep">·</span>
      <span class="cmd">stocks</span><span class="sep">·</span>
      <span class="cmd">swap</span><span class="sep">·</span>
      <span class="cmd">portfolio</span><span class="sep">·</span>
      <span class="cmd">install</span><span class="sep">·</span>
      <span class="cmd">clear</span>
      <span class="sep">—</span> <span>↑ history · Tab completes</span>
    </div>
  </div>

  <div class="statusbar">
    <span>hood-cli 0.2.0 · node ≥ 20 · reads free, writes guarded</span>
    <span class="r">
      <a href="https://www.npmjs.com/package/hood-cli">npm</a>
      <a href="https://github.com/nirholas/hood-cli">github</a>
      <a href="https://github.com/nirholas/robinhood-chain-sdk">hoodchain</a>
      <a href="https://three.ws">three.ws</a>
    </span>
  </div>
</div>

<script>
"use strict";

/* ============================================================
   hood-cli — a website you drive entirely from the keyboard.
   Output below is transcribed from a REAL captured session
   (docs/session.json, mainnet 4663) — no invented numbers.
   ============================================================ */

const screen = document.getElementById('screen');
const input  = document.getElementById('cmd');
const typed  = document.getElementById('typed');
const ghost  = document.getElementById('ghost');
const line   = document.getElementById('line');

const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

/* ---------- real captured data (mainnet 4663) ---------- */
const BOARD = [
  ['CLSK','$14.43','$14.67','+1.65%','2h 50m','CleanSpark','0xcBB9…Cee3'],
  ['TSM','$401.94','$398.48','-0.86%','4h 10m','Taiwan Semiconductor Ma…','0x58Ff…e7AA'],
  ['SLV','$50.97','$50.28','-1.36%','2h 59m','iShares Silver Trust','0x411e…D89f'],
  ['AMZN','$249.88','$241.73','-3.26%','4h 15m','Amazon','0x12f1…bF54'],
  ['QQQ','$697.50','$672.03','-3.65%','3h 52m','Invesco QQQ','0xD5f3…de68'],
  ['AAPL','$326.49','$308.85','-5.40%','3h 0m','Apple','0xaF3D…93f9'],
];
const PRICES = Object.fromEntries(BOARD.map(r=>[r[0], r]));

/* ---------- output builders (each returns HTML) ---------- */
function head(title, sub){ return `<span class="glyph">◈</span> <span class="b">${title}</span>${sub?` <span class="dim">· ${sub}</span>`:''}`; }

const RENDER = {
  price(sym){
    sym = (sym||'AAPL').toUpperCase();
    const r = PRICES[sym];
    if(!r) return `<div class="note">${head('Price','oracle + dex + premium')}\n\n<span class="dim">${esc(sym)} is not in this captured snapshot.</span> Live oracle + DEX price for any of the 95 Stock Tokens:\n  <span class="cmd">npx hood-cli price ${esc(sym)}</span>\n\nIn this snapshot: <span class="cmd">${BOARD.map(x=>x[0]).join(' · ')}</span></div>`;
    const [,px,dex,prem,age,name,addr]=r;
    return `${head(sym, 'Robinhood Chain mainnet')}
<div class="kv"><span class="k">Oracle</span><span class="v b">${px}</span><span class="k">Updated</span><span class="v dim">${age} ago</span><span class="k">DEX</span><span class="v">${dex}</span><span class="k">Premium</span><span class="v">${prem}</span><span class="k">Token</span><span class="v dim">${addr}</span></div>
<span class="dim">${name} · premium = (dex − oracle) ÷ oracle</span>`;
  },
  stocks(){
    const rows = BOARD.map(r=>`<tr><td class="sym">${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td><td class="age">${r[4]}</td><td class="nm">${esc(r[5])}</td><td class="addr">${r[6]}</td></tr>`).join('');
    return `${head('Stock Tokens','mainnet · 6 shown · 6 priced · sort premium')}
<div class="tbl"><table><thead><tr><th>SYMBOL</th><th>PRICE</th><th>DEX</th><th>PREMIUM</th><th>AGE</th><th>NAME</th><th>ADDRESS</th></tr></thead><tbody>${rows}</tbody></table></div>
<span class="dim">95 canonical Stock Tokens on chain 4663 · <span class="cmd">stocks --priced --json</span> for the full board</span>`;
  },
  launches(){
    return `${head('Launches','mainnet · 0')}\n<span class="dim">No launches in the scanned window. Widen it with --lookback, or --follow to stream new ones from NOXA + The Odyssey.</span>`;
  },
  coins(){ return RENDER.launches(); },
  portfolio(addr){
    addr = addr || '0x9701fb0aDe1E269c8f64Ec0C7b3cfADB31A13A52';
    const short = addr.length>14 ? addr.slice(0,6)+'…'+addr.slice(-4) : esc(addr);
    return `${head('Portfolio', short+' · mainnet')}
<div class="kv"><span class="k">ETH</span><span class="v">0.003625</span><span class="k">USDG</span><span class="v">$0.0550</span><span class="k">Stocks</span><span class="v">$0.00</span><span class="k">Total</span><span class="v b">$0.0550</span></div>
<span class="dim">No Stock Token positions. Fund with </span><span class="cmd">swap --sell USDG --buy &lt;ticker&gt;</span><span class="dim">.</span>
<span class="dim">Positions use multiplier-correct share math, not raw balances.</span>`;
  },
  swap(){
    return `${head('Swap quote','mainnet · add --execute to send')}
<div class="kv"><span class="k">Sell</span><span class="v b">250 <span style="font-weight:400">USDG</span></span><span class="k">Buy</span><span class="v b">~0.131861675469726043 <span style="font-weight:400">WETH</span></span><span class="k">Min. received</span><span class="v dim">0.131202367092377412 WETH (0.50% slippage)</span><span class="k">Rate</span><span class="v">1 USDG ≈ 0.000527 WETH</span><span class="k">Route</span><span class="v dim">direct pool</span></div>
<span class="dim">Quote only. </span><span class="cmd">--execute</span><span class="dim"> prints a confirmation table and stops for an explicit y before signing.</span>`;
  },
  tx(hash){
    hash = hash || '0x870a3bee3070f10e3c4f34271cfde70fd5aa0dc2eade6f07d01ae6c9a00285bd';
    return `${head('Transaction','0x870a…85bd')} <span class="ac">● success</span>
<div class="kv"><span class="k">From</span><span class="v dim">0xdf65…c23e</span><span class="k">To</span><span class="v dim">0xd9ec…fccb</span><span class="k">Value</span><span class="v b">0.0505 ETH</span><span class="k">Method</span><span class="v dim">—</span><span class="k">Block</span><span class="v">#5843692</span><span class="k">When</span><span class="v dim">2026-07-10 05:54:38Z</span><span class="k">Gas used</span><span class="v dim">6,845,934 @ 0.0485 gwei</span><span class="k">Fee</span><span class="v">0.00033229 ETH</span></div>
<span class="dim">5 token transfers decoded · </span><a href="https://robinhoodchain.blockscout.com/tx/${esc(hash)}" target="_blank" rel="noopener">open in explorer</a>`;
  },
  token(arg){
    return `${head('Token', arg?esc(arg):'metadata · supply · multiplier · price')}\n<span class="dim">Reads name, decimals, total supply, holder count, the uiMultiplier for Stock Tokens, plus oracle + DEX price. Run it live:</span>\n  <span class="cmd">npx hood-cli token ${arg?esc(arg):'AAPL'}</span>`;
  },
  watch(arg){
    return `${head('Watch', arg?esc(arg):'live activity stream')}\n<span class="dim">Streams native ETH in/out and every ERC-20 transfer touching an address or token until Ctrl-C — a live feed a static page can't show. In a terminal:</span>\n  <span class="cmd">npx hood-cli watch ${arg?esc(arg):'AAPL --token'}</span>`;
  },
  transfer(){
    return `${head('Transfer','send ETH or an ERC-20')}\n<span class="dim">Same confirmation gate and maxSpendUsd cap as swap. Requires a wallet.</span>\n  <span class="cmd">hood transfer --to 0x… --amount 100 --token USDG</span>`;
  },
  faucet(){
    return `${head('Faucet','testnet only')}\n<span class="dim">Each claim drips testnet ETH + 5 each of TSLA, AMZN, PLTR, NFLX, AMD (browser-only: Cloudflare Turnstile + Google Sign-In).</span>\n  <span class="cmd">hood faucet --network testnet</span>`;
  },
  'deploy-token'(){
    return `${head('Deploy token','fixed-supply ERC-20 · direct rail')}\n<span class="dim">Deploys a plain fixed-supply token (not a Stock Token, not launchpad-listed) from a JSON config.</span>\n  <span class="cmd">hood deploy-token --config ./mytoken.json --execute</span>`;
  },
  config(){
    return `${head('Config','~/.config/hood/config.json')}\n<div class="cmdgrid"><span class="c">config set &lt;key&gt;</span><span class="d">network · rpc · testnetRpc · alchemyKey · maxSpendUsd · wallet</span><span class="c">config get &lt;key&gt;</span><span class="d">print one value</span><span class="c">config list</span><span class="d">print the full config (secrets masked)</span></div>\n<span class="dim">config set wallet writes an AES-256-GCM keystore (scrypt KDF). The private key never touches plaintext disk.</span>`;
  },
  init(){
    return `${head('init','one-command onboarding wizard')}\n<span class="dim">Sets up the wallet, the hood-traders llm-strategist (bring your own key), and the hood-alerts Telegram / Discord / X bot. Every step optional.</span>\n  <span class="cmd">hood init</span>`;
  },
  install(){
    return `${head('Install','two binaries: hood · hoodc')}
<span class="dim"># global install</span>
  <span class="cmd">npm install -g hood-cli</span>
<span class="dim"># or run without installing</span>
  <span class="cmd">npx hood-cli price AAPL</span>
<span class="dim">Reads (price, stocks, coins, launches, tx, token, portfolio, watch) need no wallet or key. Writes (swap, transfer, deploy-token) need a wallet and always stop for an explicit confirmation.</span>`;
  },
  networks(){
    return `${head('Networks')}
<div class="kv"><span class="k">mainnet</span><span class="v">4663 · Stock Tokens, Chainlink feeds, NOXA/Odyssey, Uniswap v3</span><span class="k">testnet</span><span class="v">46630 · TSLA/AMZN/PLTR/NFLX/AMD faucet tokens, no feeds</span></div>
<span class="dim">Switch per-command with --network testnet, or once: </span><span class="cmd">config set network testnet</span>`;
  },
  safety(){
    return `${head('Safety','writes are guarded, not trusted')}
<div class="cmdgrid"><span class="c">eligibility</span><span class="d">acquiring a Stock Token needs --acknowledge-eligibility (non-US/CA/UK/CH)</span><span class="c">confirm gate</span><span class="d">swap/transfer/deploy print a table and require an explicit y</span><span class="c">spend cap</span><span class="d">maxSpendUsd refuses any write over the ceiling before signing</span><span class="c">exit codes</span><span class="d">0 ok · 4 guard refused · 6 wallet required — scriptable with --json</span></div>`;
  },
  about(){
    return `<span class="dim">hood-cli is the <span class="ac">gh / vercel of Robinhood Chain</span> — instant reads with zero config, guarded writes with an encrypted local wallet. Prices, portfolios, launches, swaps, transfers and transaction decoding, built on hoodchain + viem.</span>
<span class="dim">Every command supports --json to pipe into jq or a script. This page mirrors the product: there are no buttons — you drive it by typing, exactly like the real thing.</span>`;
  },
  whoami(){ return `<span class="dim">a visitor at a terminal on </span><span class="ac">Robinhood Chain mainnet (4663)</span><span class="dim"> — reads are open, no wallet needed. Type </span><span class="cmd">help</span><span class="dim">.</span>`; },
  ls(){ return RENDER.help(); },
  help(arg){
    if(arg){
      const c = COMMANDS[arg.toLowerCase()];
      if(c && c.usage) return `<span class="dim">${esc(c.usage)}</span>`;
    }
    const rows = HELP_LIST.map(([c,d])=>`<span class="c">${c}</span><span class="d">${esc(d)}</span>`).join('');
    return `${head('hood','the command-line toolkit for Robinhood Chain (4663)')}
<div class="cmdgrid">${rows}</div>
<span class="dim">reads need no wallet · writes stop for confirmation · add --json anywhere · try </span><span class="cmd">price AAPL</span><span class="dim"> or </span><span class="cmd">stocks</span>`;
  },
};

const HELP_LIST = [
  ['price &lt;sym&gt;','oracle price + DEX price + premium for a Stock Token'],
  ['stocks','the full Stock Token board with live Chainlink prices'],
  ['coins','memecoin screener — newest or trending launches'],
  ['launches','recent launches from NOXA and The Odyssey'],
  ['portfolio &lt;addr&gt;','multiplier-correct Stock Token positions + USD totals'],
  ['tx &lt;hash&gt;','decode a transaction: status, transfers, gas, method'],
  ['token &lt;addr&gt;','inspect a token: metadata, supply, multiplier, price'],
  ['watch &lt;target&gt;','live activity stream for an address or a token'],
  ['swap','quote (default) or execute a Uniswap v3 swap'],
  ['transfer','send ETH or an ERC-20 token to an address'],
  ['deploy-token','deploy a fixed-supply ERC-20 from a JSON config'],
  ['config','manage settings: rpc, wallet, network, spend cap'],
  ['init','interactive setup: wallet, traders, alerts'],
  ['faucet','testnet faucet instructions + balances'],
  ['install','how to get hood-cli · networks · safety'],
  ['clear','clear the screen'],
];

/* command registry: name -> { run, usage } */
const COMMANDS = {};
Object.keys(RENDER).forEach(name=>{ COMMANDS[name] = { run: RENDER[name] }; });
COMMANDS.clear = { run: ()=>{ screen.innerHTML=''; return null; } };
// help usages, from the real --help text
COMMANDS.price.usage = 'Usage: hood price [--watch] [--interval <ms>] [--max-age <s>] [--no-dex] <symbol>';
COMMANDS.stocks.usage = 'Usage: hood stocks [--sort symbol|price|premium] [--dex] [--priced] [--limit <n>]';
COMMANDS.swap.usage = 'Usage: hood swap --sell <token> --buy <token> --amount <n> [--slippage <bps>] [--execute]';
COMMANDS.portfolio.usage = 'Usage: hood portfolio [--max-age <s>] <address>';

const ALIASES = { '?':'help', h:'help', man:'help', ll:'ls', quote:'swap', prices:'stocks', board:'stocks', me:'whoami', wallet:'config' };
const COMPLETIONS = ['help','price ','stocks','coins','launches','portfolio','tx ','token ','watch ','swap','transfer','deploy-token','config','init','faucet','install','networks','safety','about','clear','whoami'];

/* ---------- printing ---------- */
function appendOut(cmdText, html){
  const wrap = document.createElement('div');
  wrap.className = 'out enter';
  const echo = cmdText===null ? '' :
    `<div class="cmdline"><span class="pr">hood</span> <span class="arrow">▸</span> <span class="txt">${esc(cmdText)}</span></div>`;
  wrap.innerHTML = echo + (html!=null ? `<div class="body">${html}</div>` : '');
  screen.appendChild(wrap);
  screen.scrollTop = screen.scrollHeight;
}

/* ---------- run a command ---------- */
function run(raw){
  const cmdText = raw;
  const parts = raw.trim().split(/\s+/);
  let name = (parts[0]||'').toLowerCase();
  if(ALIASES[name]) name = ALIASES[name];
  const rest = parts.slice(1);
  // "<cmd> --help" or "help <cmd>"
  if(rest.includes('--help') || rest.includes('-h')){
    appendOut(cmdText, RENDER.help(name)); return;
  }
  if(name==='' ){ appendOut(cmdText, null); return; }
  const c = COMMANDS[name];
  if(!c){
    appendOut(cmdText, `<div class="err"><span class="x">✗</span> command not found: ${esc(name)} — type <span class="ac">help</span> for the full list.</div>`);
    return;
  }
  // pass first non-flag arg through (symbol / address / hash)
  const arg = rest.find(a=>!a.startsWith('-'));
  const html = c.run(arg);
  appendOut(cmdText, html);
}

/* ---------- input rendering: typed text + block caret + ghost autocomplete ---------- */
function currentGhost(val){
  if(!val) return '';
  const low = val.toLowerCase();
  // complete only when typing the first token
  if(/\s/.test(val)) return '';
  const hit = COMPLETIONS.find(c=>c.toLowerCase().startsWith(low) && c.toLowerCase()!==low);
  return hit ? hit.slice(val.length) : '';
}
function renderInput(){
  const val = input.value;
  typed.textContent = val;
  ghost.textContent = currentGhost(val);
}
function acceptGhost(){
  const g = ghost.textContent;
  if(g){ input.value = input.value + g; renderInput(); return true; }
  return false;
}

/* ---------- history ---------- */
const history = [];
let histIdx = -1, draft = '';

input.addEventListener('input', ()=>{ renderInput(); histIdx = -1; });

input.addEventListener('keydown', e=>{
  if(e.key==='Enter'){
    e.preventDefault();
    const raw = input.value;
    run(raw);
    if(raw.trim()){ history.push(raw); }
    histIdx = -1; draft='';
    input.value=''; renderInput();
  } else if(e.key==='Tab'){
    e.preventDefault();
    acceptGhost();
  } else if(e.key==='ArrowRight'){
    // accept ghost only if caret is at end
    if(input.selectionStart===input.value.length && ghost.textContent){ e.preventDefault(); acceptGhost(); }
  } else if(e.key==='ArrowUp'){
    e.preventDefault();
    if(!history.length) return;
    if(histIdx===-1){ draft = input.value; histIdx = history.length-1; }
    else if(histIdx>0){ histIdx--; }
    input.value = history[histIdx]; renderInput();
    setTimeout(()=>input.setSelectionRange(input.value.length,input.value.length),0);
  } else if(e.key==='ArrowDown'){
    e.preventDefault();
    if(histIdx===-1) return;
    if(histIdx < history.length-1){ histIdx++; input.value = history[histIdx]; }
    else { histIdx=-1; input.value = draft; }
    renderInput();
  } else if(e.key==='l' && e.ctrlKey){
    e.preventDefault(); screen.innerHTML='';
  } else if(e.key==='c' && e.ctrlKey){
    e.preventDefault(); appendOut(input.value+' ^C', null); input.value=''; renderInput();
  }
});

/* keep focus: tapping anywhere in the terminal focuses the input (mobile keyboard) */
document.querySelector('.term').addEventListener('pointerdown', e=>{
  if(e.target.closest('a')) return;               // let links work
  if(getSelection().toString()) return;            // allow text selection
  input.focus({preventScroll:true});
});
input.addEventListener('focus', ()=>line.classList.replace('blur','focus'));
input.addEventListener('blur',  ()=>line.classList.replace('focus','blur'));

/* ---------- boot choreography ---------- */
const BANNER =
`  █ █ █▀█ █▀█ █▀▄
  █▀█ █ █ █ █ █ █
  ▀ ▀ ▀▀▀ ▀▀▀ ▀▀ `;
function boot(){
  const b = document.createElement('div');
  b.className='out enter';
  b.innerHTML = `<div class="banner">${BANNER}<span class="sub">hood-cli 0.2.0 — the gh / vercel of Robinhood Chain (4663).\nInstant reads, guarded writes. This site is the CLI: type a command below.\nStart with <span class="ac">help</span>, or just <span class="ac">stocks</span>.</span></div>`;
  screen.appendChild(b);
  // then auto-run a real read so the first paint is alive
  const demo = 'price AAPL';
  autotype(demo, ()=>{ run(demo); input.value=''; renderInput(); input.focus({preventScroll:true}); });
}
function autotype(text, done){
  let i=0;
  input.focus({preventScroll:true});
  (function step(){
    if(i<=text.length){ input.value = text.slice(0,i); renderInput(); i++; setTimeout(step, 46); }
    else setTimeout(done, 340);
  })();
}

renderInput();
setTimeout(boot, 460);
addEventListener('load', ()=>input.focus({preventScroll:true}));
</script>
