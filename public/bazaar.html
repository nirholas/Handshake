<style>
	:root {
		--bg: #0b0b0b;
		--bg-2: #111111;
		--panel: #161616;
		--panel-2: #1d1d1d;
		--border: #272727;
		--border-strong: #343434;
		--text: #f0f2f8;
		--muted: #8a90a8;
		--muted-2: #6b7088;
		--accent: #ffffff;
		--accent-blue: #60a5fa;
		--accent-green: #4ade80;
		--accent-red: #f87171;
		--mono: ui-monospace, "JetBrains Mono", "Fira Code", Menlo, monospace;
	}
	* { box-sizing: border-box; }
	html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); }
	body {
		font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
		-webkit-font-smoothing: antialiased;
		line-height: 1.5;
		min-height: 100vh;
	}
	a { color: var(--accent-blue); text-decoration: none; }
	a:hover { color: #93c5fd; }

	/* One keyboard focus ring for every control on the page. The search box and
	   the sidebar fields used to set `outline: none` against a 1px border tint,
	   which left a keyboard user with no usable indication of where they were. */
	a:focus-visible,
	button:focus-visible,
	input:focus-visible,
	select:focus-visible,
	dialog:focus-visible {
		outline: 2px solid var(--accent-blue);
		outline-offset: 2px;
	}

	.wrap { max-width: 1280px; margin: 0 auto; padding: 0 28px; }
	@media (max-width: 720px) { .wrap { padding: 0 16px; } }


	.ctx {
		background: var(--bg-2);
		border: 1px solid var(--border);
		border-radius: 10px;
		padding: 14px 16px;
		margin-bottom: 14px;
	}
	.ctx .head {
		display: flex; align-items: center; gap: 8px;
		font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;
		color: var(--muted-2); font-weight: 600;
		margin-bottom: 8px;
	}
	.ctx .head .dot {
		width: 7px; height: 7px; border-radius: 50%;
		background: var(--accent-blue);
	}
	.ctx .head .pill {
		margin-left: auto;
		font-family: var(--mono); font-size: 10px;
		padding: 2px 7px; border-radius: 999px;
		letter-spacing: 0;
		text-transform: none;
	}
	.ctx .head .pill.up { background: rgba(74,222,128,0.12); color: var(--accent-green); border: 1px solid rgba(74,222,128,0.3); }
	.ctx .head .pill.down { background: rgba(248,113,113,0.12); color: var(--accent-red); border: 1px solid rgba(248,113,113,0.3); }
	.ctx .head .pill.neutral { background: var(--panel-2); color: var(--muted); border: 1px solid var(--border); }
	.ctx .body { font-size: 13.5px; line-height: 1.55; color: var(--text); }
	.ctx .body .cite {
		display: inline-flex; align-items: center; justify-content: center;
		min-width: 18px; height: 18px;
		background: var(--panel-2); color: var(--accent-blue);
		border: 1px solid rgba(96,165,250,0.3);
		border-radius: 5px;
		font-family: var(--mono); font-size: 10.5px;
		padding: 0 4px;
		margin: 0 2px;
		vertical-align: 1px;
		text-decoration: none;
	}
	.ctx .body .cite:hover { background: rgba(96,165,250,0.15); }
	.ctx .citations {
		margin-top: 10px;
		padding-top: 10px;
		border-top: 1px solid var(--border);
		display: flex; flex-direction: column; gap: 4px;
	}
	.ctx .citations a {
		font-size: 11.5px;
		color: var(--muted);
		font-family: var(--mono);
	}
	.ctx .citations a:hover { color: var(--text); }
	.ctx .citations a strong { color: var(--accent-blue); margin-right: 6px; font-weight: 600; }
	.ctx .stat-row {
		display: flex; gap: 14px;
		margin-top: 8px;
		font-size: 11.5px;
		color: var(--muted);
		font-family: var(--mono);
		flex-wrap: wrap;
	}
	.ctx .stat-row strong { color: var(--text); font-weight: 600; }
	.ctx.loading .body { color: var(--muted); font-style: italic; }
	.ctx.err { border-color: rgba(248,113,113,0.3); }
	.ctx.err .body { color: #fecaca; }

	.peer-hint {
		display: inline-flex; align-items: center; gap: 5px;
		background: rgba(245,158,11,0.08);
		border: 1px solid rgba(245,158,11,0.25);
		color: #f59e0b;
		padding: 3px 8px;
		border-radius: 999px;
		font-family: var(--mono);
		font-size: 11px;
		text-decoration: none;
	}
	.peer-hint:hover { background: rgba(245,158,11,0.14); }

	.tag.host {
		color: var(--accent-blue);
		border-color: rgba(96,165,250,0.3);
		text-decoration: none;
	}
	.tag.host:hover { background: rgba(96,165,250,0.1); }

	header.hero { padding: 44px 0 18px; }
	header.hero h1 { font-size: 36px; line-height: 1.1; margin: 0 0 8px; letter-spacing: -0.02em; }
	header.hero p { color: var(--muted); margin: 0; font-size: 15px; max-width: 680px; }

	.search-bar {
		margin: 22px 0 6px;
		display: flex; gap: 10px; flex-wrap: wrap;
	}
	.search-bar input[type=search] {
		flex: 1 1 360px;
		min-width: 200px;
		background: var(--panel);
		border: 1px solid var(--border-strong);
		color: var(--text);
		font-size: 15px;
		padding: 12px 14px;
		border-radius: 10px;
	}
	.search-bar input[type=search]:focus { border-color: var(--accent-blue); }
	.search-bar button {
		background: var(--accent-blue);
		color: #0b0b0b;
		border: none;
		font-weight: 600;
		padding: 0 20px;
		border-radius: 10px;
		cursor: pointer;
		font-size: 14px;
	}
	.search-bar button.ghost {
		background: var(--panel);
		color: var(--text);
		border: 1px solid var(--border-strong);
	}
	.search-bar button:hover { filter: brightness(1.08); }

	.layout {
		display: grid;
		grid-template-columns: 260px 1fr;
		gap: 28px;
		padding: 24px 0 56px;
	}
	@media (max-width: 960px) { .layout { grid-template-columns: 1fr; } }

	aside.filters {
		background: var(--panel);
		border: 1px solid var(--border);
		border-radius: 12px;
		padding: 18px;
		height: max-content;
		position: sticky;
		top: 16px;
	}
	aside.filters h3 {
		margin: 0 0 12px;
		font-size: 11px;
		text-transform: uppercase;
		letter-spacing: 0.08em;
		color: var(--muted);
		font-weight: 600;
	}
	aside.filters .group { margin-bottom: 18px; }
	aside.filters label {
		display: block;
		font-size: 13px;
		color: var(--muted);
		margin-bottom: 6px;
	}
	aside.filters select, aside.filters input[type=number], aside.filters input[type=text] {
		width: 100%;
		background: var(--panel-2);
		border: 1px solid var(--border);
		color: var(--text);
		padding: 8px 10px;
		border-radius: 8px;
		font-size: 13.5px;
	}
	aside.filters select:focus, aside.filters input:focus { border-color: var(--accent-blue); }
	aside.filters .row { display: flex; gap: 8px; }
	aside.filters .row > * { flex: 1; }
	aside.filters .reset {
		width: 100%;
		background: transparent;
		border: 1px solid var(--border-strong);
		color: var(--muted);
		padding: 8px;
		border-radius: 8px;
		cursor: pointer;
		font-size: 13px;
	}
	aside.filters .reset:hover { color: var(--text); border-color: var(--accent-blue); }

	.results-meta {
		display: flex;
		align-items: baseline;
		justify-content: space-between;
		gap: 12px;
		margin-bottom: 14px;
		color: var(--muted);
		font-size: 13px;
	}
	.results-meta strong { color: var(--text); font-weight: 600; }
	.results-meta select {
		background: var(--panel);
		color: var(--text);
		border: 1px solid var(--border);
		padding: 6px 10px;
		border-radius: 8px;
		font-size: 13px;
	}

	.cards {
		display: grid;
		/* min(100%, 320px) lets the track collapse to the container width on
		   phones narrower than 320px so a single card never forces sideways
		   scroll; on wider screens it keeps the 320px comfortable minimum. */
		grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr));
		gap: 14px;
	}
	.card {
		background: var(--panel);
		border: 1px solid var(--border);
		border-radius: 12px;
		padding: 16px;
		display: flex;
		flex-direction: column;
		gap: 10px;
		min-height: 200px;
	}
	.card:hover { border-color: var(--border-strong); }
	.card .head { display: flex; align-items: center; gap: 10px; }
	.card .icon {
		width: 36px; height: 36px;
		border-radius: 8px;
		background: var(--panel-2);
		border: 1px solid var(--border);
		display: flex; align-items: center; justify-content: center;
		flex-shrink: 0;
		font-size: 14px;
		color: var(--muted);
		overflow: hidden;
	}
	.card .icon img { width: 100%; height: 100%; object-fit: cover; }
	.card .title { font-weight: 600; font-size: 14px; line-height: 1.3; word-break: break-word; }
	.card .subtitle { color: var(--muted); font-size: 12px; word-break: break-all; }
	/* Facilitator descriptions carry raw URLs and message ids with no spaces in
	   them. Without a wrap rule one 136-character token set the grid's
	   min-content width, which pushed the whole page 156px wider than the
	   viewport at 1440px and clipped the filter sidebar off-screen at 320px. */
	.card .desc { color: var(--muted); font-size: 13px; flex-grow: 1; overflow-wrap: anywhere; }
	.card .meta { display: flex; gap: 6px; flex-wrap: wrap; font-size: 11px; }
	.tag {
		background: var(--panel-2);
		border: 1px solid var(--border);
		color: var(--muted);
		padding: 3px 8px;
		border-radius: 999px;
		font-family: var(--mono);
		font-size: 11px;
	}
	.tag.price { color: var(--accent-green); border-color: rgba(74,222,128,0.3); }
	.tag.net { color: var(--accent-blue); border-color: rgba(96,165,250,0.3); }
	.tag.method { color: var(--text); }
	.tag.ext { color: #888888; border-color: rgba(255,255,255,0.15); }
	.card .actions { display: flex; gap: 8px; margin-top: 4px; }
	.btn-pay {
		background: var(--accent-blue);
		color: #0b0b0b;
		border: none;
		padding: 9px 14px;
		font-size: 13px;
		border-radius: 8px;
		cursor: pointer;
		font-weight: 600;
	}
	.btn-pay:hover { filter: brightness(1.1); }
	.btn-pay:disabled { opacity: 0.55; cursor: progress; }
	.btn-details {
		background: transparent;
		border: 1px solid var(--border-strong);
		color: var(--text);
		padding: 9px 12px;
		font-size: 13px;
		border-radius: 8px;
		cursor: pointer;
	}
	.btn-details:hover { border-color: var(--accent-blue); }

	.receipt {
		margin-top: 8px;
		padding: 10px 12px;
		background: var(--bg-2);
		border: 1px solid var(--border);
		border-radius: 8px;
		font-family: var(--mono);
		font-size: 12px;
		color: var(--muted);
		max-height: 260px;
		overflow: auto;
		white-space: pre-wrap;
		word-break: break-all;
	}
	.receipt.ok { border-color: rgba(74,222,128,0.4); color: #d1fae5; }
	.receipt.err { border-color: rgba(248,113,113,0.4); color: #fecaca; }
	.receipt a { color: var(--accent-blue); }

	.more-row {
		display: flex;
		align-items: center;
		justify-content: center;
		gap: 12px;
		flex-wrap: wrap;
		margin-top: 20px;
	}
	.more-btn {
		background: var(--panel);
		border: 1px solid var(--border-strong);
		color: var(--text);
		padding: 10px 22px;
		font-size: 13px;
		font-weight: 600;
		border-radius: 8px;
		cursor: pointer;
		transition: border-color 0.15s ease, background 0.15s ease;
	}
	.more-btn:hover { border-color: var(--accent-blue); background: var(--panel-2); }
	.more-btn:active { transform: translateY(1px); }
	.more-btn:disabled { opacity: 0.55; cursor: progress; }
	.more-note { font-size: 12px; color: var(--muted-2); font-family: var(--mono); }

	.empty {
		padding: 60px 20px;
		text-align: center;
		color: var(--muted);
		border: 1px dashed var(--border-strong);
		border-radius: 12px;
	}
	.empty.state-err {
		border-color: rgba(248,113,113,0.4);
		border-style: solid;
		color: #fecaca;
	}
	.empty .empty-title { font-size: 15px; font-weight: 600; color: var(--text); margin-bottom: 6px; }
	.empty.state-err .empty-title { color: #fecaca; }
	.empty .empty-sub { font-size: 13px; }
	.empty .retry-btn {
		margin-top: 16px;
		background: var(--accent-blue);
		color: #0b0b0b;
		border: none;
		padding: 9px 18px;
		font-size: 13px;
		border-radius: 8px;
		cursor: pointer;
		font-weight: 600;
	}
	.empty .retry-btn:hover { filter: brightness(1.1); }
	.empty .retry-btn:focus-visible { outline: 2px solid var(--accent-blue); outline-offset: 2px; }
	/* Screen-reader-only live region for "Try it" announcements. */
	.sr-only {
		position: absolute;
		width: 1px; height: 1px;
		padding: 0; margin: -1px;
		overflow: hidden;
		clip: rect(0,0,0,0);
		white-space: nowrap;
		border: 0;
	}
	.spinner {
		display: inline-block;
		width: 14px; height: 14px;
		border: 2px solid var(--border-strong);
		border-top-color: var(--accent-blue);
		border-radius: 50%;
		animation: spin 0.7s linear infinite;
		vertical-align: -2px;
	}
	@keyframes spin { to { transform: rotate(360deg); } }

	.sources {
		font-size: 11px;
		color: var(--muted-2);
		font-family: var(--mono);
		margin-top: 6px;
	}
	.sources .ok { color: #4ade80; }
	.sources .err { color: var(--accent-red); }

	dialog.modal {
		background: var(--panel);
		color: var(--text);
		border: 1px solid var(--border-strong);
		border-radius: 14px;
		max-width: 720px;
		width: calc(100% - 32px);
		padding: 0;
	}
	dialog.modal::backdrop { background: rgba(0,0,0,0.65); }
	dialog.modal header { padding: 18px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
	dialog.modal header h2 { margin: 0; font-size: 15px; font-weight: 600; }
	dialog.modal header button { background: transparent; color: var(--muted); border: none; cursor: pointer; font-size: 22px; line-height: 1; }
	dialog.modal section { padding: 16px 20px; }
	dialog.modal pre {
		background: var(--bg-2);
		border: 1px solid var(--border);
		padding: 12px;
		border-radius: 8px;
		overflow: auto;
		font-family: var(--mono);
		font-size: 12px;
		color: var(--muted);
		max-height: 360px;
	}
</style>

<body>
<div id="nav-container"></div>
<script src="/nav.js"></script>
<div class="wrap">
	<header class="hero">
		<h1 data-i18n="bazaar.discover_paid_apis_and_mcp_tools">Discover paid APIs and MCP tools</h1>
		<p data-i18n="bazaar.live_catalog_merged_across_x402_facilitators">Live catalog merged across x402 facilitators. Search, filter, and pay any endpoint with a single click — settlement is on-chain via the x402 protocol.</p>
	</header>

	<form class="search-bar" id="search-form" autocomplete="off">

		<button type="submit" data-i18n="bazaar.search">Search</button>
		<button type="button" class="ghost" id="clear-btn" data-i18n="bazaar.clear">Clear</button>
	</form>

	<div class="layout">
		<aside class="filters">
			<h3 data-i18n="bazaar.filters">Filters</h3>
			<div class="group">
				<label for="f-type" data-i18n="bazaar.type">Type</label>
				<select id="f-type">
					<option value="http" data-i18n="bazaar.http_endpoints">HTTP endpoints</option>
					<option value="mcp" data-i18n="bazaar.mcp_tools">MCP tools</option>
				</select>
			</div>
			<div class="group">
				<label for="f-network" data-i18n="bazaar.network">Network</label>
				<select id="f-network">
					<option value="" data-i18n="bazaar.all_networks">All networks</option>
					<option value="eip155:*" data-i18n="bazaar.evm_any">EVM (any)</option>

					<option value="eip155:42161" data-i18n="bazaar.arbitrum">Arbitrum</option>
					<option value="eip155:10" data-i18n="bazaar.optimism">Optimism</option>
					<option value="eip155:137" data-i18n="bazaar.polygon">Polygon</option>

				</select>
			</div>
			<div class="group">
				<label for="f-max" data-i18n="bazaar.max_price_usdc">Max price (USDC)</label>
				<div class="row">
					<input type="number" id="f-max" placeholder="0.10" step="0.001" min="0" />

			</div>
			<div class="group">
				<label for="f-ext" data-i18n="bazaar.extension">Extension</label>
				<select id="f-ext">
					<option value="" data-i18n="bazaar.any">Any</option>
					<option value="bazaar" data-i18n="bazaar.bazaar">bazaar</option>
					<option value="sign-in-with-x" data-i18n="bazaar.sign_in_with_x">sign-in-with-x</option>
					<option value="payment-identifier" data-i18n="bazaar.payment_identifier">payment-identifier</option>
					<option value="offer-receipt" data-i18n="bazaar.offer_receipt">offer-receipt</option>

			</div>

					<option value="price" data-i18n="bazaar.price_lowest_first">Price (lowest first)</option>

			</div>
			<button type="button" class="reset" id="reset-btn" data-i18n="bazaar.reset_filters">Reset filters</button>

		<main>
			<div class="results-meta">
				<div>
					<strong id="count">…</strong>
					<span data-i18n-html="bazaar.results"> results </span>
					<!-- Kept outside the translated span above: i18n.js applies that key
					     with innerHTML, which replaces every child node, so a script-driven
					     element nested inside it is detached the moment a catalog loads. -->
					<span id="query-label"></span>
					<div class="sources" id="sources"></div>
				</div>
			</div>
			<div id="results" class="cards"></div>
			<div id="empty" class="empty" hidden>No matching services. Try fewer filters or a different query.</div>
			<div class="more-row" id="more-row" hidden>
				<button type="button" class="more-btn" id="more-btn">Load more</button>
				<span class="more-note" id="more-note"></span>
			</div>
			<!-- Polite live region: announces "Try it" pay results to screen readers. -->
			<div id="try-live" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>
		</main>
	</div>
</div>

<dialog class="modal" id="details-modal">
	<header>
		<h2 id="dm-title" data-i18n="bazaar.resource_details">Resource details</h2>
		<button type="button" id="dm-close" aria-label="Close" data-i18n-attr="aria-label:bazaar.close_arialabel">×</button>
	</header>
	<section>
		<div id="dm-body"></div>
	</section>
</dialog>

<!-- The drop-in x402 modal, which we use for the "Try it" pay flow. -->
<script type="module" src="/x402.js"></script>
<script type="module" src="/bazaar.js"></script>
	<script src="/brand.js" defer></script>
	<!-- Runtime i18n: detects locale, swaps annotated copy, mounts <lang-switcher>. -->
	<script type="module" src="/i18n.js"></script>
</body>
</html>
