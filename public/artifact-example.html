<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title data-i18n="artifact_example.meta_title">three.ws — Artifact Example</title>

			html,
			body {

		<script type="module" src="https://three.ws/artifact.js"></script>
		<script src="/brand.js" defer></script>
