<!DOCTYPE html>
<html lang="en">
<head>
	<script>/* three.ws theme boot — no-flash; runtime in /theme-switcher.js */(function(){try{var m=localStorage.getItem('twx_theme');var l=m==='auto'?(window.matchMedia&&window.matchMedia('(prefers-color-scheme: light)').matches):m==='light';document.documentElement.setAttribute('data-theme',l?'light':'dark');}catch(e){document.documentElement.setAttribute('data-theme','dark');}})();</script>
	<meta charset="UTF-8" />
	<!-- No maximum-scale: it blocks pinch-zoom (axe meta-viewport, WCAG 1.4.4). -->
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title data-i18n="characters.meta_title">Characters — three.ws</title>
	<meta name="description" content="Discover AI characters on three.ws. Chat, trade, and create."  data-i18n-attr="content:characters.meta_description"/>
	<link rel="icon" href="/favicon.ico" />
	<link rel="canonical" href="https://three.ws/characters" />
	<meta property="og:title" content="Characters — three.ws"  data-i18n-attr="content:characters.meta_og_title"/>
	<meta property="og:description" content="Discover AI characters. Chat, trade, create."  data-i18n-attr="content:characters.meta_og_description"/>
	<meta property="og:url" content="https://three.ws/characters" />
	<meta property="og:image" content="https://three.ws/api/page-og?s=main&amp;t=Characters&amp;d=Discover+AI+characters+on+three.ws.+Chat%2C+trade%2C+and+create.&amp;p=%2Fcharacters" />
	<link rel="stylesheet" href="/nav.css" />
	<link rel="stylesheet" href="/src/characters.css" />

	<meta property="og:type" content="website">
	<meta property="og:site_name" content="three.ws">
	<meta name="twitter:card" content="summary_large_image">
	<meta name="twitter:title" content="Characters · three.ws" data-i18n-attr="content:characters.meta_twitter_title">
	<meta name="twitter:description" content="Discover AI characters on three.ws. Chat, trade, and create." data-i18n-attr="content:characters.meta_twitter_description">
	<meta name="twitter:image" content="https://three.ws/api/page-og?s=main&amp;t=Characters&amp;d=Discover+AI+characters+on+three.ws.+Chat%2C+trade%2C+and+create.&amp;p=%2Fcharacters">
	<script type="application/ld+json">{"@context":"https://schema.org","@type":"WebPage","name":"Characters","description":"Discover AI characters on three.ws. Chat, trade, and create.","url":"https://three.ws/characters","isPartOf":{"@type":"WebSite","name":"three.ws","url":"https://three.ws"}}</script>

	<meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1">
	<meta property="og:locale" content="en_US">
	<meta property="og:image:alt" content="Characters — three.ws">
	<meta name="twitter:site" content="@trythreews">
</head>
<body>

<div id="nav-container"></div>
<script src="/nav.js"></script>

<main id="main-content" class="chs-main">

	<div class="chs-header">
		<div class="chs-header-top">
			<div>
				<h1 class="chs-title" data-i18n="characters.characters">Characters</h1>
				<p class="chs-sub" data-i18n="characters.subtitle">Discover AI characters on three.ws. Chat, trade, and create.</p>
			</div>
			<a class="chs-create" href="/create-agent">
				<span aria-hidden="true">+</span>
				<span data-i18n="characters.create">Create a character</span>
			</a>
		</div>
		<div class="chs-controls">
			<label class="sr-only" for="chs-search" data-i18n="characters.search_label">Search characters by name or description</label>
			<input id="chs-search" class="chs-search" type="search" placeholder="Search characters…"
			       data-i18n-attr="placeholder:characters.search_placeholder" autocomplete="off" />
			<div class="chs-sort" role="group" aria-label="Sort characters" data-i18n-attr="aria-label:characters.sort_label">
				<button type="button" class="chs-sort-btn active" data-sort="new" aria-pressed="true" data-i18n="characters.new">New</button>
				<button type="button" class="chs-sort-btn" data-sort="chats" aria-pressed="false" data-i18n="characters.top">Top</button>
			</div>
		</div>
	</div>

	<div id="chs-grid" class="chs-grid" aria-busy="true">
		<!-- cards injected by characters.js -->
	</div>

	<!-- Announces load results to screen readers; the grid itself is too chatty
	     to make a live region when 24 cards land at once. -->
	<p id="chs-status" class="sr-only" role="status" aria-live="polite"></p>

	<div id="chs-load-more" class="chs-load-more" hidden>
		<button type="button" id="chs-load-btn" class="chs-load-btn" data-i18n="characters.load_more">Load more</button>
	</div>

	<div class="chs-bottom-pad"></div>

</main>

<script type="module" src="/src/characters.js"></script>
	<script src="/brand.js" defer></script>
	<!-- Runtime i18n: detects locale, swaps annotated copy, mounts <lang-switcher>. -->
	<script type="module" src="/i18n.js"></script>
</body>
</html>
