<!DOCTYPE html>
<html lang="en">
<head>
	<script>/* three.ws theme boot — no-flash; runtime in /theme-switcher.js */(function(){try{var m=localStorage.getItem('twx_theme');var l=m==='auto'?(window.matchMedia&&window.matchMedia('(prefers-color-scheme: light)').matches):m==='light';document.documentElement.setAttribute('data-theme',l?'light':'dark');}catch(e){document.documentElement.setAttribute('data-theme','dark');}})();</script>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
	<title data-i18n="character.meta_title">Character — three.ws</title>
	<meta name="description" content="Character profile on three.ws"  data-i18n-attr="content:character.meta_description"/>
	<link rel="icon" href="/favicon.ico" />
	<link rel="stylesheet" href="/nav.css" />
	<link rel="stylesheet" href="/src/character.css" />
</head>
<body>

<div id="nav-container"></div>
<script src="/nav.js"></script>

<div class="ch-shell ch-loading">

	<!-- Hero -->
	<section class="ch-hero">
		<div class="ch-hero-top">
			<!-- Avatar -->
			<div id="ch-avatar-wrap" class="ch-avatar-wrap">
				<img id="ch-avatar-img" class="ch-avatar" src="" alt="" style="display:none" />
				<div id="ch-avatar-ph" class="ch-avatar-placeholder" style="display:none"></div>
			</div>

			<!-- Name + creator + stats -->
			<div class="ch-hero-info">
				<h1 id="ch-name" class="ch-name ch-skeleton" style="min-width:140px;min-height:28px">&nbsp;</h1>
				<div id="ch-creator" class="ch-creator" style="margin-top:6px"></div>
			</div>

			<div class="ch-stats">
				<div class="ch-stat-bubble">
					<span id="ch-stat-chats" class="ch-stat-num">—</span>
					<span class="ch-stat-label" data-i18n="character.chats">Chats</span>
				</div>
				<div class="ch-stat-bubble">
					<span id="ch-stat-holders" class="ch-stat-num">—</span>
					<span class="ch-stat-label" data-i18n="character.holders">Holders</span>
				</div>
			</div>
		</div>

		<p id="ch-desc" class="ch-desc"></p>

		<div class="ch-cta">
			<a id="ch-chat-btn" class="ch-chat-btn" data-i18n="character.chat">Chat</a>
		</div>
	</section>

	<!-- Token card -->
	<section class="ch-section">
		<div class="ch-token-card">
			<div id="ch-token-section">
				<p class="ch-no-token" data-i18n="character.loading">Loading…</p>
			</div>
		</div>
	</section>

	<!-- Memes gallery -->
	<section class="ch-section">
		<h2 class="ch-gallery-title" data-i18n="character.memes_gallery">Memes Gallery</h2>
		<div id="ch-memes-grid" class="ch-gallery-grid"></div>
	</section>

	<div class="ch-bottom-pad"></div>
</div>

<script type="module" src="/src/character.js"></script>
	<script src="/brand.js" defer></script>
	<!-- Runtime i18n: detects locale, swaps annotated copy, mounts <lang-switcher>. -->
	<script type="module" src="/i18n.js"></script>
</body>
</html>
