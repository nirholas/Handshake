<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title data-i18n="cz_index.meta_title">CZ · Claim Your three.ws</title>
		<meta name="description" content="Connect your wallet and claim your on-chain three.ws."  data-i18n-attr="content:cz_index.meta_description"/>
		<meta name="theme-color" content="#090909" />
		<link rel="icon" href="/favicon.ico" />
		<!-- Absolute: served at /cz as well as /cz/, and a relative href resolves
		     against the site root on the slash-less URL (404, unstyled page). -->
		<link rel="stylesheet" href="/cz/cz.css" />
		<script type="module">
			const CDN = 'https://three.ws/agent-3d/latest/agent-3d.js';
			const h = location.hostname;
			const isLocal =
				h === 'localhost' ||
				h === '127.0.0.1' ||
				h.endsWith('.github.dev') ||
				h.endsWith('.local');
			if (isLocal) {
				const { defineElement } = await import('/src/lib.js');
				defineElement();
			} else {
				await import(CDN);
			}
		</script>
	
	<link rel="canonical" href="https://three.ws/cz">
	<meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1">
	<meta property="og:type" content="website">
	<meta property="og:site_name" content="three.ws">
	<meta property="og:locale" content="en_US">
	<meta property="og:title" content="Claim the CZ agent · three.ws">
	<meta property="og:description" content="Connect a wallet, sign one line, and take ownership of the pre-registered CZ agent, then copy its embed snippet.">
	<meta property="og:url" content="https://three.ws/cz">
	<meta property="og:image" content="https://three.ws/api/page-og?s=labs&amp;t=Claim+the+CZ+agent&amp;d=Connect+a+wallet%2C+sign+one+line%2C+and+take+ownership+of+the+pre-registered+CZ+agent%2C+then+copy+its+embed+snippet.&amp;p=%2Fcz">
	<meta property="og:image:width" content="1200">
	<meta property="og:image:height" content="630">
	<meta property="og:image:type" content="image/png">
	<meta property="og:image:alt" content="Claim the CZ agent - three.ws">
	<meta name="twitter:card" content="summary_large_image">
	<meta name="twitter:site" content="@trythreews">
	<meta name="twitter:title" content="Claim the CZ agent · three.ws">
	<meta name="twitter:description" content="Connect a wallet, sign one line, and take ownership of the pre-registered CZ agent, then copy its embed snippet.">
	<meta name="twitter:image" content="https://three.ws/api/page-og?s=labs&amp;t=Claim+the+CZ+agent&amp;d=Connect+a+wallet%2C+sign+one+line%2C+and+take+ownership+of+the+pre-registered+CZ+agent%2C+then+copy+its+embed+snippet.&amp;p=%2Fcz">
	<script type="application/ld+json">{"@context":"https://schema.org","@graph":[{"@type":"WebPage","name":"Claim the CZ agent","description":"Connect a wallet, sign one line, and take ownership of the pre-registered CZ agent, then copy its embed snippet.","url":"https://three.ws/cz","isPartOf":{"@type":"WebSite","name":"three.ws","url":"https://three.ws"},"primaryImageOfPage":"https://three.ws/api/page-og?s=labs&t=Claim+the+CZ+agent&d=Connect+a+wallet%2C+sign+one+line%2C+and+take+ownership+of+the+pre-registered+CZ+agent%2C+then+copy+its+embed+snippet.&p=%2Fcz"}]}</script>
</head>
	<body>
		<header>
			<div id="nav-container"></div>
		</header>
		<script src="/nav.js"></script>

		<header class="page-header">
			<span class="logo"><img src="/three.svg" alt="" class="header-logo" aria-hidden="true" />three.ws</span>
		</header>
		<main>
			<div class="agent-wrap">
				<!-- agent-id is hardcoded once at top of cz.js and set here via JS -->
				<agent-3d id="preview" kiosk eager></agent-3d>
			</div>

			<section class="claim-panel">
				<h1 data-i18n-html="cz_index.welcome_cz_claim_your_on_chain_agent">Welcome, CZ.<br />Claim your on-chain agent.</h1>

				<div id="step-connect" class="step">
					<button id="btn-connect" class="btn-primary" data-i18n="cz_index.connect_wallet_to_claim">Connect wallet to claim</button>
				</div>

				<div id="step-sign" class="step hidden">
					<p class="wallet-addr" id="wallet-addr"></p>
					<button id="btn-sign" class="btn-primary" data-i18n="cz_index.sign_claim_transaction">⬢ Sign claim transaction</button>
				</div>

				<div id="step-success" class="step hidden">
					<p class="success-msg" data-i18n-html="cz_index.you_now_own_here_s_your_embed">
						You now own <strong id="agent-name-display"></strong>. Here's your embed
						snippet.
					</p>
					<div class="snippet-wrap">
						<pre id="snippet-script"></pre>
						<pre id="snippet-tag"></pre>
						<pre id="snippet-iframe"></pre>
					</div>
				</div>

				<div id="step-error" class="step hidden">
					<p class="error-msg" id="error-msg"></p>
					<button id="btn-retry" class="btn-secondary" data-i18n="cz_index.try_again">Try again</button>
				</div>
			</section>
		</main>
		<script type="module" src="/cz/cz.js"></script>

		<div id="footer-container"></div>
		<script src="/footer.js" defer></script>
		<script src="/brand.js" defer></script>
	<!-- Runtime i18n: detects locale, swaps annotated copy, mounts <lang-switcher>. -->
	<script type="module" src="/i18n.js"></script>
</body>
</html>
