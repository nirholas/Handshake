<!doctype html>
<html lang="en">
<head>
	<script>/* three.ws theme boot: no-flash; runtime in /theme-switcher.js */(function(){try{var m=localStorage.getItem('twx_theme');var l=m==='auto'?(window.matchMedia&&window.matchMedia('(prefers-color-scheme: light)').matches):m==='light';document.documentElement.setAttribute('data-theme',l?'light':'dark');}catch(e){document.documentElement.setAttribute('data-theme','dark');}})();</script>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
	<meta name="theme-color" content="#000000" />
	<title>Offline · three.ws</title>
	<link rel="icon" href="/favicon.ico" sizes="any" />
	<style>
		:root { color-scheme: dark; --bg: #080814; --panel: #10101c; --border: #23233a; --text: #f5f5f7; --muted: #9a9ab0; --accent: #ffffff; --accent-ink: #000000; }
		* { box-sizing: border-box; }
		html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text); }
		body { font: 16px/1.55 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; display: grid; place-items: center; padding: max(24px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left)); }
		main { width: 100%; max-width: 420px; background: var(--panel); border: 1px solid var(--border); border-radius: 16px; padding: 28px 24px; text-align: center; animation: rise 320ms ease-out both; }
		@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
		.mark { width: 56px; height: 56px; margin: 0 auto 18px; display: block; }
		h1 { font-size: 1.35rem; margin: 0 0 8px; letter-spacing: -0.01em; }
		p { margin: 0 0 20px; color: var(--muted); }
		.status { display: inline-flex; align-items: center; gap: 8px; font-size: 0.85rem; color: var(--muted); margin-bottom: 20px; }
		.dot { width: 8px; height: 8px; border-radius: 50%; background: #ff5577; box-shadow: 0 0 0 0 rgba(255, 85, 119, 0.5); animation: pulse 1.6s infinite; }
		.dot.online { background: #4ade80; animation: none; }
		@keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(255, 85, 119, 0.5); } 70% { box-shadow: 0 0 0 8px rgba(255, 85, 119, 0); } 100% { box-shadow: 0 0 0 0 rgba(255, 85, 119, 0); } }
		button { width: 100%; min-height: 48px; border: 0; border-radius: 12px; background: var(--accent); color: var(--accent-ink); font: inherit; font-weight: 600; cursor: pointer; transition: transform 120ms ease, opacity 120ms ease; }
		button:hover { opacity: 0.92; }
		button:active { transform: scale(0.98); }
		button:focus-visible { outline: 2px solid #60a5fa; outline-offset: 3px; }
		small { display: block; margin-top: 16px; color: var(--muted); font-size: 0.8rem; }
	</style>
</head>
<body>
	<main>
		<img class="mark" src="/pwa-icon.svg" alt="" width="56" height="56" />
		<h1>You're offline</h1>
		<p>three.ws needs a connection to load 3D agents and to sign with Seed Vault. Nothing is lost: your session and your keys stay on the device.</p>
		<div class="status" role="status" aria-live="polite"><span class="dot" id="dot"></span><span id="status-text">Waiting for a connection</span></div>
		<button type="button" id="retry">Try again</button>
		<small>The app reconnects on its own the moment the network is back.</small>
	</main>
	<script>
		(function () {
			var dot = document.getElementById('dot');
			var text = document.getElementById('status-text');
			var retry = document.getElementById('retry');
			function reload() { location.reload(); }
			function paint() {
				var on = navigator.onLine;
				dot.className = 'dot' + (on ? ' online' : '');
				text.textContent = on ? 'Back online, reloading' : 'Waiting for a connection';
				if (on) setTimeout(reload, 400);
			}
			retry.addEventListener('click', reload);
			window.addEventListener('online', paint);
			window.addEventListener('offline', paint);
			paint();
		})();
	</script>
</body>
</html>
