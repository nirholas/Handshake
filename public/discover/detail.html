<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta http-equiv="X-UA-Compatible" content="IE=edge" />
		<title data-i18n="discover_detail.meta_title">Agent · three.ws</title>
		<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
		<meta name="description" content="Agent detail on three.ws"  data-i18n-attr="content:discover_detail.meta_description"/>
		<meta name="theme-color" content="#000000" />
		<link rel="shortcut icon" href="/favicon.ico" />
		<link rel="stylesheet" href="/style.css" />
		<link rel="stylesheet" href="/nav.css" />
		<link rel="stylesheet" href="/discover/detail.css" />
		<link rel="stylesheet" href="/fonts/fonts.css" />
	</head>
	<body class="features-page detail-page">
		<header>
			<div id="nav-container"></div>
		</header>
		<script src="/nav.js"></script>

		<main class="detail-main" data-role="main">
			<!-- Loading skeleton -->
			<div class="detail-loading" data-role="loading">
				<div class="detail-skeleton detail-skeleton--hero"></div>
				<div class="detail-skeleton detail-skeleton--title"></div>
				<div class="detail-skeleton detail-skeleton--body"></div>
			</div>

			<!-- Error state -->
			<div class="detail-error" data-role="error" hidden>
				<div class="detail-error-icon">⚠</div>
				<h2 data-role="error-title" data-i18n="discover_detail.not_found">Not found</h2>
				<p data-role="error-msg" data-i18n="discover_detail.this_item_could_not_be_loaded">This item could not be loaded.</p>
				<div class="detail-error-actions">
					<button type="button" class="detail-btn detail-btn--primary" data-role="error-retry" hidden data-i18n="discover_detail.retry">Retry</button>
					<a href="/discover" class="detail-btn" data-i18n="discover_detail.back_to_discover">← Back to Discover</a>
				</div>
			</div>

			<!-- Content (populated by JS) -->
			<div class="detail-content" data-role="content" hidden>
				<nav class="detail-breadcrumb">
					<a href="/discover" class="detail-breadcrumb-link" data-i18n="discover_detail.discover">← Discover</a>
				</nav>

				<div class="detail-hero">
					<div class="detail-hero-media" data-role="hero-media">
						<!-- image or placeholder -->
					</div>
					<div class="detail-hero-body">
						<div class="detail-badges" data-role="badges"></div>
						<h1 class="detail-name" data-role="name"></h1>
						<p class="detail-desc" data-role="desc" hidden></p>
						<div class="detail-meta-row" data-role="meta-row"></div>
						<div class="detail-actions" data-role="actions"></div>
					</div>
				</div>

				<!-- 3D viewer (shown when has3d) -->
				<div class="detail-viewer-wrap" data-role="viewer-wrap" hidden>
					<div class="detail-section-label">3D Preview</div>
					<div class="detail-viewer" data-role="viewer">
						<!-- agent-3d web component injected by JS -->
					</div>
				</div>

				<div class="detail-panels">
					<!-- Services panel (onchain only) -->
					<div class="detail-panel" data-role="services-panel" hidden>
						<div class="detail-panel-head">
							<span class="detail-panel-title" data-i18n="discover_detail.services">Services</span>
							<span class="detail-panel-badge" data-role="service-count">0</span>
						</div>
						<ul class="detail-services" data-role="services"></ul>
					</div>

					<!-- Tags panel (avatar only) -->
					<div class="detail-panel" data-role="tags-panel" hidden>
						<div class="detail-panel-head">
							<span class="detail-panel-title" data-i18n="discover_detail.tags">Tags</span>
						</div>
						<div class="detail-tags" data-role="tags"></div>
					</div>

					<!-- On-chain details (onchain only) -->
					<div class="detail-panel" data-role="onchain-panel" hidden>
						<div class="detail-panel-head">
							<span class="detail-panel-title" data-i18n="discover_detail.on_chain_details">On-chain details</span>
						</div>
						<dl class="detail-dl" data-role="onchain-dl"></dl>
					</div>

					<!-- On-chain history, from the platform's own cross-chain index
					     (agent_onchain_events). Solana and EVM both land here. -->
					<div class="detail-panel detail-panel--full" data-role="history-panel" hidden>
						<div class="detail-panel-head">
							<span class="detail-panel-title" data-i18n="discover_detail.on_chain_history">On-chain history</span>
							<span class="detail-panel-badge" data-role="history-count">0</span>
						</div>
						<ol class="detail-history" data-role="history"></ol>
						<p class="detail-history-foot" data-role="history-foot"></p>
					</div>

					<!-- Avatar details (avatar only) -->
					<div class="detail-panel" data-role="avatar-panel" hidden>
						<div class="detail-panel-head">
							<span class="detail-panel-title" data-i18n="discover_detail.details">Details</span>
						</div>
						<dl class="detail-dl" data-role="avatar-dl"></dl>
					</div>

					<!-- Embed panel -->
					<div class="detail-panel" data-role="embed-panel" hidden>
						<div class="detail-panel-head">
							<span class="detail-panel-title" data-i18n="discover_detail.embed">Embed</span>
						</div>
						<div class="detail-embed-tabs" data-role="embed-tabs"></div>
						<div class="detail-embed-panes" data-role="embed-panes"></div>
					</div>
				</div>
			</div>
		</main>

		<script type="module" src="/discover/detail.js"></script>
		<script src="/brand.js" defer></script>
		<div id="footer-container"></div>
		<script src="/footer.js"></script>
	<!-- Runtime i18n: detects locale, swaps annotated copy, mounts <lang-switcher>. -->
	<script type="module" src="/i18n.js"></script>
</body>
</html>
