<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta http-equiv="X-UA-Compatible" content="IE=edge" />
		<title data-i18n="discover_index.meta_title">Discover · three.ws</title>
		<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
		<meta
			name="description"
			content="Discover agents registered on Solana and 20+ EVM chains. Filter by 3D avatar, chain, and keywords."
		 data-i18n-attr="content:discover_index.meta_description"/>
		<meta name="theme-color" content="#000000" />
		<link rel="canonical" href="https://three.ws/discover" />

		<meta property="og:type" content="website" />
		<meta property="og:title" content="Discover · three.ws"  data-i18n-attr="content:discover_index.meta_og_title"/>
		<meta
			property="og:description"
			content="Browse agents registered on Solana and 20+ EVM chains. Filter by 3D avatar, chain, and keywords."
		 data-i18n-attr="content:discover_index.meta_og_description"/>
		<meta property="og:url" content="https://three.ws/discover" />
		<meta property="og:image" content="https://three.ws/api/page-og?s=main&amp;t=Discover&amp;d=On-chain+agent+directory+%28ERC-8004+%2B+Solana%29.+Browse%2C+search%2C+and+inspect+every+registered+agent.&amp;p=%2Fdiscover" />
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:title" content="Discover · three.ws"  data-i18n-attr="content:discover_index.meta_twitter_title"/>
		<meta
			name="twitter:description"
			content="The on-chain agent directory. Solana and 20+ EVM chains."
		 data-i18n-attr="content:discover_index.meta_twitter_description"/>
		<meta name="twitter:image" content="https://three.ws/api/page-og?s=main&amp;t=Discover&amp;d=On-chain+agent+directory+%28ERC-8004+%2B+Solana%29.+Browse%2C+search%2C+and+inspect+every+registered+agent.&amp;p=%2Fdiscover" />
		<link rel="shortcut icon" href="/favicon.ico" />
		<link rel="preload" href="/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin />
		<link rel="preload" href="/fonts/space-grotesk-latin.woff2" as="font" type="font/woff2" crossorigin />
		<link rel="stylesheet" href="/style.css" />
		<link rel="stylesheet" href="/nav.css" />
		<link rel="stylesheet" href="/fonts/fonts.css" />
		<!-- Deferred, and placed BEFORE the model-viewer module: defer scripts and
		     module scripts execute in document order, so the meshopt shim still
		     registers its decoder before model-viewer's define runs. -->
		<script src="/model-viewer-meshopt.js" defer></script>
		<script
			type="module"
			src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js" integrity="sha384-sr9b4Ux0WhAUGclJ0ym0FSY2zSOMmNSn0bP/SA0e6bNCrpn/5W3QL8mm+LdlQMKw" crossorigin="anonymous"
		></script>
		<style>
			.explore-card-thumb model-viewer.explore-card-mv {
				width: 100%;
				height: 100%;
				display: block;
				background: transparent;
				/* Card thumb is wrapped in an <a> — let clicks pass through. */
				pointer-events: none;
				--poster-color: transparent;
				--progress-bar-color: rgba(255, 255, 255, 0.4);
				--progress-bar-height: 2px;
			}
		</style>
	
	<meta property="og:site_name" content="three.ws">
	<script type="application/ld+json">{"@context":"https://schema.org","@type":"WebPage","name":"Discover","description":"On-chain agent directory (ERC-8004 + Solana). Browse, search, and inspect every registered agent.","url":"https://three.ws/discover","isPartOf":{"@type":"WebSite","name":"three.ws","url":"https://three.ws"}}</script>

	<meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1">
	<meta property="og:locale" content="en_US">
	<meta property="og:image:alt" content="Discover — three.ws">
	<meta name="twitter:site" content="@trythreews">
</head>
	<body class="features-page explore-page">
		<header>
			<div id="nav-container"></div>
		</header>
		<script src="/nav.js" defer></script>

		<main class="features-main explore-main">
			<section class="explore-hero">
				<div class="explore-hero-chips">
					<a href="/forge" class="explore-hero-chip explore-hero-chip--link" data-i18n-html="discover_index.new_forge_a_3d_model_from_text">
						<span>New · Forge a 3D model from text →</span>
					</a>
					<a
						href="/my-agents"
						class="explore-hero-chip explore-hero-chip--link"
						data-role="my-agents-chip"
						hidden
					 data-i18n-html="discover_index.view_my_agents">
						<span>View my agents →</span>
					</a>
				</div>
				<p class="explore-eyebrow" data-i18n="discover_index.erc_8004_agent_directory">ERC-8004 Agent Directory</p>
				<h1 data-i18n="discover_index.every_agent_every_chain">Every agent, every chain.</h1>
				<p class="explore-sub" data-i18n="discover_index.browse_agents_registered_on_solana_and_20">
					Browse agents registered on Solana and 20+ EVM chains. Click a 3D avatar to load it in
					the viewer. Click any card for its on-chain passport.
				</p>
				<p class="explore-stats" data-role="stats" hidden></p>

			</section>

			<section class="explore-controls">
				<!-- Shared list-controls toolkit (search · filter chips · source chips · sort)
				     mounts here. Built by discover.js via createListControls(). The chain
				     selector below is page-specific (dynamic option list) and is appended
				     into the toolbar's primary row at runtime. -->
				<div class="explore-toolbar" data-role="list-controls"></div>
				<div class="explore-chain-select" data-role="chain-wrap">
					<label for="explore-chain" data-i18n="discover_index.chain">Chain</label>
					<div class="explore-chain-select-control">
						<select id="explore-chain" data-role="chain" aria-label="Filter by chain">
							<option value="" data-i18n="discover_index.all_chains">All chains</option>
						</select>
					</div>
				</div>
			</section>

			<section class="explore-grid-wrap">
				<div class="explore-grid" data-role="grid"></div>
				<div class="explore-status" data-role="status"></div>
				<div class="explore-sentinel" data-role="sentinel" aria-hidden="true"></div>
				<div class="explore-load-more-wrap">
					<button class="explore-load-more" data-role="load-more" hidden data-i18n="discover_index.load_more">
						Load more
					</button>
				</div>
			</section>
		</main>

		<div id="footer-container"></div>
		<script src="/footer.js" defer></script>

		<script type="module" src="/discover/discover.js"></script>
		<script src="/brand.js" defer></script>
	<!-- Runtime i18n: detects locale, swaps annotated copy, mounts <lang-switcher>. -->
	<script type="module" src="/i18n.js"></script>
</body>
</html>
