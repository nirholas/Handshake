		<!-- The meshopt decoder shim stays eager. It is a 2 KB classic script that
		     intercepts customElements.define(), so it wins the race against the
		     element bundle no matter when that bundle arrives, and every
		     server-baked GLB needs its decoder registered before the first load
		     starts. -->
		<script src="/model-viewer-meshopt.js" defer></script>
		<!-- The <model-viewer> element bundle is NOT loaded here. It is 253 KB of
		     module JavaScript that builds a WebGL renderer on the main thread, and
		     most of this directory renders static R2 thumbnails: an entire page of
		     results can go by without one 3D card. Loading it on every visit cost
		     /discover its interactivity. Lighthouse desktop attributed 29 s of
		     main-thread time to it and scored the page 47, against 81 for the same
		     page measured without it. discover.js now asks
		     src/shared/model-viewer-loader.js for the element the moment a card
		     that actually has a GLB comes near the viewport, which also brings the
		     CDN failover chain this hardcoded tag never had. -->
		<style>
			/* Until the element bundle upgrades the tag, `model-viewer` is an unknown
			   inline element. Keep its box exactly the size the upgraded viewer will
			   occupy (the thumb is already aspect-ratio locked, so nothing shifts)
			   and fill it with the same surface tone the card uses, so a 3D card
			   reads as a loading tile rather than a hole. */
			.explore-card-thumb model-viewer.explore-card-mv:not(:defined) {
				display: block;
				width: 100%;
				height: 100%;
				background: rgba(255, 255, 255, 0.03);
			}
			.explore-card-thumb model-viewer.explore-card-mv {
				width: 100%;
				height: 100%;
				display: block;
				background: transparent;
				/* Card thumb is wrapped in an <a> — let clicks pass through. */
				pointer-events: none;
				--poster-color: transparent;
				--progress-bar-color: rgba(255, 255, 255, 0.4);
				--progress-bar-height: 2px;
			}
		</style>

	<body class="features-page explore-page">
		<header>
			<div id="nav-container"></div>
		</header>
		<script src="/nav.js" defer></script>

		<main class="features-main explore-main">
			<section class="explore-hero">
				<div class="explore-hero-chips">
					<a href="/forge" class="explore-hero-chip explore-hero-chip--link" data-i18n-html="discover_index.new_forge_a_3d_model_from_text">
						<span>New · Forge a 3D model from text →</span>
					</a>
					<a
						href="/my-agents"
						class="explore-hero-chip explore-hero-chip--link"
						data-role="my-agents-chip"
						hidden
					 data-i18n-html="discover_index.view_my_agents">
						<span>View my agents →</span>
					</a>
				</div>
				<p class="explore-eyebrow" data-i18n="discover_index.erc_8004_agent_directory">ERC-8004 Agent Directory</p>
				<h1 data-i18n="discover_index.every_agent_every_chain">Every agent, every chain.</h1>
				<p class="explore-sub" data-i18n="discover_index.browse_agents_registered_on_solana_and_20">
					Browse agents registered on Solana and 20+ EVM chains. Click a 3D avatar to load it in
					the viewer. Click any card for its on-chain passport.
				</p>
				<p class="explore-stats" data-role="stats" hidden></p>

			</section>

			<section class="explore-controls">
				<!-- Shared list-controls toolkit (search · filter chips · source chips · sort)
				     mounts here. Built by discover.js via createListControls(). The chain
				     selector below is page-specific (dynamic option list) and is appended
				     into the toolbar's primary row at runtime. -->
				<div class="explore-toolbar" data-role="list-controls"></div>
				<div class="explore-chain-select" data-role="chain-wrap">
					<label for="explore-chain" data-i18n="discover_index.chain">Chain</label>
					<div class="explore-chain-select-control">
						<select id="explore-chain" data-role="chain" aria-label="Filter by chain">
							<option value="" data-i18n="discover_index.all_chains">All chains</option>
						</select>
					</div>
				</div>
			</section>

			<section class="explore-grid-wrap">
				<div class="explore-grid" data-role="grid"></div>
				<div class="explore-status" data-role="status"></div>
				<div class="explore-sentinel" data-role="sentinel" aria-hidden="true"></div>
				<div class="explore-load-more-wrap">
					<button class="explore-load-more" data-role="load-more" hidden data-i18n="discover_index.load_more">
						Load more
					</button>
				</div>
			</section>
		</main>

		<div id="footer-container"></div>
		<script src="/footer.js" defer></script>

		<script type="module" src="/discover/discover.js"></script>
		<script src="/brand.js" defer></script>
	<!-- Runtime i18n: detects locale, swaps annotated copy, mounts <lang-switcher>. -->
	<script type="module" src="/i18n.js"></script>
