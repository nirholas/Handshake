<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Monica's Apartment - a first-person Three.js scene</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #120d16; }
  #app { position: fixed; inset: 0; }
  canvas { display: block; }

  #overlay {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px;
    background: radial-gradient(ellipse at center, rgba(30,18,36,.82), rgba(10,6,14,.94));
    color: #f3e9d6; font-family: Georgia, 'Times New Roman', serif;
    cursor: pointer; z-index: 10; text-align: center;
    transition: opacity .45s ease;
  }
  #overlay.hidden { opacity: 0; pointer-events: none; }
  #overlay h1 { font-size: clamp(28px, 5vw, 52px); font-weight: normal; margin: 0; letter-spacing: .04em; }
  #overlay h1 em { color: #e8b84b; font-style: normal; }
  #overlay p { margin: 0; font-size: 15px; opacity: .8; font-family: system-ui, sans-serif; }
  #overlay .enter {
    margin-top: 10px; padding: 12px 34px; border: 1px solid #e8b84b; border-radius: 999px;
    font-family: system-ui, sans-serif; font-size: 14px; letter-spacing: .12em;
    text-transform: uppercase; color: #e8b84b; background: rgba(232,184,75,.08);
    transition: background .2s ease, transform .2s ease;
  }
  #overlay:hover .enter { background: rgba(232,184,75,.2); transform: translateY(-1px); }

  #crosshair {
    position: fixed; left: 50%; top: 50%; width: 5px; height: 5px; border-radius: 50%;
    background: rgba(255, 240, 210, .85); transform: translate(-50%, -50%);
    z-index: 5; pointer-events: none; opacity: 0; transition: opacity .3s;
    box-shadow: 0 0 6px rgba(0,0,0,.6);
  }
  body.playing #crosshair { opacity: 1; }

  #hud {
    position: fixed; left: 16px; bottom: 14px; z-index: 5; pointer-events: none;
    color: rgba(243,233,214,.55); font: 12px/1.5 system-ui, sans-serif;
    opacity: 0; transition: opacity .3s;
  }
  body.playing #hud { opacity: 1; }
</style>
</head>
<body>
<div id="app"></div>
<div id="crosshair"></div>
<div id="hud">WASD move &nbsp;·&nbsp; mouse look &nbsp;·&nbsp; shift run &nbsp;·&nbsp; esc release</div>
<div id="overlay">
  <h1>The One With the <em>Purple Door</em></h1>
  <p>Monica's apartment, rebuilt in Three.js. First-person, fully walkable.</p>
  <div class="enter">Click to step inside</div>
</div>

<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.module.js" } }
</script>

<script type="module">
import * as THREE from 'three';

/* ------------------------------------------------------------------ */
/* Renderer / scene / camera                                           */
/* ------------------------------------------------------------------ */

const app = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.18;
app.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b0918);
scene.fog = new THREE.Fog(0x0b0918, 22, 45);

const camera = new THREE.PerspectiveCamera(72, window.innerWidth / window.innerHeight, 0.05, 120);

// yaw/pitch rig for first-person look
const pitchRig = new THREE.Object3D();
pitchRig.add(camera);
const yawRig = new THREE.Object3D();
yawRig.add(pitchRig);
yawRig.position.set(0, 1.62, 3.1);
yawRig.rotation.y = 0; // face north: kitchen and the big window
scene.add(yawRig);

/* ------------------------------------------------------------------ */
/* Room dimensions                                                     */
/* ------------------------------------------------------------------ */

const W = 10, D = 8, H = 3.05;           // interior: x in [-5,5], z in [-4,4]
const HX = W / 2, HZ = D / 2;

/* ------------------------------------------------------------------ */
/* Procedural textures                                                 */
/* ------------------------------------------------------------------ */

function canvasTexture(w, h, draw, repeatX = 1, repeatY = 1) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(repeatX, repeatY);
  t.anisotropy = 8;
  return t;
}

// seedable PRNG so the scene is identical every load
let seed = 1913;
function rand() { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }

const woodFloorTex = canvasTexture(512, 512, (g, w, h) => {
  g.fillStyle = '#8a5a33'; g.fillRect(0, 0, w, h);
  const plankH = h / 8;
  for (let r = 0; r < 8; r++) {
    for (let cx = -1; cx < 4; cx++) {
      const off = (r % 2) * (w / 6);
      const x = cx * (w / 3) + off, y = r * plankH;
      const l = 18 + rand() * 22;
      g.fillStyle = `rgb(${120 + l}, ${72 + l * 0.62}, ${36 + l * 0.35})`;
      g.fillRect(x, y, w / 3 - 2, plankH - 2);
      // grain
      g.strokeStyle = 'rgba(70,40,16,0.25)'; g.lineWidth = 1;
      for (let k = 0; k < 5; k++) {
        g.beginPath();
        const gy = y + rand() * plankH;
        g.moveTo(x, gy); g.bezierCurveTo(x + 40, gy + rand() * 4 - 2, x + 90, gy + rand() * 4 - 2, x + w / 3, gy);
        g.stroke();
      }
    }
  }
  g.fillStyle = 'rgba(40,22,8,0.55)';
  for (let r = 0; r <= 8; r++) g.fillRect(0, r * plankH - 1, w, 2);
}, 3.2, 2.6);

const rugTex = canvasTexture(512, 384, (g, w, h) => {
  g.fillStyle = '#7d1f1c'; g.fillRect(0, 0, w, h);                 // deep red field
  g.strokeStyle = '#d8b46a'; g.lineWidth = 10; g.strokeRect(14, 14, w - 28, h - 28);
  g.strokeStyle = '#3a5a45'; g.lineWidth = 4; g.strokeRect(30, 30, w - 60, h - 60);
  // medallion
  g.fillStyle = '#d8b46a';
  g.beginPath(); g.ellipse(w / 2, h / 2, 74, 52, 0, 0, Math.PI * 2); g.fill();
  g.fillStyle = '#7d1f1c';
  g.beginPath(); g.ellipse(w / 2, h / 2, 52, 34, 0, 0, Math.PI * 2); g.fill();
  g.fillStyle = '#e9d9a8';
  g.beginPath(); g.ellipse(w / 2, h / 2, 16, 11, 0, 0, Math.PI * 2); g.fill();
  // scattered motifs
  g.fillStyle = 'rgba(216,180,106,0.8)';
  for (let i = 0; i < 46; i++) {
    const x = 50 + rand() * (w - 100), y = 50 + rand() * (h - 100);
    if (Math.hypot(x - w / 2, y - h / 2) < 105) continue;
    g.fillRect(x, y, 7, 7);
  }
});

const cityTex = canvasTexture(1024, 512, (g, w, h) => {
  const grad = g.createLinearGradient(0, 0, 0, h);
  grad.addColorStop(0, '#0a0a24'); grad.addColorStop(0.65, '#1d1436'); grad.addColorStop(1, '#3a2140');
  g.fillStyle = grad; g.fillRect(0, 0, w, h);
  // stars
  g.fillStyle = 'rgba(255,255,255,0.7)';
  for (let i = 0; i < 90; i++) g.fillRect(rand() * w, rand() * h * 0.45, 1.4, 1.4);
  // two rows of buildings
  for (const [base, tone] of [[0.32, '#0d0b1a'], [0.18, '#151228']]) {
    let x = 0;
    while (x < w) {
      const bw = 40 + rand() * 80;
      const bh = h * (base + rand() * 0.42);
      g.fillStyle = tone; g.fillRect(x, h - bh, bw, bh);
      // lit windows
      for (let wx = x + 6; wx < x + bw - 8; wx += 12) {
        for (let wy = h - bh + 8; wy < h - 12; wy += 16) {
          if (rand() < 0.42) {
            g.fillStyle = rand() < 0.82 ? 'rgba(255,196,110,0.92)' : 'rgba(160,200,255,0.85)';
            g.fillRect(wx, wy, 6, 8);
          }
        }
      }
      x += bw + 4 + rand() * 26;
    }
  }
});

/* ------------------------------------------------------------------ */
/* Materials                                                           */
/* ------------------------------------------------------------------ */

const M = {
  wall:      new THREE.MeshStandardMaterial({ color: 0x8e6ba1, roughness: 0.95 }),   // Monica purple
  wallDeep:  new THREE.MeshStandardMaterial({ color: 0x7c5a91, roughness: 0.95 }),
  ceiling:   new THREE.MeshStandardMaterial({ color: 0xf0e4cf, roughness: 0.9 }),
  floor:     new THREE.MeshStandardMaterial({ map: woodFloorTex, roughness: 0.55 }),
  trim:      new THREE.MeshStandardMaterial({ color: 0xe8dcc0, roughness: 0.8 }),
  cabinet:   new THREE.MeshStandardMaterial({ color: 0x2f8f86, roughness: 0.6 }),    // teal kitchen
  counter:   new THREE.MeshStandardMaterial({ color: 0xd9cdb2, roughness: 0.35 }),
  appliance: new THREE.MeshStandardMaterial({ color: 0xf2efe6, roughness: 0.35, metalness: 0.1 }),
  steel:     new THREE.MeshStandardMaterial({ color: 0x9aa0a6, roughness: 0.35, metalness: 0.8 }),
  woodDark:  new THREE.MeshStandardMaterial({ color: 0x5a3a22, roughness: 0.6 }),
  woodMid:   new THREE.MeshStandardMaterial({ color: 0x8a5c34, roughness: 0.6 }),
  doorPurple:new THREE.MeshStandardMaterial({ color: 0x5c3b7e, roughness: 0.7 }),
  doorWood:  new THREE.MeshStandardMaterial({ color: 0xcfbfa2, roughness: 0.75 }),
  frameYellow:new THREE.MeshStandardMaterial({ color: 0xe8b84b, roughness: 0.5 }),
  sofa:      new THREE.MeshStandardMaterial({ color: 0xb5806a, roughness: 0.95 }),   // dusty rose-tan
  sofaDeep:  new THREE.MeshStandardMaterial({ color: 0xa06f5c, roughness: 0.95 }),
  chairGreen:new THREE.MeshStandardMaterial({ color: 0x5d7a4a, roughness: 0.95 }),
  chairGold: new THREE.MeshStandardMaterial({ color: 0xb98c3a, roughness: 0.95 }),
  rug:       new THREE.MeshStandardMaterial({ map: rugTex, roughness: 1 }),
  black:     new THREE.MeshStandardMaterial({ color: 0x1c1a1a, roughness: 0.6 }),
  tvScreen:  new THREE.MeshStandardMaterial({ color: 0x101418, roughness: 0.2, metalness: 0.4 }),
  lampShade: new THREE.MeshStandardMaterial({ color: 0xffdfa0, emissive: 0xffb75e, emissiveIntensity: 1.6, roughness: 1, side: THREE.DoubleSide }),
  glass:     new THREE.MeshStandardMaterial({ color: 0xbcd4e8, transparent: true, opacity: 0.07, roughness: 0.1, metalness: 0.2 }),
  plant:     new THREE.MeshStandardMaterial({ color: 0x3f6b35, roughness: 1 }),
  pot:       new THREE.MeshStandardMaterial({ color: 0xa8552f, roughness: 0.9 }),
  curtain:   new THREE.MeshStandardMaterial({ color: 0xd8c49a, roughness: 1, side: THREE.DoubleSide }),
  railing:   new THREE.MeshStandardMaterial({ color: 0x22201f, roughness: 0.5, metalness: 0.6 }),
};

/* ------------------------------------------------------------------ */
/* Collision                                                           */
/* ------------------------------------------------------------------ */

const colliders = [];
const PLAYER_R = 0.28;
function addCollider(minX, maxX, minZ, maxZ) { colliders.push({ minX, maxX, minZ, maxZ }); }

/* ------------------------------------------------------------------ */
/* Helpers                                                             */
/* ------------------------------------------------------------------ */

function box(w, h, d, mat, x, y, z, { shadow = true, collide = false, ry = 0, parent = scene } = {}) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.position.set(x, y, z);
  m.rotation.y = ry;
  m.castShadow = shadow; m.receiveShadow = true;
  parent.add(m);
  if (collide && parent === scene) {
    const hw = (Math.abs(Math.cos(ry)) * w + Math.abs(Math.sin(ry)) * d) / 2;
    const hd = (Math.abs(Math.sin(ry)) * w + Math.abs(Math.cos(ry)) * d) / 2;
    addCollider(x - hw, x + hw, z - hd, z + hd);
  }
  return m;
}

/* ------------------------------------------------------------------ */
/* Shell: floor, ceiling, walls with window + door openings            */
/* ------------------------------------------------------------------ */

{
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(W, D), M.floor);
  floor.rotation.x = -Math.PI / 2;
  floor.receiveShadow = true;
  scene.add(floor);

  const ceil = new THREE.Mesh(new THREE.PlaneGeometry(W, D), M.ceiling);
  ceil.rotation.x = Math.PI / 2;
  ceil.position.y = H;
  scene.add(ceil);
}

const WT = 0.18; // wall thickness

// North wall (z = -HZ): big living-room window x in [0.8, 4.2], y in [0.75, 2.75]
// plus a small kitchen window x in [-3.6, -2.6], y in [1.25, 2.25]
function wallWithOpenings(axis, at, from, to, openings) {
  // vertical wall built from segments; openings: [{a0,a1,y0,y1}] along the wall axis
  const segs = [];
  let cursor = from;
  const sorted = [...openings].sort((a, b) => a.a0 - b.a0);
  for (const o of sorted) { segs.push({ a0: cursor, a1: o.a0, full: true }); cursor = o.a1; }
  segs.push({ a0: cursor, a1: to, full: true });
  const parts = [];
  for (const s of segs) if (s.a1 - s.a0 > 0.01) parts.push({ a0: s.a0, a1: s.a1, y0: 0, y1: H });
  for (const o of sorted) {
    if (o.y0 > 0.01) parts.push({ a0: o.a0, a1: o.a1, y0: 0, y1: o.y0 });
    if (o.y1 < H - 0.01) parts.push({ a0: o.a0, a1: o.a1, y0: o.y1, y1: H });
  }
  for (const p of parts) {
    const len = p.a1 - p.a0, ht = p.y1 - p.y0;
    const mid = (p.a0 + p.a1) / 2, ymid = (p.y0 + p.y1) / 2;
    if (axis === 'x') box(len, ht, WT, M.wall, mid, ymid, at, { shadow: false });
    else box(WT, ht, len, M.wall, at, ymid, mid, { shadow: false });
  }
  if (axis === 'x') addCollider(from, to, at - WT, at + WT);
  else addCollider(at - WT, at + WT, from, to);
}

wallWithOpenings('x', -HZ, -HX, HX, [
  { a0: 0.8, a1: 4.2, y0: 0.75, y1: 2.75 },
  { a0: -3.6, a1: -2.6, y0: 1.25, y1: 2.25 },
]);
wallWithOpenings('x', HZ, -HX, HX, []);          // south wall (solid)
wallWithOpenings('z', -HX, -HZ, HZ, []);         // west wall (bedroom doors are set dressing)
wallWithOpenings('z', HX, -HZ, HZ, []);          // east wall (front door is set dressing)

// baseboards + crown
for (const [z] of [[-HZ + WT / 2 + 0.02], [HZ - WT / 2 - 0.02]]) {
  box(W, 0.12, 0.03, M.trim, 0, 0.06, z, { shadow: false });
  box(W, 0.09, 0.03, M.trim, 0, H - 0.045, z, { shadow: false });
}
for (const [x] of [[-HX + WT / 2 + 0.02], [HX - WT / 2 - 0.02]]) {
  box(0.03, 0.12, D, M.trim, x, 0.06, 0, { shadow: false });
  box(0.03, 0.09, D, M.trim, x, H - 0.045, 0, { shadow: false });
}

/* ------------------------------------------------------------------ */
/* Big window: frame, mullions, glass, curtains                        */
/* ------------------------------------------------------------------ */

function pane(x0, x1, y0, y1, z) {
  // frame
  const fw = 0.07;
  box(x1 - x0 + fw * 2, fw, WT + 0.06, M.woodDark, (x0 + x1) / 2, y1 + fw / 2, z, { shadow: false });
  box(x1 - x0 + fw * 2, fw, WT + 0.06, M.woodDark, (x0 + x1) / 2, y0 - fw / 2, z, { shadow: false });
  box(fw, y1 - y0, WT + 0.06, M.woodDark, x0 - fw / 2, (y0 + y1) / 2, z, { shadow: false });
  box(fw, y1 - y0, WT + 0.06, M.woodDark, x1 + fw / 2, (y0 + y1) / 2, z, { shadow: false });
  // mullions: 4 cols x 3 rows
  const cols = 4, rows = 3;
  for (let i = 1; i < cols; i++)
    box(0.035, y1 - y0, 0.05, M.woodDark, x0 + (x1 - x0) * i / cols, (y0 + y1) / 2, z, { shadow: false });
  for (let j = 1; j < rows; j++)
    box(x1 - x0, 0.035, 0.05, M.woodDark, (x0 + x1) / 2, y0 + (y1 - y0) * j / rows, z, { shadow: false });
  // glass
  const g = new THREE.Mesh(new THREE.PlaneGeometry(x1 - x0, y1 - y0), M.glass);
  g.position.set((x0 + x1) / 2, (y0 + y1) / 2, z);
  scene.add(g);
  // sill
  box(x1 - x0 + 0.3, 0.05, 0.28, M.trim, (x0 + x1) / 2, y0 - 0.025, z + 0.1, { shadow: false });
}

pane(0.8, 4.2, 0.75, 2.75, -HZ);
pane(-3.6, -2.6, 1.25, 2.25, -HZ);

// curtains flanking the big window
for (const cx of [0.62, 4.38]) {
  const cur = new THREE.Mesh(new THREE.PlaneGeometry(0.5, 2.35, 8, 1), M.curtain);
  const pos = cur.geometry.attributes.position;
  for (let i = 0; i < pos.count; i++) pos.setZ(i, Math.sin(pos.getX(i) * 22) * 0.05);
  pos.needsUpdate = true;
  cur.geometry.computeVertexNormals();
  cur.position.set(cx, 1.72, -HZ + WT / 2 + 0.12);
  scene.add(cur);
}
box(3.9, 0.05, 0.05, M.woodDark, 2.5, 2.94, -HZ + WT / 2 + 0.12, { shadow: false }); // curtain rod

/* ------------------------------------------------------------------ */
/* Outside: balcony, fire-escape railing, skyline, moon                */
/* ------------------------------------------------------------------ */

{
  const balc = box(4.4, 0.08, 1.6, M.black, 2.5, 0.71, -HZ - 0.9, { shadow: false });
  balc.receiveShadow = true;
  // railing
  for (let i = 0; i <= 10; i++)
    box(0.035, 1.0, 0.035, M.railing, 0.4 + i * 0.42, 1.25, -HZ - 1.65, { shadow: false });
  box(4.4, 0.05, 0.05, M.railing, 2.5, 1.78, -HZ - 1.65, { shadow: false });
  for (const zz of [-HZ - 1.3, -HZ - 0.95]) {
    box(0.035, 1.0, 0.7, M.railing, 0.35, 1.25, zz + 0.35 - 0.35, { shadow: false });
  }
  // side rails
  box(0.04, 0.05, 1.55, M.railing, 0.35, 1.78, -HZ - 0.9, { shadow: false });
  box(0.04, 0.05, 1.55, M.railing, 4.65, 1.78, -HZ - 0.9, { shadow: false });
  // fire-escape ladder hint
  for (let i = 0; i < 6; i++)
    box(0.5, 0.035, 0.035, M.railing, 4.35, 0.4 + i * 0.5, -HZ - 1.55, { shadow: false });

  // skyline: big unlit backdrop
  const city = new THREE.Mesh(new THREE.PlaneGeometry(60, 30), new THREE.MeshBasicMaterial({ map: cityTex }));
  city.position.set(0, 7, -HZ - 22);
  scene.add(city);

  const moon = new THREE.Mesh(new THREE.CircleGeometry(1.1, 32),
    new THREE.MeshBasicMaterial({ color: 0xfff4d6 }));
  moon.position.set(-7, 13.5, -HZ - 21.5);
  scene.add(moon);
  const glow = new THREE.Mesh(new THREE.CircleGeometry(1.9, 32),
    new THREE.MeshBasicMaterial({ color: 0xfff4d6, transparent: true, opacity: 0.16 }));
  glow.position.set(-7, 13.5, -HZ - 21.6);
  scene.add(glow);
}

/* ------------------------------------------------------------------ */
/* Doors (set dressing on solid walls)                                 */
/* ------------------------------------------------------------------ */

function door(axis, at, along, mat, { frameMat = M.trim, peephole = false } = {}) {
  const dw = 0.95, dh = 2.08, t = 0.06;
  const fx = 0.09;
  if (axis === 'z') { // on west/east wall, door faces +/- x
    const dir = at < 0 ? 1 : -1;
    const x = at + dir * (WT / 2 + t / 2);
    box(t, dh, dw, mat, x, dh / 2, along, { shadow: false });
    box(t + 0.02, dh + fx, fx, frameMat, x, (dh + fx) / 2 - fx / 2 + 0.04, along - dw / 2 - fx / 2, { shadow: false });
    box(t + 0.02, dh + fx, fx, frameMat, x, (dh + fx) / 2 - fx / 2 + 0.04, along + dw / 2 + fx / 2, { shadow: false });
    box(t + 0.02, fx, dw + fx * 2, frameMat, x, dh + fx / 2, along, { shadow: false });
    // knob
    box(0.05, 0.05, 0.05, M.frameYellow, x + dir * 0.05, 1.02, along + dw / 2 - 0.14, { shadow: false });
    if (peephole) {
      // the iconic yellow frame around the peephole
      const yf = new THREE.Mesh(new THREE.TorusGeometry(0.11, 0.022, 10, 4), M.frameYellow);
      yf.rotation.y = Math.PI / 2;
      yf.rotation.z = Math.PI / 4;
      yf.position.set(x + dir * (t / 2 + 0.015), 1.62, along);
      scene.add(yf);
      const ph = new THREE.Mesh(new THREE.CircleGeometry(0.018, 12), M.black);
      ph.rotation.y = dir > 0 ? Math.PI / 2 : -Math.PI / 2;
      ph.position.set(x + dir * (t / 2 + 0.016), 1.62, along);
      scene.add(ph);
    }
  }
}

door('z', HX, 0.9, M.doorPurple, { peephole: true });   // front door, east wall
door('z', HX, -1.8, M.doorWood);                        // bathroom
door('z', -HX, -1.9, M.doorWood);                       // Monica's room
door('z', -HX, 1.2, M.doorWood);                        // Rachel's room

/* ------------------------------------------------------------------ */
/* Kitchen (north-west)                                                */
/* ------------------------------------------------------------------ */

{
  const backZ = -HZ + WT / 2;
  // base cabinets along north wall, x -4.9 .. -1.5
  box(3.4, 0.82, 0.62, M.cabinet, -3.2, 0.41, backZ + 0.31, { collide: true });
  box(3.5, 0.06, 0.7, M.counter, -3.2, 0.87, backZ + 0.35);
  // cabinet door lines
  for (let i = 0; i < 5; i++)
    box(0.56, 0.6, 0.02, M.counter.clone(), -4.7 + i * 0.68, 0.45, backZ + 0.63, { shadow: false })
      .material.color.set(0x257a72);
  // sink under the kitchen window
  box(0.7, 0.02, 0.44, M.steel, -3.1, 0.885, backZ + 0.33, { shadow: false });
  const faucet = new THREE.Mesh(new THREE.TorusGeometry(0.09, 0.016, 8, 16, Math.PI), M.steel);
  faucet.position.set(-3.1, 0.98, backZ + 0.16); faucet.rotation.z = 0; scene.add(faucet);

/* ------------------------------------------------------------------ */
/* First-person controls + collision                                   */
/* ------------------------------------------------------------------ */

const overlay = document.getElementById('overlay');
const keys = {};
let playing = false;

overlay.addEventListener('click', () => renderer.domElement.requestPointerLock());
document.addEventListener('pointerlockchange', () => {
  playing = document.pointerLockElement === renderer.domElement;
  overlay.classList.toggle('hidden', playing);
  document.body.classList.toggle('playing', playing);
});
document.addEventListener('mousemove', (e) => {
  if (!playing) return;
  yawRig.rotation.y -= e.movementX * 0.0022;
  pitchRig.rotation.x = THREE.MathUtils.clamp(pitchRig.rotation.x - e.movementY * 0.0022, -1.35, 1.35);
});
document.addEventListener('keydown', (e) => { keys[e.code] = true; });
document.addEventListener('keyup', (e) => { keys[e.code] = false; });

function blocked(x, z) {
  if (x < -HX + WT + PLAYER_R || x > HX - WT - PLAYER_R) return true;
  if (z < -HZ + WT + PLAYER_R || z > HZ - WT - PLAYER_R) return true;
  for (const c of colliders) {
    if (x > c.minX - PLAYER_R && x < c.maxX + PLAYER_R &&
        z > c.minZ - PLAYER_R && z < c.maxZ + PLAYER_R) return true;
  }
  return false;
}

const timer = new THREE.Timer();
let bobT = 0;

function tick() {
  timer.update();
  const dt = Math.min(timer.getDelta(), 0.05);

  if (playing) {
    const run = keys['ShiftLeft'] || keys['ShiftRight'];
    const speed = (run ? 3.6 : 2.0) * dt;
    let mx = 0, mz = 0;
    if (keys['KeyW'] || keys['ArrowUp']) mz -= 1;
    if (keys['KeyS'] || keys['ArrowDown']) mz += 1;
    if (keys['KeyA'] || keys['ArrowLeft']) mx -= 1;
    if (keys['KeyD'] || keys['ArrowRight']) mx += 1;
    if (mx || mz) {
      const len = Math.hypot(mx, mz); mx /= len; mz /= len;
      const sin = Math.sin(yawRig.rotation.y), cos = Math.cos(yawRig.rotation.y);
      const dx = (mx * cos + mz * sin) * speed;
      const dz = (mz * cos - mx * sin) * speed;
      // axis-separated so we slide along furniture
      if (!blocked(yawRig.position.x + dx, yawRig.position.z)) yawRig.position.x += dx;
      if (!blocked(yawRig.position.x, yawRig.position.z + dz)) yawRig.position.z += dz;
      bobT += dt * (run ? 11 : 7.5);
      camera.position.y = Math.sin(bobT) * 0.026;
    } else {
      camera.position.y *= 0.9;
    }
  }

  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}
tick();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// headless-verification hook: position the camera and report readiness
window.__scene = {
  ready: true,
  snap(x, y, z, yaw, pitch = 0) {
    yawRig.position.set(x, y, z);
    yawRig.rotation.y = yaw;
    pitchRig.rotation.x = pitch;
    renderer.render(scene, camera);
  },
};
