<head>

	<meta name="twitter:card" content="summary_large_image" />

	<link rel="canonical" href="https://three.ws/play/war" />
	<link rel="icon" href="/favicon.ico" />
	<!-- The arena's two heaviest first-paint assets, preloaded only when this
	     link actually carries a pairing. src/play/war.js returns early with "No
	     battle to join" when match/ticket/coin are missing (a shared, expired, or
	     hand-typed link), and a static preload on that path downloads a manifest
	     and a 700 KB avatar the page never reads, which is what the browser
	     reports as "preloaded ... but not used". Injecting from the head keeps
	     the head start on the real path: this runs before the module graph below
	     is even fetched. `crossorigin` stays because both consumers request in CORS mode
	     (fetch() defaults to it; three's FileLoader builds a Request, which does
	     too), so dropping it would silently orphan the preload instead. -->
	<script>
		(function () {
			var q = new URLSearchParams(location.search);
			if (!q.get('match') || !q.get('ticket') || !q.get('coin')) return;
			['/animations/manifest.json', '/avatars/default.glb'].forEach(function (href) {
				var l = document.createElement('link');
				l.rel = 'preload';
				l.as = 'fetch';
				l.crossOrigin = 'anonymous';
				l.href = href;
				document.head.appendChild(l);
			});
		})();
	</script>
	<meta name="robots" content="index, follow, max-image-preview:large" />

	<meta property="og:locale" content="en_US">

	<script type="application/ld+json">{"@context":"https://schema.org","@graph":[{"@type":"WebPage","name":"Coin Wars arena: two communities, one battlefield","description":"The live Coin Wars arena. Enlist at your coin world's war portal, fight the rival community to the kill cap, and the result lands on the Elo ladder. You fight for the coin you hold.","url":"https://three.ws/play/war","isPartOf":{"@type":"WebSite","name":"three.ws","url":"https://three.ws"},"primaryImageOfPage":"https://three.ws/api/page-og?s=crypto&t=Coin+Wars+arena%3A+two+communities%2C+one+battlefield&d=The+live+Coin+Wars+arena.+Enlist+at+your+coin+world%27s+war+portal%2C+fight+the+rival+community+to+the+kill+cap%2C+and+the+result+lands+on+the+Elo+ladder.+You+fight&p=%2Fplay%2Fwar"},{"@type":"BreadcrumbList","itemListElement":[{"@type":"ListItem","position":1,"name":"Home","item":"https://three.ws/"},{"@type":"ListItem","position":2,"name":"Play","item":"https://three.ws/play"},{"@type":"ListItem","position":3,"name":"War","item":"https://three.ws/play/war"}]}]}</script>
</head>
<body>
	<canvas id="scene" aria-label="Coin Wars battlefield"></canvas>
	<div class="war-vignette" aria-hidden="true"></div>
	<div id="labels" aria-hidden="true"></div>

	<!-- Loading / working. Never a spinner alone: it always says what it is doing. -->
	<div id="status" class="war-status" role="status" aria-live="polite">
		<span class="war-spinner" aria-hidden="true"></span>
		<span id="status-text">Preparing the arena…</span>
	</div>

	<!-- The battle HUD. Hidden until the room is joined. -->
	<header id="hud" class="war-hud" hidden>
		<div class="war-side war-side-us">
			<span id="score-us" class="war-score">0</span>
			<span class="war-side-meta">
				<span id="name-us" class="war-side-name">Your community</span>
				<span id="roster-us" class="war-side-roster">0 fighting</span>
			</span>
		</div>
		<div class="war-mid">
			<span id="clock" class="war-clock">-</span>
			<span id="cap" class="war-cap"></span>
			<span class="war-coin">
				<img id="coin-img" class="war-coin-img" alt="" hidden />
				<span id="coin-label"></span>
			</span>
		</div>
		<div class="war-side war-side-them">
			<span id="score-them" class="war-score">0</span>
			<span class="war-side-meta">
				<span id="name-them" class="war-side-name">Opponent</span>
				<span id="roster-them" class="war-side-roster">0 fighting</span>
			</span>
		</div>
	</header>

	<p id="phase" class="war-phase" role="status" aria-live="polite" hidden></p>
	<p id="lobby-note" class="war-lobby-note" hidden></p>

	<!-- Controls. Hidden until joined; the stick is thumb-sized on phones. -->
	<div id="controls" class="war-controls" hidden>
		<div id="stick" class="war-stick no-orbit" aria-label="Move">
			<span id="stick-nub" class="war-stick-nub" aria-hidden="true"></span>
		</div>
		<div class="war-right">
			<dl class="war-vitals" aria-label="Your record this battle">
				<div><dt>Kills</dt><dd id="kills">0</dd></div>
				<div><dt>Downs</dt><dd id="deaths">0</dd></div>
			</dl>
			<button id="attack" class="war-attack no-orbit" type="button">Fire<small>space</small></button>
			<button id="leave" class="war-leave no-orbit" type="button">Leave</button>
		</div>
		<p id="downed" class="war-downed" role="status" hidden>You are down, respawning shortly.</p>
	</div>

	<!-- Terminal states. Both are designed cards with the one way out. -->
	<div id="result" class="war-modal" role="dialog" aria-modal="true" aria-labelledby="result-title" hidden>
		<div class="war-modal-card">
			<h1 id="result-title" class="war-result-title">Battle over</h1>
			<p id="result-score" class="war-result-score"></p>
			<p id="result-reason" class="war-modal-b"></p>
			<p id="result-mvp" class="war-modal-b war-modal-faint"></p>
			<button id="result-back" class="war-modal-btn" type="button">Back to the world</button>
		</div>
	</div>

	<div id="fail" class="war-modal" role="dialog" aria-modal="true" aria-labelledby="fail-title" hidden>
		<div class="war-modal-card">
			<h1 id="fail-title" class="war-fail-title">No battle to join</h1>
			<p id="fail-detail" class="war-modal-b"></p>
			<button id="fail-back" class="war-modal-btn" type="button">Back to the world</button>
		</div>
	</div>

	<script type="module" src="/src/play/war.js"></script>
</body>
</html>
