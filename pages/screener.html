<!doctype html>
<html lang="en" class="cv-page">
	<head>
		<script>
			/* three.ws theme boot — no-flash; runtime in /theme-switcher.js */ (function () {
				try {
					var m = localStorage.getItem('twx_theme');
					var l =
						m === 'auto'
							? window.matchMedia &&
								window.matchMedia('(prefers-color-scheme: light)').matches
							: m === 'light';
					document.documentElement.setAttribute('data-theme', l ? 'light' : 'dark');
				} catch (e) {
					document.documentElement.setAttribute('data-theme', 'dark');
				}
			})();
		</script>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title data-i18n="screener.meta_title">Token Screener · three.ws</title>
		<meta
			name="description"
			content="Filter the top 250 cryptocurrencies live: search by name, isolate gainers or losers, set minimum market cap and volume, and sort every column. Find your next coin fast."
		 data-i18n-attr="content:screener.meta_description"/>
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="three.ws" />
		<meta property="og:url" content="https://three.ws/screener" />
		<meta property="og:title" content="Token Screener · three.ws"  data-i18n-attr="content:screener.meta_og_title"/>
		<meta
			property="og:description"
			content="Filter the top 250 cryptocurrencies live: search, isolate gainers or losers, set minimum market cap and volume, and sort every column."
		 data-i18n-attr="content:screener.meta_og_description"/>
		<meta
			property="og:image"
			content="https://three.ws/api/page-og?s=crypto&amp;t=Crypto+Token+Screener&amp;d=Screen+the+top+250+cryptocurrencies+with+live+filters%3A+search+by+name+or+symbol%2C+isolate+gainers+or+losers%2C+and+set+minimum+market+cap+and+24h+volume&amp;p=%2Fscreener"
		/>
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:site" content="@trythreews" />
		<meta name="twitter:title" content="Token Screener · three.ws"  data-i18n-attr="content:screener.meta_twitter_title"/>
		<meta
			name="twitter:description"
			content="Filter the top 250 cryptocurrencies live: search, isolate gainers or losers, set minimum market cap and volume, and sort every column."
		 data-i18n-attr="content:screener.meta_twitter_description"/>
		<meta
			name="twitter:image"
			content="https://three.ws/api/page-og?s=crypto&amp;t=Crypto+Token+Screener&amp;d=Screen+the+top+250+cryptocurrencies+with+live+filters%3A+search+by+name+or+symbol%2C+isolate+gainers+or+losers%2C+and+set+minimum+market+cap+and+24h+volume&amp;p=%2Fscreener"
		/>
		<meta name="theme-color" content="#09090b" />
		<link rel="icon" href="/favicon.ico" sizes="any" />
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		<link rel="manifest" href="/manifest.webmanifest" />
		<link rel="stylesheet" href="/fonts/fonts.css" />
		<link rel="stylesheet" href="/nav.css" />
		<link rel="stylesheet" href="/src/coin-pages.css" />
		<link rel="stylesheet" href="/src/filter-controls.css" />
		<link rel="stylesheet" href="/footer.css" />
		<link rel="canonical" href="https://three.ws/screener" />
		<meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1" />
		<meta property="og:locale" content="en_US" />
		<meta property="og:image:alt" content="Token Screener on three.ws" />

		<script type="application/ld+json">
			{
				"@context": "https://schema.org",
				"@graph": [
					{
						"@type": "WebPage",
						"name": "Token Screener",
						"description": "Filter the top 250 cryptocurrencies live: search by name or symbol, isolate gainers or losers, set a minimum market cap and 24h volume, and sort every column. Every match links to a rich /coin/:id detail page with an interactive chart, market stats, and news.",
						"url": "https://three.ws/screener",
						"isPartOf": {
							"@type": "WebSite",
							"name": "three.ws",
							"url": "https://three.ws"
						},
						"primaryImageOfPage": "https://three.ws/api/page-og?s=crypto&amp;t=Token+Screener&amp;d=Filter+the+top+250+cryptocurrencies+live%3A+search+by+name%2C+isolate+gainers+or+losers%2C+set+minimum+market+cap+and+volume%2C+and+sort+every+column.+Find+your+next+coin+fast&amp;p=%2Fscreener"
					}
				]
			}
		</script>
	</head>
	<body>
		<header><div id="nav-container"></div></header>
		<script src="/nav.js"></script>

		<main class="cv-container">
			<nav class="cv-crumbs" aria-label="Breadcrumb">
				<a href="/markets" data-i18n="screener.markets">Markets</a><span class="sep">/</span
				><span class="here" data-i18n="screener.screener">Screener</span>
			</nav>
			<h1 class="cv-h1" data-i18n="screener.token_screener">Token Screener</h1>
			<p class="cv-sub" data-i18n="screener.filter_the_top_250_coins_by_market">
				Filter the top 250 coins by market cap in real time. Search by name, isolate
				gainers or losers, set floors on market cap and volume, then sort any column. Every
				row opens the full coin profile.
			</p>

			<!-- Filter controls. Wired by src/screener.js. -->
			<div class="scr-controls">
				<div class="cv-search" id="scr-search" style="max-width: 20rem">
					<span class="mag" aria-hidden="true">
						<svg
							viewBox="0 0 24 24"
							fill="none"
							stroke="currentColor"
							stroke-width="2"
							stroke-linecap="round"
							stroke-linejoin="round"
						>
							<circle cx="11" cy="11" r="8" />
							<path d="m21 21-4.3-4.3" />
						</svg>
					</span>
					<input
						id="scr-search-input"
						type="search"
						placeholder="Filter by name or symbol…"
						autocomplete="off"
						spellcheck="false"
						aria-label="Filter coins by name or symbol"
						data-i18n-attr="placeholder:screener.search_placeholder;aria-label:screener.search_arialabel"
					/>
				</div>

				<div
					class="hm-seg"
					role="group"
					aria-label="Direction filter"
					id="scr-dir"
					data-i18n-attr="aria-label:screener.direction_arialabel"
				>
					<button type="button" data-dir="all" aria-pressed="true" data-i18n="screener.all">All</button>
					<button type="button" data-dir="gainers" aria-pressed="false" data-i18n="screener.gainers">Gainers</button>
					<button type="button" data-dir="losers" aria-pressed="false" data-i18n="screener.losers">Losers</button>
				</div>

				<label class="scr-field">
					<span data-i18n="screener.min_market_cap">Min market cap</span>
					<select
						id="scr-mcap"
						aria-label="Minimum market cap"
						data-i18n-attr="aria-label:screener.min_market_cap_arialabel"
					>
						<option value="0" data-i18n="screener.any">Any</option>
						<option value="10000000" data-i18n="screener.10m">$10M+</option>
						<option value="100000000" data-i18n="screener.100m">$100M+</option>
						<option value="1000000000" data-i18n="screener.1b">$1B+</option>
						<option value="10000000000" data-i18n="screener.10b">$10B+</option>
						<option value="100000000000" data-i18n="screener.100b">$100B+</option>
					</select>
				</label>

				<label class="scr-field">
					<span data-i18n="screener.min_24h_volume">Min 24h volume</span>
					<select
						id="scr-vol"
						aria-label="Minimum 24h volume"
						data-i18n-attr="aria-label:screener.min_volume_arialabel"
					>
						<option value="0" data-i18n="screener.any_2">Any</option>
						<option value="1000000" data-i18n="screener.1m">$1M+</option>
						<option value="10000000" data-i18n="screener.10m_2">$10M+</option>
						<option value="100000000" data-i18n="screener.100m_2">$100M+</option>
						<option value="1000000000" data-i18n="screener.1b_2">$1B+</option>
					</select>
				</label>

				<button type="button" class="scr-reset" id="scr-reset" data-i18n="screener.reset">Reset</button>
			</div>

			<div class="scr-meta">
				<span id="scr-count" class="scr-count" aria-live="polite"></span>
				<div class="cv-pills">
					<a class="cv-pill" href="/coins" data-i18n="screener.all_coins">All Coins</a>
					<a class="cv-pill" href="/categories" data-i18n="screener.categories">Categories</a>
					<a class="cv-pill" href="/heatmap" data-i18n="screener.heatmap">Heatmap</a>
				</div>
			</div>

			<!-- Results table. Hydrated by src/screener.js. -->
			<section id="scr-table" aria-label="Screened cryptocurrencies"></section>
			<p class="cv-updated" id="scr-updated" role="status"></p>
		</main>

		<script type="module" src="/src/screener.js"></script>
		<script src="/brand.js" defer></script>
		<div id="footer-container"></div>
		<script src="/footer.js"></script>
		<!-- Runtime i18n: detects locale, swaps annotated copy, mounts <lang-switcher>. -->
	<script type="module" src="/i18n.js"></script>
</body>
</html>
