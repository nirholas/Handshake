<!doctype html>
<html lang="en">
	<head>
		<style>/* three.ws hidden-guard — make the `hidden` attribute authoritative; see scripts/lib/hidden-guard.mjs */[hidden]{display:none!important}</style>
		<meta charset="utf-8" />
		<link rel="icon" href="/favicon.ico" sizes="any" />
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
		<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
		<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		<link rel="manifest" href="/manifest.webmanifest" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title data-i18n="embed.meta_title">Embed editor — three.ws</title>
		<meta name="description" content="Embed a live 3D avatar on any website — static, idle, walking, or chat. Configure, preview, and copy the snippet."  data-i18n-attr="content:embed.meta_description"/>
	<meta property="og:type" content="website" />
	<meta property="og:site_name" content="three.ws" />
	<meta property="og:url" content="https://three.ws/embed" />
	<meta property="og:title" content="Embed editor — three.ws"  data-i18n-attr="content:embed.meta_og_title"/>
	<meta property="og:description" content="Embed a live 3D avatar on any website — static, idle, walking, or chat. Configure, preview, and copy the snippet."  data-i18n-attr="content:embed.meta_og_description"/>
	<meta property="og:image" content="https://three.ws/og-image.png" />
	<meta property="og:image:width" content="1200" />
	<meta property="og:image:height" content="630" />
	<meta name="twitter:card" content="summary_large_image" />
	<meta name="twitter:site" content="@trythreews" />
	<meta name="twitter:title" content="Embed editor — three.ws"  data-i18n-attr="content:embed.meta_twitter_title"/>
	<meta name="twitter:description" content="Embed a live 3D avatar on any website — static, idle, walking, or chat. Configure, preview, and copy the snippet."  data-i18n-attr="content:embed.meta_twitter_description"/>
	<meta name="twitter:image" content="https://three.ws/og-image.png" />
		<style>
			html,
			body {
				margin: 0;
				padding: 0;
				height: 100%;
				background: #0d0d0d;
				color: #fff;
				font-family: system-ui, sans-serif;
			}
			#root {
				min-height: 100vh;
			}
		</style>
	</head>
	<body>
		<div id="root"></div>
		<script type="module">
			import { mountEmbedEditor } from '/src/editor/embed-editor.js';
			const q = new URL(location.href).searchParams;
			mountEmbedEditor(document.getElementById('root'), {
				mode: q.get('mode') || '',
				avatar: q.get('avatar') || q.get('id') || '',
				controls: q.get('controls') || '',
				env: q.get('env') || '',
				bg: q.get('bg') || '',
				width: q.get('width') || '',
				height: q.get('height') || '',
				autoplay: q.get('autoplay'),
				speed: q.get('speed'),
				ground: q.get('ground'),
				gestures: q.get('gestures'),
				badge: q.get('badge'),
			});
		</script>
		<!-- Runtime i18n: detects locale, swaps annotated copy, mounts <lang-switcher>. -->
	<script type="module" src="/i18n.js"></script>
</body>
</html>
