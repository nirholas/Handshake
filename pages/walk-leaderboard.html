		<script type="module">
			const rowsEl = document.getElementById('wlb-rows');
			const tableEl = document.getElementById('wlb-table');
			const statusEl = document.getElementById('wlb-status');
			const announceEl = document.getElementById('wlb-announce');
			const metaEl = document.getElementById('wlb-meta');
			const metricLabelEl = document.getElementById('wlb-metric-label');
			const loadMoreEl = document.getElementById('wlb-loadmore');
			const meWrap = document.getElementById('wlb-me-wrap');
			const meRow = document.getElementById('wlb-me-row');
			const periodSeg = document.getElementById('wlb-period');
			const metricSeg = document.getElementById('wlb-metric');

			const METRIC_HEAD = { distance: 'Distance', sites: 'Sites', time: 'Time' };
			const PERIOD_LABEL = { daily: 'today', weekly: 'this week', 'all-time': 'all time' };
			const PAGE = 50;
			// Board refresh cadence. The endpoint caches for 15s at the edge, so a
			// 45s silent poll keeps the "updates live" promise without hammering it.
			const REFRESH_MS = 45_000;
			let state = { period: 'weekly', metric: 'distance', offset: 0, total: 0 };
			// Only the newest request may paint. Every load aborts the one before it,
			// so fast filter switching can never leave the board on stale rows, a
			// mismatched column header, or a skeleton that never resolves.
			let inflight = null;
			let generation = 0;

			const esc = (s) => String(s).replace(/[<>&"']/g, (c) => ({ '<': '&lt;', '>': '&gt;', '&': '&amp;', '"': '&quot;', "'": '&#39;' }[c]));

			// Stable anon id mirrors src/walk.js so an anonymous walker sees their own
			// pinned rank here too.
			function anonId() {
				try {
					let id = localStorage.getItem('twx_walk_anon');
					return id || null;
				} catch { return null; }
			}

			function fmtValue(metric, v) {
				if (metric === 'distance') {
					return v >= 1000 ? (v / 1000).toFixed(2) + ' km' : Math.round(v) + ' m';
				}
				if (metric === 'time') {
					const s = Math.round(v);
					if (s >= 3600) return (s / 3600).toFixed(1) + ' h';
					if (s >= 60) return Math.round(s / 60) + ' min';
					return s + ' s';
				}
				return String(Math.round(v)); // sites
			}

			function fmtDelta(metric, d) {
				if (!d) return '<span class="wlb-delta flat"><span aria-hidden="true">-</span><span class="wlb-sr">no change since yesterday</span></span>';
				const cls = d > 0 ? 'up' : 'down';
				const sign = d > 0 ? '+' : '-';
				const word = d > 0 ? 'up' : 'down';
				const abs = Math.abs(d);
				let body;
				if (metric === 'distance') body = abs >= 1000 ? (abs / 1000).toFixed(1) + ' km' : Math.round(abs) + ' m';
				else if (metric === 'time') body = abs >= 60 ? Math.round(abs / 60) + ' min' : Math.round(abs) + ' s';
				else body = String(Math.round(abs));
				return `<span class="wlb-delta ${cls}"><span aria-hidden="true">${sign}${body}</span><span class="wlb-sr">${word} ${body} since yesterday</span></span>`;
			}

			// Top three read as a medal but must still announce their place, so the
			// glyph is decorative and the rank rides along as screen-reader text.
			function rankCell(rank) {
				const cls = rank && rank <= 3 ? 'wlb-rank is-top' : 'wlb-rank';
				if (rank == null) {
					return `<span class="${cls}" role="cell"><span aria-hidden="true">-</span><span class="wlb-sr">not ranked yet</span></span>`;
				}
				const glyph = rank === 1 ? '🥇' : rank === 2 ? '🥈' : rank === 3 ? '🥉' : '';
				const visible = glyph ? `<span class="wlb-medal" aria-hidden="true">${glyph}</span>` : `<span aria-hidden="true">#${rank}</span>`;
				return `<span class="${cls}" role="cell">${visible}<span class="wlb-sr">rank ${rank}</span></span>`;
			}

			function avatarCell(r) {
				if (r.avatar) return `<img class="wlb-avatar" src="${esc(r.avatar)}" alt="" loading="lazy" />`;
				const ch = esc((r.handle || '?').replace(/^@/, '')[0] || '?').toUpperCase();
				return `<span class="wlb-avatar wlb-avatar-fallback" aria-hidden="true">${ch}</span>`;
			}

			function rowHtml(r, metric, isMe) {
				const handle = r.profileUrl
					? `<a class="wlb-handle" href="${esc(r.profileUrl)}">${esc(r.handle)}</a>`
					: `<span class="wlb-handle">${esc(r.handle)}</span>`;
				const you = isMe ? '<span class="wlb-you">(you)</span>' : '';
				return `
					<div class="wlb-row" role="row">
						${rankCell(r.rank)}
						<span class="wlb-walker" role="cell">${avatarCell(r)} ${handle}${you}</span>
						<span class="wlb-value" role="cell">${fmtValue(metric, r.value)}</span>
						<span class="wlb-col-delta" role="cell">${fmtDelta(metric, r.deltaFromYesterday)}</span>
					</div>`;
			}

			function skeleton() {
				let h = '';
				for (let i = 0; i < 8; i++) {
					h += `<div class="wlb-skel-row" role="presentation"><span class="wlb-skel" style="width:24px"></span><span style="display:flex;align-items:center;gap:10px"><span class="wlb-skel circle"></span><span class="wlb-skel" style="width:120px"></span></span><span class="wlb-skel" style="width:70px;justify-self:end"></span><span class="wlb-skel wlb-col-delta" style="width:50px;justify-self:end"></span></div>`;
				}
				rowsEl.innerHTML = h;
				statusEl.hidden = true;
				tableEl.hidden = false;
			}

			// Empty and error take over the whole card: an all-headers, no-rows table
			// is noise, and the state carries the next action instead.
			function showState(title, msg, actions = []) {
				tableEl.hidden = true;
				statusEl.hidden = false;
				statusEl.replaceChildren();
				const wrap = document.createElement('div');
				wrap.className = 'wlb-state';
				const h = document.createElement('p');
				h.className = 'wlb-state-title';
				h.textContent = title;
				const p = document.createElement('p');
				p.className = 'wlb-state-msg';
				p.textContent = msg;
				wrap.append(h, p);
				const row = document.createElement('div');
				row.className = 'wlb-state-actions';
				for (const action of actions) {
					if (!action) continue;
					const el = document.createElement(action.href ? 'a' : 'button');
					el.className = action.ghost ? 'wlb-cta is-ghost' : 'wlb-cta';
					el.textContent = action.label;
					if (action.href) el.href = action.href;
					else {
						el.type = 'button';
						el.addEventListener('click', action.onClick);
					}
					row.appendChild(el);
				}
				if (row.children.length) wrap.appendChild(row);
				statusEl.appendChild(wrap);
			}

			// The three metrics are earned in different places, so the empty board
			// tells the reader how to earn THIS one rather than a generic nudge. Sites
			// only accrue where the avatar walks on another page, never on three.ws.
			const EMPTY_COPY = {
				distance: {
					title: 'No walkers ranked yet',
					msg: 'Be the first on the board. Take your avatar for a walk and every metre it covers lands here.',
					cta: { href: '/walk', label: 'Start walking' },
				},
				time: {
					title: 'No walking time logged yet',
					msg: 'Be the first on the board. Time counts from the moment your avatar starts moving.',
					cta: { href: '/walk', label: 'Start walking' },
				},
				sites: {
					title: 'No sites walked yet',
					msg: 'Sites count the pages your avatar walks on away from three.ws. Drop the walk companion onto a site and each host it visits shows up here.',
					cta: { href: '/tutorials/walk-companion', label: 'Add the walk companion' },
				},
			};

			function renderMe(me, metric) {
				if (!me) { meWrap.hidden = true; return; }
				meWrap.hidden = false;
				meRow.innerHTML = rowHtml(me, metric, true);
			}

			function renderMeta(total, metric, period, stamp) {
				const walkers = total === 1 ? '1 walker ranked' : `${total.toLocaleString()} walkers ranked`;
				const when = stamp.toLocaleTimeString([], { timeStyle: 'short' });
				const dot = '<span aria-hidden="true">&middot;</span>';
				metaEl.innerHTML =
					`<span class="wlb-meta-count">${esc(walkers)}</span>${dot}` +
					`<span>by ${esc(METRIC_HEAD[metric] || metric)}, ${esc(PERIOD_LABEL[period] || period)}</span>${dot}` +
					`<span>updated ${esc(when)}</span>`;
			}

			async function load({ reset = true, silent = false } = {}) {
				const gen = ++generation;
				if (inflight) inflight.abort();
				const ctrl = new AbortController();
				inflight = ctrl;
				if (reset && !silent) {
					state.offset = 0;
					skeleton();
					meWrap.hidden = true;
					loadMoreEl.hidden = true;
					// Header follows the click immediately so it never labels the
					// column with the metric the previous request was fetching.
					metricLabelEl.textContent = METRIC_HEAD[state.metric] || 'Value';
				} else if (reset) {
					state.offset = 0;
				}
				tableEl.setAttribute('aria-busy', 'true');
				loadMoreEl.disabled = true;
				// Swap the label rather than hardcode it back, so a translated button
				// keeps its locale copy once the paging request settles.
				if (!reset && !loadMoreEl.dataset.label) {
					loadMoreEl.dataset.label = loadMoreEl.textContent;
					loadMoreEl.textContent = 'Loading';
				}
				const params = new URLSearchParams({ period: state.period, metric: state.metric, limit: String(PAGE), offset: String(state.offset) });
				const aid = anonId();
				if (aid) params.set('anonId', aid);
				try {
					const res = await fetch('/api/walk/leaderboard?' + params.toString(), { credentials: 'include', signal: ctrl.signal });
					if (!res.ok) throw new Error('HTTP ' + res.status);
					const data = await res.json();
					if (gen !== generation) return;
					state.total = data.total || 0;
					const metric = data.metric || state.metric;
					metricLabelEl.textContent = METRIC_HEAD[metric] || 'Value';
					renderMeta(state.total, metric, data.period || state.period, new Date());

					if (reset && (!data.rows || !data.rows.length)) {
						rowsEl.replaceChildren();
						loadMoreEl.hidden = true;
						const copy = EMPTY_COPY[metric] || EMPTY_COPY.distance;
						const period = data.period || state.period;
						const actions = [copy.cta];
						// A window with no walkers is often just a quiet day, so offer the
						// widest window rather than leaving the reader at a dead end.
						if (period !== 'all-time') {
							actions.push({ label: 'View all time', ghost: true, onClick: () => setPeriod('all-time') });
						}
						showState(copy.title, copy.msg, actions);
						renderMe(data.me && data.me.value > 0 ? data.me : null, metric);
						announceEl.textContent = `${copy.title}. ${copy.msg}`;
						return;
					}

					const html = (data.rows || []).map((r) => rowHtml(r, metric, data.me && r.key === data.me.key)).join('');
					if (reset) {
						rowsEl.innerHTML = html;
						statusEl.hidden = true;
						tableEl.hidden = false;
						state.offset = (data.rows || []).length;
					} else {
						rowsEl.insertAdjacentHTML('beforeend', html);
						state.offset += (data.rows || []).length;
					}

					loadMoreEl.hidden = !data.hasMore;
					renderMe(data.me, metric);
					announceEl.textContent = `Showing ${state.offset} of ${state.total} walkers, ranked by ${METRIC_HEAD[metric] || metric}, ${PERIOD_LABEL[data.period || state.period] || ''}.`;
				} catch (err) {
					if (err && err.name === 'AbortError') return;
					if (gen !== generation) return;
					// A silent refresh that fails leaves the last good board alone; only
					// a user-driven load swaps in the recovery state.
					if (reset && !silent) {
						rowsEl.replaceChildren();
						loadMoreEl.hidden = true;
						showState(
							"Couldn't load the leaderboard",
							`${(err && err.message) || 'Something went wrong.'} The board is public, so a retry usually clears it.`,
							[{ label: 'Retry', onClick: () => load({ reset: true }) }],
						);
						announceEl.textContent = 'The leaderboard failed to load. Use the retry button to try again.';
					}
				} finally {
					if (gen === generation) {
						inflight = null;
						tableEl.setAttribute('aria-busy', 'false');
						loadMoreEl.disabled = false;
						if (loadMoreEl.dataset.label) {
							loadMoreEl.textContent = loadMoreEl.dataset.label;
							delete loadMoreEl.dataset.label;
						}
					}
				}
			}

			function bindSeg(seg, key, onChange) {
				const select = (btn) => {
					if (!btn) return;
					seg.querySelectorAll('.wlb-seg-btn').forEach((b) => {
						const on = b === btn;
						b.classList.toggle('is-active', on);
						b.setAttribute('aria-checked', String(on));
						// Roving tabindex: one stop per group, arrows move within it.
						b.tabIndex = on ? 0 : -1;
					});
					if (state[key] === btn.dataset[key]) return;
					state[key] = btn.dataset[key];
					onChange();
				};
				seg.addEventListener('click', (e) => select(e.target.closest('.wlb-seg-btn')));
				// Returned so other surfaces (the empty state's "view all time") can
				// drive the control instead of faking a click.
				const selectByValue = (value) => select(seg.querySelector(`[data-${key}="${value}"]`));
				seg.addEventListener('keydown', (e) => {
					const btns = [...seg.querySelectorAll('.wlb-seg-btn')];
					const i = btns.findIndex((b) => b.classList.contains('is-active'));
					let next = null;
					if (e.key === 'ArrowRight' || e.key === 'ArrowDown') next = btns[(i + 1) % btns.length];
					else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') next = btns[(i + btns.length - 1) % btns.length];
					else if (e.key === 'Home') next = btns[0];
					else if (e.key === 'End') next = btns[btns.length - 1];
					if (!next) return;
					e.preventDefault();
					next.focus();
					select(next);
				});
				return selectByValue;
			}

			const setPeriod = bindSeg(periodSeg, 'period', () => load({ reset: true }));
			bindSeg(metricSeg, 'metric', () => load({ reset: true }));
			loadMoreEl.addEventListener('click', () => load({ reset: false }));

			// "Updates live" is a promise, so the board keeps itself current: a quiet
			// re-fetch of the first page while the tab is visible and the reader has
			// not paged deeper, plus one on the way back from a hidden tab.
			let lastRefresh = Date.now();
			function refresh() {
				if (document.visibilityState !== 'visible') return;
				if (state.offset > PAGE || inflight) return;
				lastRefresh = Date.now();
				load({ reset: true, silent: true });
			}
			setInterval(refresh, REFRESH_MS);
			document.addEventListener('visibilitychange', () => {
				if (document.visibilityState === 'visible' && Date.now() - lastRefresh >= REFRESH_MS) refresh();
			});

			load({ reset: true });
		</script>
		<!-- Runtime i18n: detects locale, swaps annotated copy, mounts <lang-switcher>. -->
	<script type="module" src="/i18n.js"></script>
</body>
</html>
