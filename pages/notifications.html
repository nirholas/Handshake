<html lang="en">

		<script>/* three.ws theme boot */(function(){try{var m=localStorage.getItem('twx_theme');var l=m==='auto'?(window.matchMedia&&window.matchMedia('(prefers-color-scheme: light)').matches):m==='light';document.documentElement.setAttribute('data-theme',l?'light':'dark');}catch(e){document.documentElement.setAttribute('data-theme','dark');}})();</script>
		<meta charset="utf-8" />

		<style>
			:root {
				--bg: #0d0d0d;
				--bg-2: #141414;
				--card: #181818;
				--line: rgba(255,255,255,0.07);
				--line-2: rgba(255,255,255,0.12);
				--text: #e7e9ee;
				--muted: rgba(231,233,238,0.55);
				--dim: rgba(231,233,238,0.35);
				--blue: #3b82f6;
				--radius: 12px;
				--skeleton-base: rgba(255,255,255,0.04);
				--skeleton-sheen: rgba(255,255,255,0.08);
			}
			[data-theme="light"] {
				--bg: #f5f5f5;
				--bg-2: #ffffff;
				--card: #ffffff;
				--line: rgba(0,0,0,0.07);
				--line-2: rgba(0,0,0,0.12);
				--text: #111;
				--muted: rgba(0,0,0,0.55);
				--dim: rgba(0,0,0,0.35);
				--skeleton-base: rgba(0,0,0,0.04);
				--skeleton-sheen: rgba(0,0,0,0.08);
			}
			*{box-sizing:border-box;margin:0;padding:0;}
			html,body{background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;min-height:100vh;}
			a{color:inherit;text-decoration:none;}
			.page-shell{max-width:720px;margin:0 auto;padding:0 20px 100px;}
			.page-hero{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;padding:48px 0 24px;flex-wrap:wrap;}
			.page-hero h1{font-size:28px;font-weight:700;letter-spacing:-0.02em;}
			.page-hero p{color:var(--muted);margin-top:8px;font-size:14px;}
			.page-actions{display:flex;align-items:center;gap:8px;}
			.n-btn{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:500;padding:8px 14px;border-radius:8px;background:var(--card);color:var(--text);border:1px solid var(--line-2);cursor:pointer;transition:border-color .15s,background .15s;font-family:inherit;text-decoration:none;}
			.n-btn:hover{border-color:rgba(255,255,255,0.3);}
			[data-theme="light"] .n-btn:hover{border-color:rgba(0,0,0,0.3);}
			.n-btn:disabled{opacity:.45;cursor:default;}
			.n-btn:focus-visible{outline:2px solid var(--blue);outline-offset:1px;}
			/* Filter tabs */
			.n-tabs{display:flex;gap:4px;border-bottom:1px solid var(--line-2);margin-bottom:8px;overflow-x:auto;}
			.n-tab{padding:10px 16px;font-size:13px;font-weight:500;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;transition:color .15s,border-color .15s;background:none;border-top:none;border-left:none;border-right:none;white-space:nowrap;font-family:inherit;}
			.n-tab:hover{color:var(--text);}
			.n-tab.active{color:var(--text);border-bottom-color:var(--blue);}
			/* List */
			.n-list{display:flex;flex-direction:column;}
			.n-row{display:flex;align-items:flex-start;gap:14px;padding:16px 4px;border-bottom:1px solid var(--line);cursor:pointer;transition:background .12s;border-radius:8px;}
			.n-row:hover{background:var(--bg-2);}
			.n-row:focus-visible{outline:2px solid var(--blue);outline-offset:-2px;}
			.n-row.is-unread{background:rgba(59,130,246,0.05);}
			.n-row.is-unread:hover{background:rgba(59,130,246,0.09);}
			.n-icon{font-size:20px;line-height:1;margin-top:2px;flex-shrink:0;width:24px;text-align:center;}
			.n-body{flex:1;min-width:0;}
			.n-msg{font-size:14px;color:var(--text);line-height:1.5;word-break:break-word;}
			.n-row.is-unread .n-msg{font-weight:600;}
			.n-time{font-size:12px;color:var(--dim);margin-top:3px;}
			.n-dot{width:8px;height:8px;border-radius:50%;background:var(--blue);flex-shrink:0;margin-top:6px;}
			.n-del{background:none;border:0;color:var(--dim);cursor:pointer;font-size:16px;padding:4px 6px;border-radius:6px;flex-shrink:0;opacity:0;transition:opacity .12s,color .12s,background .12s;}
			.n-row:hover .n-del{opacity:1;}
			.n-del:hover{color:#ef4444;background:rgba(239,68,68,0.1);}
			.n-del:focus-visible{opacity:1;outline:2px solid var(--blue);}
			/* Empty / loading / error */
			.n-empty{text-align:center;padding:100px 20px;color:var(--muted);}
			.n-empty-icon{font-size:36px;margin-bottom:14px;}
			.n-empty h3{font-size:18px;font-weight:600;color:var(--text);margin-bottom:8px;}
			.n-empty p{font-size:14px;line-height:1.5;max-width:360px;margin:0 auto;}
			.n-auth-wall{text-align:center;padding:120px 20px;}
			.n-auth-wall h2{font-size:22px;font-weight:700;margin-bottom:12px;}
			.n-auth-wall p{color:var(--muted);font-size:14px;margin-bottom:24px;}
			.n-error{background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.25);border-radius:10px;padding:16px 20px;color:#ef4444;font-size:13px;margin-bottom:20px;}
			.skeleton{background:var(--skeleton-base);background-image:linear-gradient(90deg,var(--skeleton-base) 0%,var(--skeleton-sheen) 50%,var(--skeleton-base) 100%);background-size:200% 100%;border-radius:6px;animation:shimmer 1.4s ease-in-out infinite;}
			@keyframes shimmer{0%{background-position:200% 0;}100%{background-position:-200% 0;}}
			.n-skel-row{display:flex;gap:14px;padding:16px 4px;}
			.n-skel-row .skeleton:first-child{width:24px;height:24px;border-radius:50%;}
			.n-skel-body{flex:1;display:flex;flex-direction:column;gap:8px;}
			.n-load-more{display:flex;justify-content:center;padding:24px 0;}
			@media(max-width:480px){
				.page-hero{padding:32px 0 20px;}
				.page-hero h1{font-size:24px;}
			}
		</style>

		<main class="page-shell">

					<h1 data-i18n="notifications.notifications">Notifications</h1>

			<div id="n-error" class="n-error" hidden></div>

			<div id="n-main" hidden>

					<button class="n-tab" role="tab" aria-selected="false" data-type="companion" data-i18n="notifications.companion">Companion</button>
					<button class="n-tab" role="tab" aria-selected="false" data-type="account" data-i18n="notifications.account">Account</button>
