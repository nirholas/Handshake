		<style>/* three.ws hidden-guard — make the `hidden` attribute authoritative; see scripts/lib/hidden-guard.mjs */[hidden]{display:none!important}</style>
		<script>/* three.ws theme boot — no-flash; runtime in /theme-switcher.js */(function(){try{var m=localStorage.getItem('twx_theme');var l=m==='auto'?(window.matchMedia&&window.matchMedia('(prefers-color-scheme: light)').matches):m==='light';document.documentElement.setAttribute('data-theme',l?'light':'dark');}catch(e){document.documentElement.setAttribute('data-theme','dark');}})();</script>
		<meta charset="utf-8" />
		<script>
			// Skills now live inside the marketplace. Forward any old /skills links
			// (and their query) to the marketplace Skills tab, preserving the
			// filters the Skills tab actually reads back off the URL. This runs
			// first in the head on purpose: every tag below it is a request the
			// browser would start and then cancel a moment later.
			(function () {
				var src = new URLSearchParams(location.search);
				var out = new URLSearchParams();
				out.set('tab', 'skills');
				['q', 'category', 'tag', 'sort'].forEach(function (key) {
					var v = src.get(key);
					if (v) out.set(key, v);
				});
				location.replace('/marketplace?' + out.toString());
			})();
		</script>

		<!-- The forward at the top of this head needs JS. Without it (crawlers, JS off, a script
		     error) the visitor would otherwise land on an empty document, so
		     send them on with a refresh and leave a real link behind it. -->
		<noscript><meta http-equiv="refresh" content="0;url=/marketplace?tab=skills" /></noscript>

			.skills-forward a {

				color: #0b0b0f;
				font-weight: 600;
				text-decoration: none;
				transition: transform 0.15s ease, opacity 0.15s ease;
			}
			.skills-forward a:hover {
				opacity: 0.88;
			}
			.skills-forward a:active {
				transform: translateY(1px);
			}
			.skills-forward a:focus-visible {
				outline: 2px solid #7c9cff;
				outline-offset: 3px;
			}
			@media (prefers-color-scheme: light) {
				.skills-forward {

					color: #18181b;
				}
				.skills-forward p {
					color: #52525b;
				}
