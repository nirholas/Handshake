<!doctype html>
<html lang="en">
	<head>
		<script>/* three.ws theme boot, no-flash; runtime in /theme-switcher.js */(function(){try{var m=localStorage.getItem('twx_theme');var l=m==='auto'?(window.matchMedia&&window.matchMedia('(prefers-color-scheme: light)').matches):m==='light';document.documentElement.setAttribute('data-theme',l?'light':'dark');}catch(e){document.documentElement.setAttribute('data-theme','dark');}})();</script>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>3D Model · three.ws</title>

			name="description"
			content="A forged 3D model on three.ws: interactive viewer, real geometry stats, creator profile, likes, comments, remixing, and AR."
		/>

		<meta property="og:site_name" content="three.ws" />
		<meta property="og:url" content="https://three.ws/creations" />

			property="og:description"
			content="A forged 3D model on three.ws: interactive viewer, real geometry stats, creator profile, likes, comments, remixing, and AR."

			name="twitter:description"
			content="A forged 3D model on three.ws: interactive viewer, real geometry stats, creator profile, likes, comments, remixing, and AR."

		<link rel="icon" href="/favicon.ico" sizes="any" />
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />

	</head>
	<body>
		<header><div id="nav-container"></div></header>
		<script src="/nav.js"></script>

		<main id="mp-shell" class="mp-shell" aria-busy="true">
			<a class="mp-back" href="/creations">← All creations</a>

			<!-- Viewer hero. Hydrated by src/model-page.js. -->
			<section id="mp-viewer" class="mp-viewer" aria-label="3D model viewer">
				<div class="mp-viewer-skeleton">Loading model…</div>
			</section>

			<div class="mp-columns">
				<div class="mp-main">
					<!-- Title, creator, actions, stats, description. -->
					<section id="mp-info" aria-label="Model information"></section>

					<!-- Comment thread. -->
					<section id="mp-comments" class="mp-comments" aria-label="Comments"></section>
				</div>

				<aside class="mp-side" aria-label="Suggested models">
					<h2>Suggested models</h2>
					<div id="mp-suggested" class="mp-suggested"></div>
					<a class="mp-side-more" href="/creations">Browse all creations →</a>
				</aside>
			</div>
		</main>

		<div id="mp-toast" class="mp-toast" role="status" aria-live="polite"></div>

		<!-- The <sim-readiness> element, shared verbatim with /viewer. A public
		     module is referenced by <script src>, never imported from src/. -->
		<script type="module" src="/sim-readiness-panel.js"></script>
		<script type="module" src="/src/model-page.js"></script>
		<script src="/brand.js" defer></script>
		<div id="footer-container"></div>
		<script src="/footer.js"></script>
		<script type="module" src="/i18n.js"></script>
	</body>
