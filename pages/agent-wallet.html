		<style>
			.awh-wrap {
				max-width: 820px;
				margin: 0 auto;
				padding: calc(var(--space-md) * 2) var(--space-md) calc(var(--space-md) * 4);
				/* style.css makes <body> a flex column, so this <main> is a flex item
				   and was sized from its content instead of the viewport: the tab
				   strip's 1554px of tabs stretched it to 792px on a 320px screen.
				   <html> does not scroll horizontally, so that overflow was silently
				   clipped and the Refresh button plus the right edge of every card
				   were unreachable on a phone. An explicit 100% resolves against the
				   body's content box, pinning the column to the viewport; the tab
				   strip keeps scrolling on its own overflow-x. */
				width: 100%;
			}
			.awh-crumb {
				font: var(--text-sm) var(--font-body);
				color: var(--ink-dim);
				margin: 0 0 var(--space-lg);
			}
			.awh-crumb a {
				color: inherit;
			}
			.awh-crumb a:hover {
				color: var(--ink);
			}

			/* Page-level loading / message states (the hub itself styles its tabs). */
			.awh-page-skel {
				display: flex;
				flex-direction: column;
				gap: var(--space-4, 16px);
				max-width: 760px;
				margin: 0 auto;
			}
			.awh-page-skel-row,
			.awh-page-skel-tabs,
			.awh-page-skel-card {
				background: var(--surface-2, rgba(255, 255, 255, 0.05));
				border-radius: var(--radius-lg, 14px);
				animation: awh-page-pulse 1.4s ease-in-out infinite;
			}
			.awh-page-skel-row {
				height: 52px;
				width: 70%;
			}
			.awh-page-skel-tabs {
				height: 38px;
				width: 100%;
				border-radius: var(--radius-md, 10px);
			}
			.awh-page-skel-card {
				height: 200px;
				width: 100%;
			}
			@keyframes awh-page-pulse {
				0%,
				100% {
					opacity: 0.5;
				}
				50% {
					opacity: 1;
				}
			}

			.awh-page-msg {
				max-width: 540px;
				margin: calc(var(--space-md) * 3) auto;
				text-align: center;
				border: 1px solid var(--stroke);
				border-radius: var(--radius-lg);
				background: var(--surface-1);
				padding: var(--space-xl) var(--space-lg);
			}
			.awh-page-msg h1 {
				font-family: var(--font-display);
				font-size: var(--text-lg);
				margin: 0 0 var(--space-sm);
				color: var(--ink-bright);
			}
			.awh-page-msg p {
				color: var(--ink-dim);
				font: var(--text-md) var(--font-body);
				line-height: var(--leading-normal);
				margin: 0 0 var(--space-lg);
			}
			.awh-page-msg-actions {
				display: flex;
				gap: var(--space-sm);
				justify-content: center;
				flex-wrap: wrap;
			}
			.awh-page-btn {
				appearance: none;
				font: var(--text-md) var(--font-body);
				color: var(--ink);
				background: var(--surface-2);
				border: 1px solid var(--stroke);
				border-radius: var(--radius-md);
				padding: 9px 16px;
				cursor: pointer;
				text-decoration: none;
				transition:
					background var(--duration-fast) var(--ease-standard),
					border-color var(--duration-fast) var(--ease-standard);
			}
			.awh-page-btn:hover {
				background: var(--surface-3);
				border-color: var(--stroke-strong);
			}
			.awh-page-btn:focus-visible {
				outline: var(--focus-ring-width) solid var(--focus-ring-color);
				outline-offset: var(--focus-ring-offset);
			}
			.awh-page-btn--primary {
				background: var(--accent);
				color: var(--bg-0);
				border-color: var(--accent);
				font-weight: 600;
			}
			@media (prefers-reduced-motion: reduce) {
				.awh-page-skel-row,
				.awh-page-skel-tabs,
				.awh-page-skel-card {
					animation: none;
				}
			}

			/* Agent picker: shown when the signed-in owner has more than one agent. */
			.awh-pick {
				max-width: 640px;
				margin: 0 auto;
			}
			.awh-pick-h {
				font-family: var(--font-display);
				font-size: var(--text-xl);
				color: var(--ink-bright);
				margin: 0 0 var(--space-xs);
				line-height: var(--leading-tight, 1.15);
			}
			.awh-pick-lede {
				color: var(--ink-dim);
				font: var(--text-md) var(--font-body);
				line-height: var(--leading-normal);
				margin: 0 0 var(--space-lg);
			}
			.awh-pick-list {
				list-style: none;
				margin: 0 0 var(--space-lg);
				padding: 0;
				display: flex;
				flex-direction: column;
				gap: var(--space-sm);
			}
			.awh-pick-row {
				display: flex;
				align-items: center;
				gap: var(--space-sm);
				padding: 12px 14px;
				border: 1px solid var(--stroke);
				border-radius: var(--radius-lg);
				background: var(--surface-1);
				text-decoration: none;
				color: inherit;
				transition:
					background var(--duration-fast) var(--ease-standard),
					border-color var(--duration-fast) var(--ease-standard),
					transform var(--duration-instant, 80ms) var(--ease-standard);
			}
			.awh-pick-row:hover {
				background: var(--surface-2);
				border-color: var(--stroke-strong);
			}
			.awh-pick-row:active {
				transform: translateY(1px);
			}
			.awh-pick-row:focus-visible {
				outline: var(--focus-ring-width) solid var(--focus-ring-color);
				outline-offset: var(--focus-ring-offset);
			}
			.awh-pick-av {
				width: 40px;
				height: 40px;
				flex: none;
				border-radius: var(--radius-md);
				object-fit: cover;
				background: var(--surface-2);
				border: 1px solid var(--stroke);
			}
			.awh-pick-id {
				display: flex;
				flex-direction: column;
				gap: 2px;
				min-width: 0;
				flex: 1 1 auto;
			}
			.awh-pick-name {
				font-size: var(--text-md);
				font-weight: 600;
				color: var(--ink-bright);
				overflow: hidden;
				text-overflow: ellipsis;
				white-space: nowrap;
			}
			.awh-pick-sub {
				font-family: var(--font-mono, ui-monospace, monospace);
				font-size: var(--text-sm);
				color: var(--ink-dim);
				overflow: hidden;
				text-overflow: ellipsis;
				white-space: nowrap;
			}
			.awh-pick-state {
				flex: none;
				font-size: var(--text-2xs, 0.6875rem);
				font-weight: 600;
				padding: 2px 8px;
				border-radius: var(--radius-pill, 999px);
				border: 1px solid transparent;
				white-space: nowrap;
			}
			.awh-pick-state[data-state='ready'] {
				color: var(--success);
				background: color-mix(in srgb, var(--success) 14%, transparent);
				border-color: color-mix(in srgb, var(--success) 35%, transparent);
			}
			.awh-pick-state[data-state='preparing'] {
				color: var(--warn);
				background: color-mix(in srgb, var(--warn) 12%, transparent);
				border-color: color-mix(in srgb, var(--warn) 32%, transparent);
			}
			.awh-pick-go {
				flex: none;
				color: var(--ink-dim);
				transition: transform var(--duration-fast) var(--ease-standard);
			}
			.awh-pick-row:hover .awh-pick-go {
				transform: translateX(2px);
				color: var(--ink);
			}
			.awh-pick-foot {
				justify-content: flex-start;
			}
			@media (max-width: 420px) {
				.awh-pick-state {
					display: none;
				}
			}
			@media (prefers-reduced-motion: reduce) {
				.awh-pick-row,
				.awh-pick-go {
					transition: none;
				}
			}
		</style>
