# Build-only verification for the agent-orders image.
#
# cloudbuild.yaml (the real one) always ends in `gcloud run deploy`, and deploys
# are owner-gated, so there was no way to prove the image still builds without
# shipping it. This config runs the SAME Dockerfile against the SAME repo-root
# context and stops before push and deploy: nothing is tagged in Artifact
# Registry, nothing is deployed, no service changes.
#
# Building this image locally is not a substitute. The Dockerfile installs the
# full root workspace (3000+ packages) and compiles agent-payments-sdk, which
# needs more memory than a dev container typically has, and the local docker
# context is not filtered by .gcloudignore so it also walks a multi-GB dist/.
#
#   gcloud builds submit . \
#     --config workers/agent-orders/cloudbuild.verify.yaml \
#     --ignore-file workers/agent-orders/verify.gcloudignore \
#     --region us-central1 --project aerial-vehicle-466722-p5
#
# The --ignore-file narrows the upload to the paths this Dockerfile actually
# COPYs (~96 MB instead of the ~1.5 GB the repo-wide .gcloudignore allows, which
# re-includes dist/ and public/ for the three-ws-api image). Note that gitignore
# semantics cannot re-include a path whose parent directory is excluded, so that
# file re-includes /workers/ wholesale rather than /workers/agent-orders/.

# The project's default compute service account was deleted, so an unpinned
# submit fails with "Unknown service account".
serviceAccount: projects/aerial-vehicle-466722-p5/serviceAccounts/three-ws-build@aerial-vehicle-466722-p5.iam.gserviceaccount.com

steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --file
      - workers/agent-orders/Dockerfile
      - --tag
      - agent-orders:verify
      - .
    timeout: 1800s

options:
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY

timeout: 1900s
