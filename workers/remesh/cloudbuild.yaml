# Builds run as the pinned three-ws-build service account: the project's default
# compute service account was deleted, so an unpinned submit fails with
# "Unknown service account".
serviceAccount: projects/aerial-vehicle-466722-p5/serviceAccounts/three-ws-build@aerial-vehicle-466722-p5.iam.gserviceaccount.com

substitutions:
  _REGION: us-central1
  _RUN_SA: avatar-reconstruction-sa@aerial-vehicle-466722-p5.iam.gserviceaccount.com
  _SERVICE: remesh-service
  _REPO: remesh-service
  _GCS_BUCKET: three-ws-avatar-reconstructions
  # Kept warm (not scale-to-zero): this worker backs Game-Ready export and the
  # paid pipeline's remesh stage, and a cold start on an 8 vCPU / 16 GiB Python
  # image is a user-facing multi-second stall mid-export. CPU-only, no GPU,
  # cheap to keep resident against the GCP credit pool. 2026-07-16.
  _MIN_INSTANCES: "1"
  _MAX_INSTANCES: "3"

steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    dir: workers/remesh
    args:
      - build
      - --tag
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/server:$SHORT_SHA
      - --tag
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/server:latest
      - --cache-from
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/server:latest
      - .

  - id: push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/server

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/server:$SHORT_SHA
      - --region=${_REGION}
      - --service-account=${_RUN_SA}
      - --platform=managed
      - --port=8080
      - --cpu=8
      - --memory=16Gi
      - --min-instances=${_MIN_INSTANCES}
      - --max-instances=${_MAX_INSTANCES}
      - --timeout=300
      # /process answers 202 and finishes the job in a FastAPI BackgroundTask,
      # so the work runs entirely outside a request. Under Cloud Run's default
      # throttling the container gets almost no CPU there: on 2026-08-09 a
      # 2000-face lowpoly bake that takes ~160 s under load took 51,173 s (14 h)
      # once the caller stopped polling, and on 2026-08-06 a quad job tripped
      # the 600 s QuadriFlow guard for the same reason. Always-on CPU is what
      # every other task-shaped worker here already deploys with.
      - --no-cpu-throttling
      - --allow-unauthenticated
      - --set-env-vars=GCS_BUCKET=${_GCS_BUCKET},MAX_CONCURRENT=2
      - --set-secrets=API_KEY=avatar-reconstruction-key:latest

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/server:$SHORT_SHA
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/server:latest

options:
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY
