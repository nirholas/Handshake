substitutions:
  _REGION: us-central1
  _RUN_SA: avatar-reconstruction-sa@aerial-vehicle-466722-p5.iam.gserviceaccount.com
  _SERVICE: model-hunyuan3d
  _REPO: model-hunyuan3d
  _GCS_BUCKET: three-ws-avatar-reconstructions
  _WEIGHTS_BUCKET: three-ws-model-weights
  # min=1: model-trellis found a cold FUSE-mounted weight load (this tree
  # loads ~25 GiB across three sub-models, far larger than TRELLIS's 3 GiB)
  # can stall 15+ minutes instead of loading in seconds — keeping one instance
  # warm avoids paying that on every idle-to-active transition. GCP credit
  # budget covers the always-on GPU-hour.
  # max=1: the region's Cloud Run L4 allocation is shared with model-trellis
  # (min 1) and unirig (min 1); one standing Hunyuan3D instance fills the
  # known quota of 3, so a second instance could never schedule anyway.
  _MIN_INSTANCES: "1"
  _MAX_INSTANCES: "1"

steps:
  # --cache-from only consults images already present on the builder — without
  # this pull every rebuild recompiles the CUDA extensions (~35 min) from
  # scratch and blows the build timeout. Best-effort: a missing :latest (first
  # build) just skips the cache.
  - id: pull-cache
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args: ['-c', 'docker pull ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/server:latest || exit 0']

  - id: build
    name: gcr.io/cloud-builders/docker
    dir: workers/model-hunyuan3d
    args:
      - build
      - --tag
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/server:$SHORT_SHA
      - --tag
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/server:latest
      - --cache-from
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/server:latest
      - .

  - id: push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/server

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/server:$SHORT_SHA
      - --region=${_REGION}
      - --service-account=${_RUN_SA}
      - --platform=managed
      - --port=8080
      - --gpu=1
      - --gpu-type=nvidia-l4
      - --no-gpu-zonal-redundancy
      - --no-cpu-throttling
      - --cpu=8
      - --memory=32Gi
      - --min-instances=${_MIN_INSTANCES}
      - --max-instances=${_MAX_INSTANCES}
      - --timeout=900
      - --allow-unauthenticated
      - --add-volume=name=weights,type=cloud-storage,bucket=${_WEIGHTS_BUCKET}
      - --add-volume-mount=volume=weights,mount-path=/weights
      - --set-env-vars=GCS_BUCKET=${_GCS_BUCKET},WEIGHTS_DIR=/weights/hunyuan3d-2,MAX_CONCURRENT=1,WEIGHTS_GCS_URI=gs://${_WEIGHTS_BUCKET}/hunyuan3d-2,WEIGHTS_LOCAL_DIR=/tmp/hunyuan3d-2
      - --set-secrets=API_KEY=avatar-reconstruction-key:latest

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/server:$SHORT_SHA
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/server:latest

options:
  machineType: E2_HIGHCPU_32
  logging: CLOUD_LOGGING_ONLY

# The project's default compute service account was deleted (see
# docs/ops/gcp-production.md) — every Cloud Build must pin the build SA
# explicitly or the submit fails with "Unknown service account".
serviceAccount: projects/aerial-vehicle-466722-p5/serviceAccounts/three-ws-build@aerial-vehicle-466722-p5.iam.gserviceaccount.com

# CUDA custom-rasterizer + mesh-processor compiles push past the 10-minute default.
timeout: 3600s
