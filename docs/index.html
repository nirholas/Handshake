<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Docs — three.ws</title>
		<meta name="description" content="Documentation for three.ws — the open-source platform for 3D AI agents." />
		<meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1" />

		<meta property="og:description" content="Full documentation: SDKs, API reference, embedding, agent system, smart contracts." />
		<meta property="og:image" content="https://three.ws/api/page-og?s=learn&amp;t=Docs&amp;d=Full+documentation%3A+SDKs%2C+API+reference%2C+embedding%2C+agent+system%2C+smart+contracts.&amp;p=%2Fdocs" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta property="og:image:alt" content="three.ws documentation" />
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:site" content="@trythreews" />
		<meta name="twitter:title" content="Docs · three.ws" />
		<meta name="twitter:description" content="Full documentation: SDKs, API reference, embedding, agent system, smart contracts." />
		<meta name="twitter:image" content="https://three.ws/api/page-og?s=learn&amp;t=Docs&amp;d=Full+documentation%3A+SDKs%2C+API+reference%2C+embedding%2C+agent+system%2C+smart+contracts.&amp;p=%2Fdocs" />
		<link rel="icon" href="/favicon.ico" />
		<link rel="stylesheet" href="/fonts/fonts.css" />
		<link rel="stylesheet" href="/style.css" />
		<link
			rel="stylesheet"
			href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css"
		/>
		<link rel="stylesheet" href="/docs-live.css" />
		<!-- Cookbook recipes and tutorials both use `figure:` directives, and both
		     render here as well as in the standalone viewers. Without the resolver
		     this shell paints <img src="figure:img:…">, which is a broken image and
		     an ERR_UNKNOWN_URL_SCHEME per figure. Same files the tutorial viewer
		     loads, so a figure looks identical on every surface. -->
		<link rel="stylesheet" href="/tutorial-figures.css" />
		<script src="/tutorial-figures.js"></script>
		<script src="/model-viewer-meshopt.js"></script>
		<script src="https://cdn.jsdelivr.net/npm/marked@9.1.6/marked.min.js"></script>
		<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
		<style>
			:root {
				--sidebar-w: 268px;
				--header-h: 52px;
				--docs-accent: #8b5cf6;
				--docs-accent-soft: rgba(139, 92, 246, 0.12);
				--docs-bg: #09090f;
				--sidebar-bg: #0c0c13;
				--border: rgba(255, 255, 255, 0.07);
				/* 0.62 alpha, not 0.5: composited on --docs-bg #09090f that's 6.1:1
				   contrast (axe AA needs 4.5:1; 0.5 measured 4.32 and failed). */
				--text-muted: rgba(224, 224, 224, 0.62);
				--text-body: rgba(224, 224, 224, 0.85);
			}
			*,
			*::before,
			*::after {
				box-sizing: border-box;
			}
			html,
			body {
				margin: 0;
				padding: 0;
				height: auto;
				overflow: visible;
			}
			body {
				background: var(--docs-bg);
				color: #e0e0e0;
				font-family: var(--font-body);
				font-size: var(--text-base);
				line-height: 1.65;
				display: block;
			}

			/* ── Header ─────────────────────────────────── */
			.docs-header {
				position: fixed;
				top: 0;
				left: 0;
				right: 0;
				height: var(--header-h);
				background: rgba(9, 9, 15, 0.88);
				backdrop-filter: blur(16px);
				-webkit-backdrop-filter: blur(16px);
				border-bottom: 1px solid var(--border);
				display: flex;
				align-items: center;
				padding: 0 var(--space-lg);
				gap: var(--space-md);
				z-index: 100;
			}
			.docs-logo {
				font-family: var(--font-display);
				font-size: var(--text-lg);
				font-weight: 600;
				color: #fff;
				text-decoration: none;
				display: flex;
				align-items: center;
				gap: 7px;
				flex-shrink: 0;
			}
			.docs-logo-dot {
				width: 9px;
				height: 9px;
				border-radius: 50%;
				background: linear-gradient(135deg, #a78bfa 0%, #6366f1 100%);
				flex-shrink: 0;
			}
			.docs-logo-mark {
				width: 24px;
				height: 24px;
				flex-shrink: 0;
				filter: grayscale(1) contrast(1.05) brightness(1.08)
					drop-shadow(0 0 5px rgba(139, 92, 246, 0.45))
					drop-shadow(0 0 1px rgba(99, 102, 241, 0.55));
			}
			.docs-header-sep {
				width: 1px;
				height: 18px;
				background: var(--border);
				flex-shrink: 0;
			}
			.docs-header-label {
				font-size: var(--text-sm);
				color: var(--text-muted);
				font-family: var(--font-body);
			}
			.docs-header-right {
				margin-left: auto;
				display: flex;
				align-items: center;
				gap: var(--space-sm);
			}
			.docs-header-right a {
				font-size: var(--text-sm);
				color: var(--text-muted);
				text-decoration: none;
				padding: 4px 10px;
				border-radius: var(--radius-md);
				transition: color 0.15s, background 0.15s;
			}
			.docs-header-right a:hover {
				color: #fff;
				background: rgba(255, 255, 255, 0.05);
			}
			.docs-header-right .btn-primary {
				background: var(--docs-accent-soft);
				color: #c4b5fd;
				border: 1px solid rgba(139, 92, 246, 0.25);
			}
			.docs-header-right .btn-primary:hover {
				background: rgba(139, 92, 246, 0.2);
				color: #ddd6fe;
			}
			.docs-header-right .docs-world-link {
				display: inline-flex;
				align-items: center;
				gap: 5px;
				color: #c4b5fd;
				border: 1px solid rgba(139, 92, 246, 0.3);
				background: linear-gradient(120deg, rgba(139, 92, 246, 0.14), rgba(59, 130, 246, 0.1));
			}
			.docs-header-right .docs-world-link:hover {
				color: #ede9fe;
				border-color: rgba(139, 92, 246, 0.55);
				background: linear-gradient(120deg, rgba(139, 92, 246, 0.24), rgba(59, 130, 246, 0.18));
			}
			.docs-header-right .docs-world-link svg {
				opacity: 0.85;
			}
			@media (max-width: 560px) {
				.docs-header-right .docs-world-link span {
					display: none;
				}
			}

			/* ── Shell ───────────────────────────────────── */
			.docs-shell {
				display: flex;
				padding-top: var(--header-h);
				min-height: 100vh;
			}

			/* ── Sidebar ─────────────────────────────────── */
			.docs-sidebar {
				position: fixed;
				top: var(--header-h);
				left: 0;
				bottom: 0;
				width: var(--sidebar-w);
				background: var(--sidebar-bg);
				border-right: 1px solid var(--border);
				overflow-y: auto;
				padding: var(--space-md) 0 var(--space-2xl);
				scrollbar-width: thin;
				scrollbar-color: rgba(255, 255, 255, 0.08) transparent;
			}
			.docs-sidebar::-webkit-scrollbar {
				width: 3px;
			}
			.docs-sidebar::-webkit-scrollbar-thumb {
				background: rgba(255, 255, 255, 0.08);
				border-radius: 2px;
			}

			/* Designed sidebar states: manifest load failed, or a search that
			   matched nothing. Both used to render an unexplained blank column. */
			.sidebar-empty {
				margin: var(--space-sm);
				padding: 14px;
				border: 1px solid var(--border);
				border-radius: var(--radius-md);
				background: rgba(255, 255, 255, 0.02);
			}
			.sidebar-empty p {
				margin: 0 0 8px;
				font-size: var(--text-sm);
				line-height: 1.5;
				color: rgba(255, 255, 255, 0.55);
			}
			.sidebar-empty-title {
				color: #ddd6fe !important;
				font-weight: 600;
			}
			.sidebar-empty-btn {
				display: inline-flex;
				align-items: center;
				margin-top: 2px;
				padding: 6px 12px;
				font: inherit;
				font-size: var(--text-sm);
				color: #c4b5fd;
				background: rgba(139, 92, 246, 0.12);
				border: 1px solid rgba(139, 92, 246, 0.3);
				border-radius: var(--radius-md);
				cursor: pointer;
				transition: background 0.15s, border-color 0.15s, color 0.15s;
			}
			.sidebar-empty-btn:hover:not(:disabled) {
				color: #ede9fe;
				background: rgba(139, 92, 246, 0.22);
				border-color: rgba(139, 92, 246, 0.55);
			}
			.sidebar-empty-btn:focus-visible {
				outline: 2px solid rgba(139, 92, 246, 0.7);
				outline-offset: 2px;
			}
			.sidebar-empty-btn:disabled {
				opacity: 0.6;
				cursor: default;
			}

			.sidebar-search {
				margin: 0 var(--space-sm) var(--space-md);
				position: relative;
			}
			.sidebar-search input {
				width: 100%;
				background: rgba(255, 255, 255, 0.04);
				border: 1px solid var(--border);
				border-radius: var(--radius-md);
				padding: 7px 10px 7px 32px;
				font-size: var(--text-sm);
				color: #ccc;
				outline: none;
				font-family: var(--font-body);
				transition: border-color 0.15s, background 0.15s;
			}
			.sidebar-search input::placeholder {
				color: rgba(255, 255, 255, 0.25);
			}
			.sidebar-search input:focus {
				border-color: rgba(139, 92, 246, 0.5);
				background: rgba(139, 92, 246, 0.05);
			}
			.sidebar-search-icon {
				position: absolute;
				left: 9px;
				top: 50%;
				transform: translateY(-50%);
				pointer-events: none;
				opacity: 0.35;
			}
			.sidebar-search kbd {
				position: absolute;
				right: 8px;
				top: 50%;
				transform: translateY(-50%);
				pointer-events: none;
				font: 600 10px/1 var(--font-mono, ui-monospace, monospace);
				color: rgba(255, 255, 255, 0.28);
				border: 1px solid var(--border);
				border-radius: 4px;
				padding: 3px 5px;
				transition: opacity 0.15s;
			}
			.sidebar-search input:focus ~ kbd,
			.sidebar-search input:not(:placeholder-shown) ~ kbd {
				opacity: 0;
			}

			/* Full-text results from the docs search index. Rendered above the
			   filtered page list because a content match is almost always what
			   someone typing a question is looking for. */
			.sidebar-results {
				margin: 0 var(--space-sm) var(--space-md);
			}
			.sidebar-results[hidden] {
				display: none;
			}
			.sidebar-results-head {
				display: flex;
				align-items: baseline;
				justify-content: space-between;
				gap: 8px;
				font-size: 10px;
				font-weight: 700;
				letter-spacing: 0.1em;
				text-transform: uppercase;
				color: rgba(255, 255, 255, 0.32);
				padding: 0 4px 6px;
			}
			.sidebar-hit {
				display: block;
				padding: 7px 9px;
				border-radius: var(--radius-md);
				text-decoration: none;
				border: 1px solid transparent;
				transition: background 0.12s, border-color 0.12s;
			}
			.sidebar-hit:hover,
			.sidebar-hit:focus-visible,
			.sidebar-hit[aria-selected='true'] {
				background: rgba(139, 92, 246, 0.1);
				border-color: rgba(139, 92, 246, 0.35);
				outline: none;
			}
			.sidebar-hit-title {
				display: block;
				font-size: var(--text-sm);
				color: #e6e6e6;
				line-height: 1.35;
			}
			.sidebar-hit-title mark {
				background: rgba(139, 92, 246, 0.28);
				color: #fff;
				border-radius: 2px;
				padding: 0 1px;
			}
			.sidebar-hit-doc {
				display: block;
				font-size: 11px;
				color: rgba(255, 255, 255, 0.38);
				margin-top: 2px;
				overflow: hidden;
				text-overflow: ellipsis;
				white-space: nowrap;
			}
			.sidebar-results-note {
				padding: 4px 5px 0;
				font-size: 11px;
				color: rgba(255, 255, 255, 0.34);
				line-height: 1.5;
			}

			.sidebar-section {
				margin-bottom: var(--space-md);
			}
			.sidebar-section-title {
				display: block;
				font-size: 10px;
				font-weight: 700;
				letter-spacing: 0.1em;
				text-transform: uppercase;
				/* 0.55 alpha, not 0.28: on --sidebar-bg #0c0c13 that's 6.3:1 (axe AA
				   needs 4.5:1 even for bold text this small; 0.28 measured 2.43). */
				color: rgba(255, 255, 255, 0.55);
				padding: 0 var(--space-sm) 5px var(--space-md);
			}
			.sidebar-link {
				display: block;
				padding: 5px var(--space-sm) 5px var(--space-md);
				font-size: 13.5px;
				color: rgba(255, 255, 255, 0.52);
				text-decoration: none;
				border-left: 2px solid transparent;
				transition: color 0.12s, background 0.12s, border-color 0.12s;
				white-space: nowrap;
				overflow: hidden;
				text-overflow: ellipsis;
				line-height: 1.5;
			}
			.sidebar-link:hover {
				color: rgba(255, 255, 255, 0.9);
				background: rgba(255, 255, 255, 0.035);
			}
			.sidebar-link.active {
				color: #c4b5fd;
				border-left-color: var(--docs-accent);
				background: var(--docs-accent-soft);
				font-weight: 500;
			}
			.sidebar-link.external::after {
				content: '↗';
				font-size: 10px;
				margin-left: 4px;
				opacity: 0.5;
			}

			/* ── Main ────────────────────────────────────── */
			.docs-main {
				flex: 1;
				/* A flex item's min-width is auto, so a wide table or code block
				   inside would stretch the column past the viewport and put a
				   horizontal scrollbar on the whole page. */
				min-width: 0;
				margin-left: var(--sidebar-w);
				padding: var(--space-2xl) clamp(var(--space-lg), 5vw, var(--space-2xl)) 100px;
			}
			.docs-content {
				max-width: 728px;
				margin-inline: auto;
			}

			/* Jumping to a section must not park it under the fixed header. */
			.docs-content :is(h2, h3, h4) {
				scroll-margin-top: 88px;
			}

			/* ── Markdown typography ─────────────────────── */
			.docs-content h1 {
				font-family: var(--font-display);
				font-weight: 500;
				font-size: clamp(var(--text-xl), 3vw, var(--text-2xl));
				letter-spacing: -0.03em;
				margin: 0 0 var(--space-sm);
				color: #fff;
				line-height: 1.2;
			}
			.docs-content h2 {
				font-family: var(--font-display);
				font-weight: 500;
				font-size: var(--text-xl);
				letter-spacing: -0.02em;
				margin: var(--space-2xl) 0 var(--space-sm);
				padding-bottom: var(--space-xs);
				border-bottom: 1px solid var(--border);
				color: #fff;
				line-height: 1.3;
			}
			.docs-content h2:first-child {
				margin-top: 0;
			}
			.docs-content h3 {
				font-weight: 600;
				font-size: var(--text-lg);
				margin: var(--space-xl) 0 var(--space-xs);
				color: #f0f0f0;
			}
			.docs-content h4 {
				font-weight: 600;
				font-size: var(--text-base);
				margin: var(--space-lg) 0 var(--space-xs);
				color: #ddd;
			}
			.docs-content p {
				color: var(--text-body);
				margin: 0 0 var(--space-md);
			}
			.docs-content ul,
			.docs-content ol {
				padding-left: var(--space-lg);
				margin: 0 0 var(--space-md);
			}
			.docs-content li {
				color: var(--text-body);
				margin-bottom: 4px;
			}
			.docs-content li > ul,
			.docs-content li > ol {
				margin-top: 4px;
				margin-bottom: 4px;
			}
			.docs-content a {
				color: #a78bfa;
				text-decoration: none;
				border-bottom: 1px solid rgba(167, 139, 250, 0.25);
				transition: color 0.12s, border-color 0.12s;
			}
			.docs-content a:hover {
				color: #c4b5fd;
				border-bottom-color: rgba(196, 181, 253, 0.5);
			}
			.docs-content strong {
				color: #fff;
				font-weight: 600;
			}
			.docs-content em {
				color: rgba(224, 224, 224, 0.75);
			}
			.docs-content code {
				font-family: var(--font-mono);
				font-size: 0.875em;
				background: rgba(139, 92, 246, 0.1);
				border: 1px solid rgba(139, 92, 246, 0.18);
				padding: 1px 5px;
				border-radius: 3px;
				color: #c4b5fd;
			}
			.docs-content pre {
				background: #0d0d18;
				border: 1px solid rgba(255, 255, 255, 0.07);
				border-radius: var(--radius-md);
				padding: var(--space-md);
				overflow-x: auto;
				margin: 0 0 var(--space-md);
				position: relative;
			}
			.docs-content pre code {
				background: transparent;
				border: none;
				padding: 0;
				color: inherit;
				font-size: var(--text-sm);
				line-height: 1.6;
			}
			.docs-content blockquote {
				border-left: 3px solid var(--docs-accent);
				margin: 0 0 var(--space-md);
				padding: var(--space-xs) var(--space-md);
				background: rgba(139, 92, 246, 0.06);
				border-radius: 0 var(--radius-md) var(--radius-md) 0;
			}
			.docs-content blockquote p {
				color: rgba(224, 224, 224, 0.7);
				margin: 0;
			}
			.docs-content table {
				width: 100%;
				border-collapse: collapse;
				margin: 0 0 var(--space-md);
				font-size: 13.5px;
				/* Reference tables are wider than a phone. Scroll the table inside
				   its own box rather than the whole page sideways. */
				display: block;
				overflow-x: auto;
			}
			.docs-content th {
				text-align: left;
				padding: 8px var(--space-sm);
				border-bottom: 1px solid rgba(255, 255, 255, 0.1);
				color: rgba(255, 255, 255, 0.45);
				font-weight: 600;
				font-size: 11px;
				letter-spacing: 0.06em;
				text-transform: uppercase;
			}
			.docs-content td {
				padding: 9px var(--space-sm);
				border-bottom: 1px solid rgba(255, 255, 255, 0.04);
				color: var(--text-body);
				vertical-align: top;
			}
			.docs-content tr:last-child td {
				border-bottom: none;
			}
			.docs-content hr {
				border: none;
				border-top: 1px solid var(--border);
				margin: var(--space-xl) 0;
			}
			.docs-content img {
				max-width: 100%;
				border-radius: var(--radius-md);
				border: 1px solid var(--border);
			}

			/* ── Loading state ───────────────────────────── */
			.docs-loading {
				display: flex;
				align-items: center;
				gap: var(--space-sm);
				color: var(--text-muted);
				font-size: var(--text-sm);
				padding: var(--space-2xl) 0;
			}
			.docs-loading-dot {
				width: 6px;
				height: 6px;
				border-radius: 50%;
				background: var(--docs-accent);
				animation: blink 1s ease-in-out infinite;
			}
			@keyframes blink {
				0%,
				100% {
					opacity: 0.15;
				}
				50% {
					opacity: 1;
				}
			}

			/* ── Prev/Next nav ───────────────────────────── */
			.docs-pager {
				display: grid;
				grid-template-columns: 1fr 1fr;
				gap: var(--space-sm);
				margin-top: var(--space-2xl);
				padding-top: var(--space-xl);
				border-top: 1px solid var(--border);
			}
			.docs-pager-btn {
				display: flex;
				flex-direction: column;
				gap: 3px;
				padding: var(--space-sm) var(--space-md);
				background: rgba(255, 255, 255, 0.025);
				border: 1px solid var(--border);
				border-radius: var(--radius-md);
				text-decoration: none;
				transition: background 0.15s, border-color 0.15s;
				color: inherit;
			}
			.docs-pager-btn:hover {
				background: rgba(255, 255, 255, 0.05);
				border-color: rgba(255, 255, 255, 0.12);
				border-bottom-color: rgba(255, 255, 255, 0.12);
			}
			.docs-pager-btn .pager-dir {
				font-size: 10px;
				text-transform: uppercase;
				letter-spacing: 0.08em;
				color: var(--text-muted);
			}
			.docs-pager-btn .pager-title {
				font-size: var(--text-sm);
				font-weight: 500;
				color: #e0e0e0;
			}
			.docs-pager-btn.next {
				text-align: right;
			}
			.docs-pager-btn.placeholder {
				visibility: hidden;
			}

			/* ── Mobile toggle ───────────────────────────── */
			.sidebar-fab {
				display: none;
				position: fixed;

	</head>
	<body>
		<header class="docs-header">

		<div class="docs-shell">
			<aside class="docs-sidebar" id="sidebar">
				<div class="sidebar-search">
					<svg
						class="sidebar-search-icon"
						width="14"
						height="14"
						fill="none"
						viewBox="0 0 24 24"
						stroke="currentColor"
						stroke-width="2.2"
					>
						<circle cx="11" cy="11" r="8" /><path d="m21 21-4.35-4.35" />
					</svg>
					<input
						type="text"
						id="search-input"
						placeholder="Search the docs…"
						autocomplete="off"
						spellcheck="false"
						role="combobox"
						aria-expanded="false"
						aria-controls="content-results"
						aria-autocomplete="list"
						aria-label="Search the documentation"
					/>

				</div>
				<div
					class="sidebar-results"
					id="content-results"
					role="listbox"
					aria-label="Documentation content matches"
					hidden
				></div>
				<nav id="sidebar-nav"></nav>
			</aside>

			<main class="docs-main">
				<div class="docs-content" id="docs-content">
					<!-- Static fallback for crawlers and no-JS readers; the runtime
					     markdown render replaces this node's contents wholesale. -->
					<h1>three.ws documentation</h1>
					<p>
						Guides and reference for building on three.ws: SDKs, the HTTP API,
						one-tag avatar embeds, the agent system, and smart contracts. Pick a
						topic from the sidebar, or start with
						<a href="/docs/start-here">Start here</a>.

		</div>

		<div class="sidebar-overlay" id="sidebar-overlay"></div>
		<button class="sidebar-fab" id="sidebar-fab" aria-label="Open navigation">
			<svg
				width="20"
				height="20"
				fill="none"
				viewBox="0 0 24 24"
				stroke="currentColor"
				stroke-width="2"
			>
				<path d="M4 6h16M4 12h10M4 18h16" />
			</svg>
		</button>

		<script>
			// The sidebar manifest lives in /docs/nav.json: one source of truth shared
			// with the immersive 3D docs world at /docs/world. Loaded by the boot at
			// the bottom of this script; until then both stay empty.
			let NAV = [];
			let ALL_PAGES = [];
			// Non-null once a manifest load has failed, so buildSidebar can tell
			// "still loading" (blank, briefly) apart from "load failed" (designed).
			let navError = null;

			// The hash is the doc route, which means a plain "#section" link inside a
			// page would be read as "load the doc named section" and 404 the reader
			// out of the page they were reading. Section links therefore route as
			// "#<doc>@<section>": the doc part navigates, the part after @ scrolls.
			// One exception, for links written by hand and shared: on first load a
			// bare "#section" on a /docs/<doc> URL is that doc's section, not a doc.
			let booted = false;

			function currentRoute() {
				const hash = location.hash.slice(1).replace(/^\//, '');
				const m = location.pathname.match(/^\/docs\/([^/]+)$/);
				const fromUrl = m ? m[1] : '';
				if (hash.includes('@')) {
					const at = hash.indexOf('@');
					return {
						path: hash.slice(0, at) || fromUrl || 'start-here',
						anchor: hash.slice(at + 1),
					};
				}
				if (hash) {
					if (!booted && fromUrl) return { path: fromUrl, anchor: hash };
					return { path: hash, anchor: '' };
				}
				return { path: fromUrl || 'start-here', anchor: '' };
			}

			function currentPath() {
				return currentRoute().path;
			}

			function slugifyHeading(text) {
				return (text || '')
					.trim()
					.toLowerCase()
					.replace(/[^\w\- ]+/g, '')
					.replace(/ /g, '-');
			}

			function scrollToAnchor(anchor) {
				if (!anchor) {
					window.scrollTo({ top: 0 });
					return;
				}
				let target = document.getElementById(anchor);
				if (!target) {
					// Older docs carry hand-written anchors that punctuate differently
					// from the slug. Match on letters and digits alone before giving up.
					const loose = s => s.toLowerCase().replace(/[^a-z0-9]+/g, '');
					const want = loose(anchor);
					target = [...document.querySelectorAll('#docs-content h2, #docs-content h3, #docs-content h4')].find(
						h => loose(h.id) === want || loose(h.textContent) === want,
					);
				}
				if (target) target.scrollIntoView({ block: 'start' });
				else window.scrollTo({ top: 0 });
			}

			function buildSidebar(filter) {
				const q = (filter || '').toLowerCase();
				const current = currentPath();
				const nav = document.getElementById('sidebar-nav');
				// The manifest is a network fetch, so it has a real failure mode. An
				// empty sidebar reads as "this product has no docs" rather than "one
				// request failed", so say which it is and offer the way out. The
				// article itself still renders: only navigation depends on the manifest.
				if (!NAV.length && navError) {
					nav.innerHTML = '';
					const box = document.createElement('div');
					box.className = 'sidebar-empty';
					box.innerHTML =
						'<p class="sidebar-empty-title">Contents unavailable</p>' +
						'<p>The page list could not be loaded. The page you are reading is unaffected.</p>';
					const retry = document.createElement('button');
					retry.type = 'button';
					retry.className = 'sidebar-empty-btn';
					retry.textContent = 'Retry';
					retry.addEventListener('click', () => {
						retry.disabled = true;
						retry.textContent = 'Retrying…';
						loadNav();
					});
					box.appendChild(retry);
					nav.appendChild(box);
					return;
				}
				const matched = NAV.some(s => s.links.some(l => !q || l.label.toLowerCase().includes(q)));
				if (q && !matched) {
					nav.innerHTML = '';
					const box = document.createElement('div');
					box.className = 'sidebar-empty';
					box.innerHTML = '<p class="sidebar-empty-title">No matches</p>';
					const p = document.createElement('p');
					p.textContent = 'Nothing in the docs matches “' + filter + '”.';
					const clear = document.createElement('button');
					clear.type = 'button';
					clear.className = 'sidebar-empty-btn';
					clear.textContent = 'Clear search';
					clear.addEventListener('click', () => {
						const input = document.getElementById('search-input');
						input.value = '';
						input.focus();
						buildSidebar('');
					});
					box.append(p, clear);
					nav.appendChild(box);
					return;
				}
				nav.innerHTML = NAV.map(section => {
					const links = section.links.filter(
						l => !q || l.label.toLowerCase().includes(q),
					);
					if (!links.length) return '';
					return `<div class="sidebar-section">
						<span class="sidebar-section-title">${section.title}</span>
						${links
							.map(l => {
								const href = l.href || '#' + l.path;
								const active = !l.href && l.path === current ? ' active' : '';
								const external = l.external ? ' external' : '';
								const target = l.href ? ' target="_blank" rel="noopener"' : '';
								return `<a href="${href}" class="sidebar-link${active}${external}"${target}>${l.label}</a>`;
							})
							.join('')}
					</div>`;
				}).join('');
			}

			marked.setOptions({
				highlight: (code, lang) => {
					if (lang && hljs.getLanguage(lang)) {
						return hljs.highlight(code, { language: lang }).value;
					}
					return hljs.highlightAuto(code).value;
				},
				gfm: true,
				breaks: false,
			});

			const COPY_ICON =
				'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>';
			const CHECK_ICON =
				'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>';
			const EXTERNAL_ICON =
				'<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M9 7h8v8"/></svg>';

			function renderPageTools(path, md) {
				const content = document.getElementById('docs-content');
				const mdUrl = '/docs/' + path + '.md';
				const absMdUrl = 'https://three.ws' + mdUrl;
				const claudePrompt =
					'Read ' +
					absMdUrl +
					' so I can ask questions about this three.ws documentation page.';
				const claudeUrl =
					'https://claude.ai/new?q=' + encodeURIComponent(claudePrompt);

				const wrap = document.createElement('div');
				wrap.className = 'docs-pagetools';
				wrap.innerHTML = `
					<div class="docs-pagetools-group" id="pagetools-group">
						<button type="button" class="docs-pagetools-btn" id="pagetools-copy" title="Copy page as Markdown">
							${COPY_ICON}<span>Copy page</span>
						</button>
						<button type="button" class="docs-pagetools-caret" id="pagetools-caret" aria-label="More options" aria-haspopup="true" aria-expanded="false">
							<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
						</button>
						<div class="docs-pagetools-menu" role="menu">
							<button type="button" class="docs-pagetools-item" id="pagetools-copy-2" role="menuitem">
								<span class="docs-pagetools-icon">${COPY_ICON}</span>
								<span class="docs-pagetools-text">
									<span class="docs-pagetools-title">Copy page</span>
									<span class="docs-pagetools-sub">Copy page as Markdown for LLMs</span>
								</span>
							</button>
							<a class="docs-pagetools-item" href="${mdUrl}" target="_blank" rel="noopener" role="menuitem">
								<span class="docs-pagetools-icon">
									<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2" y="5" width="20" height="14" rx="2.5"/><path d="M6 15V9l3 3 3-3v6" stroke-linecap="round" stroke-linejoin="round"/><path d="M17 9v6m0 0 2-2m-2 2-2-2" stroke-linecap="round" stroke-linejoin="round"/></svg>
								</span>
								<span class="docs-pagetools-text">
									<span class="docs-pagetools-title">View as Markdown ${EXTERNAL_ICON}</span>
									<span class="docs-pagetools-sub">View this page as plain text</span>
								</span>
							</a>
							<a class="docs-pagetools-item" href="${claudeUrl}" target="_blank" rel="noopener" role="menuitem">
								<span class="docs-pagetools-icon">
									<svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.4 13.9 8l5.7.2-4.5 3.5 1.6 5.5L12 14l-4.7 3.2 1.6-5.5L4.4 8.2 10.1 8 12 2.4Z"/></svg>
								</span>
								<span class="docs-pagetools-text">
									<span class="docs-pagetools-title">Open in Claude ${EXTERNAL_ICON}</span>
									<span class="docs-pagetools-sub">Ask questions about this page</span>
								</span>
							</a>
						</div>
					</div>`;
				content.prepend(wrap);

				const group = wrap.querySelector('#pagetools-group');
				const caret = wrap.querySelector('#pagetools-caret');
				const copyBtn = wrap.querySelector('#pagetools-copy');
				const copyBtn2 = wrap.querySelector('#pagetools-copy-2');

				const closeMenu = () => {
					group.classList.remove('open');
					caret.setAttribute('aria-expanded', 'false');
				};
				caret.addEventListener('click', e => {
					e.stopPropagation();
					const open = group.classList.toggle('open');
					caret.setAttribute('aria-expanded', String(open));
				});
				document.addEventListener('click', e => {
					if (!group.contains(e.target)) closeMenu();
				});
				document.addEventListener('keydown', e => {
					if (e.key === 'Escape') closeMenu();
				});

				let resetTimer;
				const label = copyBtn.querySelector('span');
				const doCopy = async () => {
					try {
						await navigator.clipboard.writeText(md);
					} catch {
						const ta = document.createElement('textarea');
						ta.value = md;
						ta.style.position = 'fixed';
						ta.style.opacity = '0';
						document.body.appendChild(ta);
						ta.select();
						document.execCommand('copy');
						document.body.removeChild(ta);
					}
					copyBtn.classList.add('copied');
					copyBtn.innerHTML = CHECK_ICON + '<span>Copied</span>';
					clearTimeout(resetTimer);
					resetTimer = setTimeout(() => {
						copyBtn.classList.remove('copied');
						copyBtn.innerHTML = COPY_ICON + '<span>Copy page</span>';
					}, 1800);
				};
				copyBtn.addEventListener('click', doCopy);
				copyBtn2.addEventListener('click', () => {
					doCopy();
					closeMenu();
				});
			}

			async function loadPage(path, anchor) {
				const content = document.getElementById('docs-content');
				content.innerHTML =
					'<div class="docs-loading"><span class="docs-loading-dot"></span> Loading…</div>';

				try {
					const url = '/docs/' + path + '.md';
					const res = await fetch(url);
					if (!res.ok) throw new Error(res.status);
					const md = await res.text();

					// Turn `figure:` directives into inert slots BEFORE parsing. Left as
					// <img src="figure:…">, the browser fires a request the moment the
					// markup lands and logs ERR_UNKNOWN_URL_SCHEME for every figure.
					const html = marked.parse(
						window.tutorialFigures ? window.tutorialFigures.preprocess(md) : md,
					);
					content.innerHTML = html;

					// Fill those slots with the captured media, the live 3D viewers,
					// and the shared lightbox.
					window.tutorialFigures?.mount(content);

					// Freshness: has anyone checked this page against the code lately?
					// Mounted above the article, before the heavier enhancers, because
					// a reader deciding whether to trust the page should see it first.
					// Fails silently: a missing report must never cost the reader the
					// documentation itself.
					const freshHost = document.createElement('div');
					content.prepend(freshHost);
					import('/doc-freshness.js')
						.then((m) => m.mountBadge(freshHost, m.docPathForSlug(path)))
						.catch(() => freshHost.remove());

					// Markdown images become captioned, zoomable figures sized from
					// the media manifest, so the article never reflows on decode.
					window.DocFigures?.upgrade(content);

					renderPageTools(path, md);

					content.querySelectorAll('pre code').forEach(block => {
						hljs.highlightElement(block);
					});

					// Live Docs: samples that can be run become runnable in place
					// (public/docs-live.js). Loaded lazily on the first rendered
					// page so a reader who never scrolls to a code block never
					// pays for the runner; the module caches after that.
					import('/docs-live.js')
						.then(m => m.enhance(content))
						.catch(() => {
							/* Static samples still read correctly; the copy
							   buttons and highlighting above are unaffected. */
						});

					// Rewrite internal .md links → hash routing. Resolve each href
					// against the current doc's URL so relative links inside nested
					// docs (agent-abilities/chapters/…, tutorials/…) route to the
					// right file instead of being read as /docs-root paths.
					//
					// A link that resolves OUTSIDE /docs/ (e.g. ../../src/foo/README.md,
					// a reference to repo source) can never be fetched by this viewer.
					// Send those to GitHub rather than hash-routing them into a 404.
					const REPO = 'https://github.com/nirholas/three.ws/blob/main';
					content.querySelectorAll('a[href]').forEach(a => {
						if (a.closest('.docs-pagetools')) return;
						const h = a.getAttribute('href');
						if (!h || h.startsWith('http') || h.startsWith('mailto:')) return;
						// A section link inside the page: keep it on this doc.
						if (h.startsWith('#')) {
							a.href = '#' + path + '@' + h.slice(1);
							return;
						}
						if (h.endsWith('.md')) {
							const abs = new URL(h, location.origin + '/docs/' + path).pathname;
							if (abs.startsWith('/docs/')) {
								a.href = '#' + abs.slice('/docs/'.length).replace(/\.md$/, '');
							} else {
								a.href = REPO + abs;
								a.target = '_blank';
								a.rel = 'noopener';
							}
						}
					});

					// Add IDs to headings for anchor links. GitHub's slug rules, so a
					// link an author wrote against the file on GitHub resolves here too.
					content.querySelectorAll('h2, h3, h4').forEach(h => {
						if (!h.id) h.id = slugifyHeading(h.textContent);
					});

					// Prev / Next
					const idx = ALL_PAGES.findIndex(p => p.path === path);
					const prev = idx > 0 ? ALL_PAGES[idx - 1] : null;
					const next = idx < ALL_PAGES.length - 1 ? ALL_PAGES[idx + 1] : null;

					const pager = document.createElement('div');
					pager.className = 'docs-pager';
					pager.innerHTML = `
						${prev ? `<a href="#${prev.path}" class="docs-pager-btn prev"><span class="pager-dir">← Previous</span><span class="pager-title">${prev.label}</span></a>` : '<div class="docs-pager-btn placeholder"></div>'}
						${next ? `<a href="#${next.path}" class="docs-pager-btn next"><span class="pager-dir">Next →</span><span class="pager-title">${next.label}</span></a>` : '<div class="docs-pager-btn placeholder"></div>'}
					`;
					content.appendChild(pager);
				} catch {
					content.innerHTML =
						'<p style="color:rgba(255,255,255,0.35);padding-top:2rem">Page not found.</p>';
				}

				scrollToAnchor(anchor);
				buildSidebar(document.getElementById('search-input').value);
			}

			let loadedPath = '';

			function navigate() {
				const { path, anchor } = currentRoute();
				booted = true;
				// The 3D-world button deep-links to the doc being read, so switching
				// surfaces never loses the reader's place.
				const worldLink = document.getElementById('world-link');
				if (worldLink) worldLink.href = '/docs/world#' + path;
				// Jumping between sections of the doc already on screen must not
				// refetch and rebuild it: that would lose the reader's place.
				if (path === loadedPath) {
					scrollToAnchor(anchor);
					return;
				}
				loadedPath = path;
				loadPage(path, anchor);
			}

			window.addEventListener('hashchange', navigate);

			// ── Full-text search over the docs corpus ────────────────────────────
			//
			// The sidebar filter has always matched page TITLES, which only helps a
			// reader who already knows what the page is called. The engine in
			// /docs-search.js answers the other question: "which page says this?" -
			// against an index of every heading and paragraph under docs/.
			//
			// It is loaded on the first keystroke, never on page load: the index is
			// ~1.4 MB and most readers arrive to read, not to search.
			const searchInput = document.getElementById('search-input');
			const resultsBox = document.getElementById('content-results');
			const MIN_QUERY = 2;
			const SEARCH_DEBOUNCE_MS = 90;
			const MAX_HITS = 8;

			let enginePromise = null;
			let searchTimer = null;
			let activeHit = -1;
			let lastQuery = '';

			function loadEngine() {
				if (enginePromise) return enginePromise;
				enginePromise = new Promise(resolve => {
					if (window.twsDocsSearch) return resolve(window.twsDocsSearch);
					const script = document.createElement('script');
					script.src = '/docs-search.js';
					script.onload = () => resolve(window.twsDocsSearch || null);
					// A missing engine degrades to title filtering, which is exactly
					// what this page did before. Nothing user-facing breaks.
					script.onerror = () => resolve(null);
					document.head.appendChild(script);
				}).then(async engine => {
					if (!engine) return null;
					const ok = await engine.ready();
					return ok ? engine : null;
				});
				return enginePromise;
			}

			function escapeHtml(text) {
				return String(text).replace(
					/[&<>"']/g,
					c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c],
				);
			}

			// Highlight the terms that actually earned the match, longest first so
			// "wallet" wins over "wall" and the shorter term cannot split the tag it
			// is nested inside.
			function highlight(text, matched) {
				const safe = escapeHtml(text);
				const terms = (matched || [])
					.filter(t => t && t.length >= MIN_QUERY)
					.sort((a, b) => b.length - a.length)
					.slice(0, 8)
					.map(t => t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'));
				if (!terms.length) return safe;
				return safe.replace(new RegExp('(' + terms.join('|') + ')', 'gi'), '<mark>$1</mark>');
			}

			function clearResults() {
				resultsBox.hidden = true;
				resultsBox.innerHTML = '';
				searchInput.setAttribute('aria-expanded', 'false');
				searchInput.removeAttribute('aria-activedescendant');
				activeHit = -1;
			}

			function renderNote(message) {
				resultsBox.hidden = false;
				resultsBox.innerHTML = '<p class="sidebar-results-note">' + escapeHtml(message) + '</p>';
				searchInput.setAttribute('aria-expanded', 'false');
			}

			function renderHits(hits, query) {
				if (!hits.length) {
					renderNote('No content matches “' + query + '”. Matching page names are listed below.');
					return;
				}
				const head =
					'<div class="sidebar-results-head"><span>In page content</span><span>' +
					hits.length +
					'</span></div>';
				resultsBox.innerHTML =
					head +
					hits
						.map(
							(hit, i) =>
								'<a class="sidebar-hit" role="option" aria-selected="false" id="docs-hit-' +
								i +
								'" href="' +
								escapeHtml(hit.url) +
								'"><span class="sidebar-hit-title">' +
								highlight(hit.heading || hit.docTitle, hit.matched) +
								'</span><span class="sidebar-hit-doc">' +
								escapeHtml(hit.docTitle) +
								'</span></a>',
						)
						.join('');
				resultsBox.hidden = false;
				searchInput.setAttribute('aria-expanded', 'true');
				activeHit = -1;
				searchInput.removeAttribute('aria-activedescendant');
			}

			function moveActive(delta) {
				const rows = [...resultsBox.querySelectorAll('.sidebar-hit')];
				if (!rows.length) return false;
				if (activeHit >= 0 && rows[activeHit]) rows[activeHit].setAttribute('aria-selected', 'false');
				activeHit = (activeHit + delta + rows.length + 1) % (rows.length + 1);
				// The extra slot is "nothing selected", so ArrowUp from the first row
				// returns focus to the query rather than wrapping to the bottom.
				if (activeHit === rows.length) {
					activeHit = -1;
					searchInput.removeAttribute('aria-activedescendant');
					return true;
				}
				const row = rows[activeHit];
				row.setAttribute('aria-selected', 'true');
				row.scrollIntoView({ block: 'nearest' });
				searchInput.setAttribute('aria-activedescendant', row.id);
				return true;
			}

			async function runSearch(query) {
				const trimmed = query.trim();
				lastQuery = trimmed;
				if (trimmed.length < MIN_QUERY) {
					clearResults();
					return;
				}
				const engine = await loadEngine();
				// The reader kept typing while the index loaded; that keystroke's own
				// search is already on its way.
				if (lastQuery !== trimmed) return;
				if (!engine) {
					renderNote('Content search is unavailable. Page names still filter below.');
					return;
				}
				renderHits(engine.query(trimmed, MAX_HITS), trimmed);
			}

			searchInput.addEventListener('input', e => {
				const value = e.target.value;
				buildSidebar(value);
				clearTimeout(searchTimer);
				searchTimer = setTimeout(() => runSearch(value), SEARCH_DEBOUNCE_MS);
			});

			searchInput.addEventListener('keydown', e => {
				if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
					if (moveActive(e.key === 'ArrowDown' ? 1 : -1)) e.preventDefault();
					return;
				}
				if (e.key === 'Enter') {
					const row = resultsBox.querySelectorAll('.sidebar-hit')[activeHit];
					if (row) {
						e.preventDefault();
						row.click();
					}
					return;
				}
				if (e.key === 'Escape') {
					if (resultsBox.hidden && !searchInput.value) return;
					e.preventDefault();
					searchInput.value = '';
					buildSidebar('');
					clearResults();
				}
			});

			resultsBox.addEventListener('click', () => {
				// Navigation is by hash, so the result list would otherwise stay open
				// over the page the reader just chose.
				clearResults();
				if (window.innerWidth <= 860) {
					document.getElementById('sidebar').classList.remove('open');
					document.getElementById('sidebar-overlay').classList.remove('visible');
				}
			});

			// "/" is the near-universal focus-search shortcut. Ignored while the
			// reader is typing somewhere else, so it never swallows a real slash.
			document.addEventListener('keydown', e => {
				if (e.key !== '/' || e.metaKey || e.ctrlKey || e.altKey) return;
				const tag = (e.target.tagName || '').toLowerCase();
				if (tag === 'input' || tag === 'textarea' || e.target.isContentEditable) return;
				e.preventDefault();
				document.getElementById('sidebar').classList.add('open');
				searchInput.focus();
				searchInput.select();
			});

			// /docs?q=… runs the search on arrival, so a search result is a URL
			// someone can send to a colleague.
			const initialQuery = new URLSearchParams(location.search).get('q');
			if (initialQuery) {
				searchInput.value = initialQuery;
				runSearch(initialQuery);
			}

			const fab = document.getElementById('sidebar-fab');
			const sidebar = document.getElementById('sidebar');
			const overlay = document.getElementById('sidebar-overlay');

			fab.addEventListener('click', () => {
				sidebar.classList.add('open');
				overlay.classList.add('visible');
			});
			overlay.addEventListener('click', () => {
				sidebar.classList.remove('open');
				overlay.classList.remove('visible');
			});
			sidebar.addEventListener('click', e => {
				if (e.target.closest('.sidebar-link') && window.innerWidth <= 860) {
					sidebar.classList.remove('open');
					overlay.classList.remove('visible');
				}
			});

			async function loadNav() {
				try {
					const res = await fetch('/docs/nav.json');
					if (!res.ok) throw new Error(res.status);
					const nav = await res.json();
					NAV = Array.isArray(nav.sections) ? nav.sections : [];
					navError = NAV.length ? null : 'empty manifest';
				} catch (err) {
					// Content still loads without the manifest; only the sidebar and
					// prev/next pager degrade. buildSidebar renders the designed
					// failure state rather than an unexplained blank column.
					NAV = [];
					navError = String(err && err.message ? err.message : err);
				}
				ALL_PAGES = NAV.flatMap(s => s.links.filter(l => l.path));
				buildSidebar(document.getElementById('search-input').value);
				navigate();
			}
			loadNav();
		</script>

		<div id="footer-container"></div>
		<script src="/footer.js" defer></script>
	</body>
</html>
